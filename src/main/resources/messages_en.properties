dictionary.d = Crypto dictionary helps to orientate in the new crypto world and its crypto terms. Explains the most common / most important crypto terms forming the cryptocene domain.
dictionary.title = Crypto dictionary
dictionary.description = Crypto dictionary explaining the most common / important terms forming the cryptocurrency domain
dictionary.address.title = Address
dictionary.address.description = are used to send and receive transactions on the network. These are hexadecimal strings that represent your unique identifier
dictionary.arbitraz.title = Arbitrage
dictionary.arbitraz.description = - using unequal prices of a given object in different places / markets for a profit equal to the difference between these prices (in the absence of any related risks)
dictionary.wallets.href = wallets
dictionary.blockchain.href = blockchain
dictionary.in = in
dictionary.airdrop.title = Airdrop
dictionary.airdrop.description = in cryptocurrencies is the process of distribution to new or existing owners of a given currency, or
dictionary.airdrop.description.1 =, where it is sometimes necessary to either own the menu or meet other requirements.
dictionary.altcoin.title = Altcoin (Alt)
dictionary.altcoin.description = - all
dictionary.altcoin.description.2 = (digital currencies) created after Bitcoin are called altcoins.
dictionary.atl.title = ATL (All time Low)
dictionary.atl.description = - is the opposite of ATH, in other words the lowest value that the cryptocurrency reached for the whole period.
dictionary.ath.title = ATH (All time high)
dictionary.ath.description = - the highest price of a given cryptocurrency in its entire history.
dictionary.asic.title = ASIC (Application Specific Integrated Circuit)
dictionary.asic.description = - microchips are made for only one task, namely the extraction of a specific one
dictionary.asic.description.2 = (one that allows the use of brute force = the higher the power, the greater the profit from mining).
dictionary.bearish.title = Bearish market
dictionary.bearish.description = - state when the market has a declining trend.
dictionary.bip.title = BIP (Bitcoin Improvement Proposals)
dictionary.bip.description = translated suggestions for improvement
dictionary.bip.description.2 = Bitcoin
dictionary.bip.description.3 =, which can be submitted by anyone interested in improving the Bitcoin network.
dictionary.btc.title = Bitcoin (BTC)
dictionary.btc.description = - the first digital currency launched in 2009 by a person or group under the pseudonym Satoshi Nakamoto.
dictionary.blockchain.title = Blockchain
dictionary.blockchain.description = - distributed (decentralized) database or network that stores all cryptocurrency public ledgers
dictionary.blocks.title = Blocks
dictionary.blocks.description = - are data packets that transfer permanently recorded data in
dictionary.bullish.title = Bullish market
dictionary.bullish.description = - a state where the market is on an upward trend.
dictionary.coldwallet.title = Cold wallet
dictionary.coldwallet.description = - Digital currencies stored outside the Internet. Examples are a paper wallet, a hardware wallet. The reason for the existence of such types of wallets is greater security. The opposite is the so-called hot wallet.
dictionary.coin.title = Coin
dictionary.coin.description = - one unit of digital cryptocurrency. It is often used as a synonym and a shorter term for a cryptocurrency.
dictionary.crypto.title = Crypto-currency (cryptocurrency)
dictionary.crypto.description = - digital currency based on cryptography.
dictionary.dyor.title = DYOR (Do Your Own Research)
dictionary.dyor.description = - means to do your own research or overview on a given topic or name.
dictionary.dao.title = DAO - (Decentralised Autonomous Organizations)
dictionary.dao.description = in translation means Decentralized Autonomous Organizations - you can imagine them as corporations that can function without any human intervention (autonomy) and have moved all forms of control into uncorruptible business rules.
dictionary.daico.title = DAICO - Decentralized ICO
dictionary.daico.description = - The operation of the ICO will be provided only by a smart contract that will work in the given
dictionary.daico.description.2 =. (First of all
dictionary.daico.description.3 =, since the creator of the idea is Vitalik Buterin)
dictionary.dapp.title = DAPP - (A Decentralized application)
dictionary.dip.title = Dip
dictionary.dip.description = - the lowest point on the graph or the local minimum value
dictionary.dip.description.2 = Also time for bargain shopping.
dictionary.dump.title = Dump
dictionary.dump.description = - a significant drop in the value of a cryptocurrency or stock or commodity.
dictionary.erc20.title = ERC-20
dictionary.erc20.description = - Interface based on which new ones are created
dictionary.erc20.description.2 = based on
dictionary.erc20.description.3 =. In other words, a smart contract that implements a given ERC-20 regulation.
dictionary.erc20.description.4 = Learn more about what the ERC-20 describes here.
dictionary.erc223.title = ERC-223
dictionary.erc223.description = - successor to the ERC20 standard. It should bring, among other things, cheaper transactions and, for example, the ability to select long-lost tokens to which no one has access. More info
dictionary.erc721.title = ERC-721
dictionary.erc721.description = is a standard token in the Ethereum network that allows you to produce only NFT tokens and forces developers to create and deploy a new smart contract for each new token. By comparison, the ERC-1155 token standard allows the creation of both NFT tokens and fungible tokens. It is not necessary to create and deploy a new smart contract for each token. Only one is enough.
dictionary.erc1155.title = ERC-1155
dictionary.erc1155.description = ERC-1155 is a token standard that allows you to create so-called Non-fungible tokens (NFT) as well as fungible tokens on the Ethereum network. The ERC-1155 token standard was created to function as an automata, where developers can deploy a single smart contract to create unlimited replaceable (identical) tokens as well as (unique) NFT tokens. By comparison, the ERC-721 token standard only produces NFT tokens and forces developers to deploy and create a new smart contract for each new token.
dictionary.ep5.title = EP-5
dictionary.ep5.description = - Similar to ERC20 or ERC223, this is a standard token but for
dictionary.exchange.title = Exchange
dictionary.exchange.description = - a website with a digital exchange where they buy and sell
dictionary.fomo.title = FOMO (The Fear Of Missing Out)
dictionary.fomo.description = - emotion of fear of missed opportunity. It is often the cause of buying currency at its peak or selling at a loss.
dictionary.fork.title = FORK
dictionary.fork.description = - A software update that results in a change that may be compatible or incompatible with the current software version. See hard fork, soft fork.
dictionary.fud.title = FUD (Fear, Uncertainty, and Doubt)
dictionary.fud.description = - a mixture of emotions such as fear, uncertainty and doubt, caused by negative news from the world of cryptocurrencies. As a result of such panic, the price can often fall.
dictionary.fudster.title = FUDster
dictionary.fudster.description = - is someone who spreads FUD media.
dictionary.fiat.title = FIAT
dictionary.fiat.description = - official currencies issued by governments (EUR, USD, etc.)
dictionary.fundament.title = Fundamental Analysis
dictionary.fundament.description = - analysis based on publicly available information to determine the future price
dictionary.fundament.description.2 = / stocks ...
dictionary.genesis.title = Genesis block
dictionary.genesis.description = - The very first block in
dictionary.genesis.description.2 = blockchain
dictionary.halving.title = Halving
dictionary.halving.description = - is an event in which the division of rewards for the occupied occurs
dictionary.halving.description.2 = exactly half block. This event will also halve the inflation rate and also the speed at which new Bitcoins enter circulation. This happens once every 210,000 blocks extracted.
dictionary.hardfork.title = Hard Fork
dictionary.hardfork.description = - software update that leads to a change that is incompatible with the current software version (older), which means that such an out-of-date node is not able to fully function with updated nodes (it may not be able to verify transactions, receive or send transactions, etc.). After the hard fort, there is always room for a new currency. This occurs when part of the network rejects the update and remains on the old version. As of this version, both networks live their own lives. If the network receives an incompatible update, we speak of a hard drive without a new cryptocurrency.
dictionary.hardwallet.title = Hardware Wallet
dictionary.hardwallet.description = - cryptographically secure hardware designed to secure the information in your wallet. Examples are a wallet
dictionary.hashrate.title = Hashrate
dictionary.hashrate.description = - A number that indicates the speed of the pull, more specifically the number of hashes that the machine can resolve per second.
dictionary.hodl.title = HODL
dictionary.hodl.description = - a term derived from the original HOLD means to hold and not to sell coins.
dictionary.hotwallet.title = Hot wallet
dictionary.hotwallet.description = - wallet connected to the internet, for daily transactions. But because of the Internet, it is less secure.
dictionary.hype.title = Hype
dictionary.hype.description = - mass enthusiasm not only around a cryptocurrency in order to make it visible on the market. The term is generally not tied to a crypto.
dictionary.ico.title = ICO (Initial Coin Offering)
dictionary.ico.description = - initial public offering of digital currency before listing. It is similar to crowdfunding in the digital world.
dictionary.kaico.title = KAICO
dictionary.kaico.description = - CryptoKami came up with their own idea of how to do ICO. It's a kind of competitor for DAICO. Although they are similar, they also offer different properties.
dictionary.kaico.description.2 = You can read more about it here.
dictionary.cap.title = Capitalization
dictionary.cap.description = - all coins of a given cryptocurrency that are in circulation multiplied by the current value of the coin.
dictionary.cap.description.2 = You can read more about it here.
dictionary.confirmation.title = Confirmation
dictionary.confirmation.description = - The transaction is confirmed if it has been confirmed by a certain number of nodes (miners) in the network. This is a successful slashing of the transaction and its addition to the blockchain.
dictionary.correction.title = Correction
dictionary.correction.description = - is the opposite movement, usually negative, usually a 10 percent drop in stocks or securities ... where the overvaluation of the price backwards is compensated. Corrections are temporary and interrupt the usually uptrend.
dictionary.consensus.title = Consensus
dictionary.consensus.description = - is reached when all participating nodes agree to include the transaction in the blockchain.
dictionary.kyc.title = KYC (Know your customer)
dictionary.kyc.description = - know your customer. The process where the customer (buyer) verifies his identity by filling in personal data and often also by uploading identification cards to the server.
dictionary.marketcap.title = Market cap
dictionary.marketcap.description = - total value of all coins in circulation of the given cryptocurrency.
dictionary.mooning.title = Mooning
dictionary.mooning.description = - state when the price rises. This is not necessarily an extreme increase.
dictionary.multisignature.title = Multi-signature
dictionary.multisignature.description = - (multisig) Multiple signable addresses allow multiple parties to request more than one key to authorize a transaction. The required number of signatures is agreed upon when creating the address. Multi-signature addresses are much more resistant to theft.
dictionary.nativetoken.title = Native token
dictionary.nativetoken.description = - Cardano allows you to create your own
dictionary.nativetoken.description.2 = in the Cardano network, which it calls native. Native because they do not differ in any special way from the original ADA token. In the case of ETH, the differences are between ERC-20 and
dictionary.nativetoken.description.3 = ERC-721 tokens
dictionary.nativetoken.description.4 = a ETH.
dictionary.nft.title = NFT (Non-fungible tokens)
dictionary.nft.description = these are tokens that are not interchangeable. They are unmistakable because they are different. They differ in the meta properties of the token. For example, ERC-20 tokens on the Ethereum network are tokens with the same meta properties and therefore 1 ETH is interchangeable with another 1 ETH. With NFT tokens, you cannot exchange 1 token for another, because they are not identical and therefore do not have the same price / value. NFTs are created to represent physical as well as virtual assets (weapons, clothingand other subjects in games, music, ...).
dictionary.node.title = Node
dictionary.node.description = - A copy of the ledger (transaction blockchain) operated by the network participant.
dictionary.margin.title = Margin Trading
dictionary.margin.description = - Trading money that has been lent to you by the exchange itself. To receive the loan, the capital must be injected as a deposit.
dictionary.p2p.title = P2P (Peer to Peer)
dictionary.p2p.description = - A network where each node can perform the role of server as well as client. There is no central point in the form of one or more servers, as is the case with the client-server architecture.
dictionary.paperwallet.title = Paper Wallet
dictionary.paperwallet.description = - Printed paper with wallet information. Often this information is a private address and an address
dictionary.parachain.title = Parachain
dictionary.parachain.description = is an application-specific data structure that is globally coherent and validate by validators
dictionary.parachain.description.2 = It will usually take the form of a blockchain, but it does not need to be real blockchains. Parachines allow you to connect to
dictionary.parachain.description.3 = ecosystem pre-existing crypto blockchains. These can work in parallel (verification ...) to the Relay chain, which will allow excellent scaling of this ecosystem.
dictionary.wallet.title = Wallet
dictionary.wallet.description = - digital wallet for 1 or more digital names. It is a place where the coins themselves are not stored, but the private and public keys needed to send and receive coins.
dictionary.pow.title = Proof of Work (PoW)
dictionary.pow.description = - Is the system based on which the blockchain is managed. Verification and addition of the transaction to the blockchain takes place by so-called extraction, which requires considerable computing power (of which
dictionary.pos.title = Proof of Stake (PoS)
dictionary.pos.description = - Is the system based on which the blockchain is managed. Transactions are received for verifying transactions by each node, depending on how much of the cryptocene it owns. The more it owns, the more the node (wallet) is able to verify transactions over time, and thus obtain more rewards in the form of a cryptocurrency or other cryptocurrency designed for it.
dictionary.publickey.title = Public Key
dictionary.publickey.description = - The public-private key pair is widely used in cryptography to achieve encrypted communication between two stakeholders. The sender must know the public key of the recipient of the message. Note that the public key usually does not equal the address of your crypto
dictionary.publickey.description.2 =, but is often calculated from it.
dictionary.privatekey.title = Private Key
dictionary.privatekey.description = - the public and private key pair is widely used in cryptography to achieve encrypted communication between two stakeholders. The sender signs the messages with his unique private key. In the crypto, the private address is the data that allows you to re-create the wallet, you sign transactions with it. Don't be wrong with seed.
dictionary.pumpdump.title = Pump & Dump
dictionary.pumpdump.description = - organized price manipulation, in which the value of the cryptocurrency is increased by bulk purchases in a relatively short period of time. After reaching the maximum price, there is a mass sale and there is a sudden drop in price.
dictionary.relaychain.title = Relay chain
dictionary.relaychain.description = is the central chain of the ecosystem
dictionary.relaychain.description.2 = All validators
dictionary.relaychain.description.3 = are linked to a Relay Chain and validate for a Relay Chain.
dictionary.resistance.title = Resistance
dictionary.resistance.description = - The level of resistance is above the current price of the asset and acts as a ceiling for rising prices. The opposite logic to the support levels - the resistance levels mean that the price is likely to bounce off this level rather than break it.
dictionary.support.title = Support
dictionary.support.description = - The support level is below the current asset price and defines areas where falling prices will find repeated support before further declines. This means that the price is likely to "bounce" off this level rather than break it.
dictionary.ta.title = TA (technical / trend analysis)
dictionary.ta.description = - the process of examining the development of a price according to economic data in order to determine its future development.
dictionary.token.title = Token
dictionary.token.description = - unit / coin of the cryptocurrency. A token is usually called a coin created on an existing platform (usually intended for a service of the same name). For example
dictionary.tx.title = Transaction Fee
dictionary.tx.description = - All cryptocurrency transactions involve a small transaction fee. These transaction fees are increased by the block reward that the miner receives when he successfully processes the block.
dictionary.mining.title = Mining
dictionary.mining.description = - This is an act of validating blockchain transactions. Miners contribute computational power to the blockchain network to help identify the next block. Miners are usually rewarded in the form of coins. In other words, the network needs to verify the transactions taking place in the network, and for the verification that cost the computing power of the miner and the money needed to buy computers and electricity is received as an incentive against the value of the unit of the currency.
dictionary.satoshi.title = Satoshi
dictionary.satoshi.description = - The smallest unit of Bitcoin. It holds that 1 BTC = 1 00 000 000 Satoshi.
dictionary.nakamoto.title = Satoshi Nakamoto
dictionary.nakamoto.description = Unknown Bitcoin creator. It can be one person or a group. It is still not publicly known who appears under this pseudonym.
dictionary.softfork.title = Soft fork
dictionary.softfork.description = - software update that leads to a change that is compatible with the current software version (older), which means that even an out-of-date node is able to fully function with updated nodes.
dictionary.smartcontract.title = Smart Contract
dictionary.smartcontract.description = - business rules written in the programming language, which can be found in
dictionary.smartcontract.description.2 = as software invoked by network participants. There is no need for a third party to be required between the sender and the recipient.
dictionary.staking.title = Staking
dictionary.staking.description = - In the Proof of Stake system, this usually means leaving your coins in your wallet so that you will be rewarded for them in the near future, either in the same currency or in another designated one. Rewards adjust over time. For some, the wallet must be online, for others it may not.
dictionary.stop.title = Stop Loss
dictionary.stop.description = - a function on stock exchanges that allows you to set the value at which the cryptocurrency should be sold.
dictionary.seed.title = Seed
dictionary.seed.description = - a group of sorted words, where their order depends and I can re-create the wallet /
dictionary.seed.description.2 =, since the wallet creation process is deterministic. It has a different number of words 12, 13, 15 ...
dictionary.volatile.title = Volatility
dictionary.volatile.description = - A term that expresses how often the price of a digital currency changes. The opposite of this concept is the concept of stability.
dictionary.vel.title = Whale
dictionary.vel.description = - designation for the owner of a large quantity of all coins of a given cryptocurrency, who may become a manipulator of its price.
dictionary.supercycle.title=Supercycle
dictionary.supercycle.description=A sustained spell of abnormally strong demand growth that producers struggle to match, sparking a rally in prices that can last years or in some cases a decade or more.

