did.you.know=Did you know that
did.you.know.title = Crypto curiosities
did.you.know.description = from a world of cryptocurrencies you may not have known.
did.you.know.bitcoin.1 = Bitcoin went on sale in 2010 for $ 0.0008. On December 17, 2017, it reached its maximum value of USD 20,089.
did.you.know.bitcoin.2 = When the last Bitcoin is extracted, miners will continue to be motivated to continue validating transactions with fees for completed transactions. Today, they are also rewarded with a certain number of bitcoins after each block extracted.
did.you.know.bitcoin.3 = Bitcoin halving is an event in which the rewards for an extracted block are split in half. This event will also increase the inflation rate and also the speed at which new Bitcoins enter circulation. This happens every 210,000 blocks extracted.
did.you.know.bitcoin.4 = It is estimated that the last mined block of Bitcoin will see the light of the cyberworld in 2140.
did.you.know.bitcoin.5 = Rewards for the extracted Bitcoin block amounted to 50 BTC in 2009, after the first halving it was only 25 BTC and after 11.5.2020 (third halving) it is currently 6.25 BTC.
did.you.know.bitcoin.6 = Bitcoin has a maximum number of coins of 21 million. There will be no more.
did.you.know.bitcoin.7.3 = It's been 3 times this year. How many such predictions will Bitcoin still survive?
did.you.know.bitcoin.7.1 = Bitcoin had predicted death already
did.you.know.bitcoin.7.2 = a total of 395 times
did.you.know.bitcoin.8 = There are fewer Bitcoin coins in circulation than Litecoin coins. For comparison, the number of Bitcoin coins is 18.5 million vs. number of Litecoin coins 66.2 million. (2021)
did.you.know.bitcoin.9.1 = The largest miner in the Bitcoin network is a pool called F2Pool, which provides more than 17% of the entire network hashrate.
did.you.know.bitcoin.9.2 = The second are BinancePool with 11.9% and the first three is closed by the Poolin pool with 11.7% of the network hashrate.
did.you.know.bitcoin.10 = 8.1.2021, for the first time in history at all, Bitcoin surpassed the value in terms of 1 million Slovak crowns. This happened for the second time on 6.2.2021. Until the third from 8.2.2021, it remains above this level to this day.
did.you.know.bitcoin.11=Steve Wozniak, co-founder of the world's largest publicly traded company Apple , is a fan of Bitcoin. In 2021, he said that Bitcoin is a miraculous technology with a unique mathematical formula.
did.you.know.bitcoin.12=In 2010, 184 billion bitcoins were mined after an attacker exploited a code flaw. It was a block with the number 74638. Satoshi Nakamoto fixed the error 5 hours after its discovery.
did.you.know.bitcoin.13=Millennials, people born between 1980 and 1995, adore BTC and like to invest in it.
did.you.know.bitcoin.14=Bitcoin consumes far less energy than gold mining or traditional banking. (2021, Galaxy Digital)
did.you.know.bitcoin.15=AXA, the 2nd largest insurance company in Europe, will start accepting Bitcoin. (2021)
did.you.know.bitcoin.16=The most expensive NFT sold for $ 69 million. (2021)
did.you.know.bitcoin.17=It is estimated that up to 20% of all Bitcoins are irretrievably lost. This is approximately 3-4 million BTC. (2021)
did.you.know.bitcoin.18=90% of all Bitcoins have already been mined. (2021)
did.you.know.bitcoin.19=In New York, you can also buy real estate for cryptocurrencies. Specifically for Bitcoin, Ethereum, DogeCoin. Algocap Real Estate has decided to accept payments in cryptocurrencies.
did.you.know.bitcoin.20=Ray Dalio, the founder of the world's largest hedge fund, also owns Bitcoin. (2021)
did.you.know.bitcoin.21.1=Daymak Avvenire electric car called
did.you.know.bitcoin.21.2=can mine the cryptocurrencies Bitcoin and Dogecoin during charging.
did.you.know.monero.1 = The maximum number of Monera coins is not limited. However, their issuance is regulated. The coin reward will be reduced until the end of May 2022, when there will be 18,132,000 in circulation. After that, the reward will stop at 0.6 XMR.

did.you.know.neo.1 = If you insert NEO tokens into your NEON wallet, you will be able to earn another cryptocurrency automatically and that is GAS. In other words, you get passive income.
did.you.know.neo.2 = Neo is a proof of stake platform often perceived as the Chinese Ehereum. Like Ethereum, NEO offers the opportunity to create so-called Smart contracts.

did.you.know.ethereum.1 = Ethereum 2.0 was launched on 1.12.2020. The main changes include Proof of stake instead of the previous Proof of work. Within 2 years, an increase in the number of transactions from 15 to 100,000 per second.
did.you.know.ethereum.2=After the London hard fort, $ 10,000 worth of ETH is burned every minute. (2021)
did.you.know.iota.1 = is the only cryptocurrency whose transaction fees are equal to 0. In other words, they are free of charge.
did.you.know.iota.2 = As the name implies, IOTA is ready for the so-called IOT Internet of Things, where everything will be connected and accessible via the Internet. For example, your refrigerator will be able to pay and shop without your knowledge and more. IOTA is the only one that allows microtransactions that will become commonplace in the future. Who first implements microtransactions and how it is not important. However, we already have a platform today that can bring the idea of ​​microtransaction to life thanks to zero fees. To perform the transaction, it is sufficient if it is verified by two other network nodes.
did.you.know.iota.3 = IOTA presents smart contracts on its platform, which could be a reality by the end of 2021.

did.you.know.litecoin.1 = Litecoin originated from the Bitcoin source code back in 2011.
did.you.know.litecoin.2 = Litecoin has a maximum number of coins set at 84 million. There will be no more.
did.you.know.litecoin.3 = There are fewer Bitcoin coins in circulation than Litecoin coins. For comparison, the number of Bitcoin coins is 18.5 million vs. number of Litecoin coins 66.2 million. (2021)

did.you.know.tether.1 = Tether is a stablecoin created in collaboration with Tether Limited and the stock exchange
did.you.know.tether.2 = 1 Tether covers exactly $ 1.
did.you.know.tether.3 = Tether was created so that traders do not have to change their cryptocurrencies for FIAT unnecessarily during their trades.

did.you.know.btccash.1 = Bitcoin Cash was created as a hard fork of Bitcoin.

did.you.know.btccash.2 = The main reason for Bitcoin Cash was to increase the transaction block from 1 MB to 8 MB. As a result, Bitcoin Cash can process more transactions per second than Bitcoin.

did.you.know.btcsv.1 = SV stands for Satoshi Vision, which translates to Satoshi's vision.
did.you.know.btcsv.2 = Bitcoin SV originated as a hard fork of the cryptocurrency Bitcoin Cash.
did.you.know.btcsv.3 = Behind the emergence of the cryptocurrency Bitcoin SV is again an increase in the transaction block from 8 MB to 128 MB, which means an even higher number of validated transactions per second.


