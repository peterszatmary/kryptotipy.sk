cooperation.service.1.description = Chętnie wspieramy projekty / witryny o podobnym charakterze, wymieniając linki zwrotne. Link taki umieścimy w stopce strony kryptotipy.sk. Wymiana zostanie zakończona poprzez dodanie linku kryptotipy.sk w stopce Twoich stron.
cooperation.service.2.title = Wyświetlaj linki do artykułów w naszej witrynie
cooperation.service.2.description = Jeśli chcesz znaleźć się wśród innych portali, których linki do artykułów, które wyświetlamy, po prostu dodaj link zwrotny w stopce swoich stron i napisz do nas na adres info@kryptotipy.sk. W ciągu dwóch dni Twoje artykuły zaczną być wyświetlane.
