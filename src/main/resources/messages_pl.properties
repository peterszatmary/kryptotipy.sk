cooperation.service.3.description = Jeśli jesteś zainteresowany napisaniem artykułu lub wpisu na blogu lub dowolnego tekstu i brakuje Ci informacji, z przyjemnością je udzielimy. Po prostu napisz do nas na info@kryptotipy.sk o swoim zamiarze i zadaj pytania, na które chciałbyś uzyskać odpowiedź.
cooperation.service.4.title = Inny rodzaj współpracy
cooperation.service.4.description = "Oczywiście istnieje jedna duża górka możliwości współpracy i wiemy o tym. Jeśli pomyślałeś o współpracy, o której nie wspomniano w poprzednich 3 opcjach, nie wahaj się skontaktować z nami pod adresem info @ kryptotipy.sk Czekamy na Ciebie i na współpracę.

