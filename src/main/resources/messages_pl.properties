dictionary.address.description = służą do wysyłania i odbierania transakcji w sieci. Są to ciągi szesnastkowe, które reprezentują Twój unikalny identyfikator
dictionary.arbitraz.title = Arbitraż
dictionary.arbitraz.description = - wykorzystanie nierównych cen danego obiektu w różnych miejscach / markety z zyskiem równym różnicy między tymi cenami (przy braku związanego z tym ryzyka)
dictionary.wallets.href = portfele
dictionary.blockchain.href = blockchain
dictionary.in = w
dictionary.airdrop.title = Airdrop
dictionary.airdrop.description = w kryptowalutach to proces dystrybucji do nowych lub dotychczasowych właścicieli danej waluty, lub
dictionary.airdrop.description.1 =, gdzie czasami konieczne jest posiadanie menu lub spełnienie innych wymagań.
dictionary.altcoin.title = Altcoin (Alt)
dictionary.altcoin.description = - all
dictionary.altcoin.description.2 = (waluty cyfrowe) utworzone po Bitcoin nazywane są altcoinami.
dictionary.atl.title = ATL (najniższy od zawsze)
dictionary.atl.description = - jest przeciwieństwem ATH, czyli najniższą wartością, jaką kryptowaluta osiągnęła przez cały okres.
dictionary.ath.title = ATH (wszech czasów)
dictionary.ath.description = - najwyższa cena danej kryptowaluty w całej jej historii.
dictionary.asic.title = ASIC (układ scalony specyficzny dla aplikacji)
dictionary.asic.description = - mikroczipy są stworzone tylko do jednego zadania, a mianowicie do ekstrakcji konkretnego
dictionary.asic.description.2 = (taki, który pozwala na użycie brutalnej siły = im wyższa moc, tym większy zysk z wydobycia).
dictionary.bearish.title = Rynek niedźwiedzi
dictionary.bearish.description = - określ, kiedy na rynku występuje trend spadkowy.
dictionary.bip.title = BIP (Propozycje ulepszeń Bitcoin)
dictionary.bip.description = przetłumaczone sugestie dotyczące ulepszeń
dictionary.bip.description.2 = Bitcoin
dictionary.bip.description.3 =, który może zgłosić każdy zainteresowany ulepszeniem sieci Bitcoin.
dictionary.btc.title = Bitcoin (BTC)
dictionary.btc.description = - pierwsza cyfrowa waluta uruchomiona w 2009 roku przez osobę lub grupę pod pseudonimem Satoshi Nakamoto.
dictionary.blockchain.title = Blockchain
dictionary.blockchain.description = - rozproszona (zdecentralizowana) baza danych lub sieć przechowująca wszystkie publiczne księgi kryptowalut
dictionary.blocks.title = Bloki
dictionary.blocks.description = - to pakiety danych, które przenoszą trwale zapisane dane w plikach
dictionary.bullish.title = Byczy rynek
dictionary.bullish.description = - stan, w którym rynek znajduje się w trendzie wzrostowym.
dictionary.coldwallet.title = Zimny ​​portfel
dictionary.coldwallet.description = - Cyfrowe waluty przechowywane poza Internetem. Przykładami są portfel papierowy, portfel sprzętowy. Powodem istnienia tego typu portfeli jest większe bezpieczeństwo. Przeciwieństwem jest tak zwany gorący portfel.
dictionary.coin.title = Moneta
dictionary.coin.description = - jedna jednostka cyfrowej kryptowaluty. Jest często używany jako synonim i krótszy termin dla kryptowaluty.
dictionary.crypto.title = Kryptowaluta (kryptowaluta)
dictionary.crypto.description = - cyfrowa waluta oparta na kryptografii.
dictionary.dyor.title = DYOR (wykonaj własne badania)
dictionary.dyor.description = - oznacza samodzielne badanie lub przegląd na dany temat lub nazwę.
dictionary.dao.title = DAO - (zdecentralizowane organizacje autonomiczne)
dictionary.dao.description = w tłumaczeniu oznacza Zdecentralizowane Autonomiczne Organizacje - możesz je sobie wyobrazić jako korporacje, które mogą funkcjonować bez jakiejkolwiek interwencji człowieka (autonomia) i przeniosły wszystkie formy kontroli na nieprzekupne reguły biznesowe.
dictionary.daico.title = DAICO - zdecentralizowane ICO
dictionary.daico.description = - Działanie ICO zapewni tylko inteligentny kontrakt, który będzie działał w danym
dictionary.daico.description.2 =. (Po pierwsze
dictionary.daico.description.3 =, ponieważ twórcą pomysłu jest Vitalik Buterin)
dictionary.dapp.title = DAPP - (zdecentralizowana aplikacja)
dictionary.dip.title = Dip
dictionary.dip.description = - najniższy punkt na wykresie lub lokalna wartość minimalna
dictionary.dip.description.2 = Również czas na okazyjne zakupy.
dictionary.dump.title = Zrzuć
dictionary.dump.description = - znaczący spadek wartości kryptowaluty lub akcji lub towaru.
dictionary.erc20.title = ERC-20
dictionary.erc20.description = - Interfejs na podstawie którego tworzone są nowe
dictionary.erc20.description.2 = na podstawie
dictionary.erc20.description.3 =. Innymi słowy, inteligentny kontrakt, który wdraża dane rozporządzenie ERC-20.
dictionary.erc20.description.4 = Dowiedz się więcej o tym, co opisuje ERC-20 tutaj.
dictionary.erc223.title = ERC-223
dictionary.erc223.description = - następca standardu ERC20. Powinien przynieść między innymi tańsze transakcje i np. Możliwość wybrania zagubionych tokenów, do których nikt nie ma dostępu. Więcej informacji
dictionary.erc721.title = ERC-721
dictionary.erc721.description = to standardowy token w sieci Ethereum, który umożliwia wytwarzanie tylko tokenów NFT i zmusza programistów do tworzenia i wdrażania nowej inteligentnej umowy dla każdego nowego tokena. Dla porównania, standard tokenów ERC-1155 umożliwia tworzenie zarówno tokenów NFT, jak i tokenów wymiennych. To jestnie jest konieczne do tworzenia i wdrażania nowej inteligentnej umowy dla każdego tokena. Wystarczy jeden.
dictionary.erc1155.title = ERC-1155
dictionary.erc1155.description = ERC-1155 to standard tokenów, który umożliwia tworzenie tak zwanych tokenów niezamiennych (NFT), a także tokenów zamiennych w sieci Ethereum. Standard tokenów ERC-1155 został stworzony, aby funkcjonować jako automaty, w których programiści mogą wdrożyć pojedynczą inteligentną umowę w celu tworzenia nieograniczonej liczby wymienialnych (identycznych) tokenów, a także (unikalnych) tokenów NFT. Dla porównania, standard tokenów ERC-721 produkuje tylko tokeny NFT i zmusza programistów do wdrażania i tworzenia nowego inteligentnego kontraktu dla każdego nowego tokena.
dictionary.ep5.title = EP-5
dictionary.ep5.description = - Podobnie jak ERC20 lub ERC223, jest to standardowy token, ale
dictionary.exchange.title = Wymiana
dictionary.exchange.description = - strona internetowa z cyfrową giełdą, w której kupują i sprzedają
dictionary.fomo.title = FOMO (Strach przed pominięciem)
dictionary.fomo.description = - emocja strachu przed straconą szansą. Często jest to przyczyna kupowania waluty w szczytowym momencie lub sprzedaży ze stratą.
dictionary.fork.title = WIDELEC
dictionary.fork.description = - Aktualizacja oprogramowania, która powoduje zmianę, która może być zgodna lub niekompatybilna z bieżącą wersją oprogramowania. Zobacz twardy widelec, miękki widelec.
dictionary.fud.title = FUD (Strach, niepewność i wątpliwości)
dictionary.fud.description = - mieszanina emocji, takich jak strach, niepewność i zwątpienie, wywołana negatywnymi wiadomościami ze świata kryptowalut. W wyniku takiej paniki cena często może spaść.
dictionary.fudster.title = FUDster
dictionary.fudster.description = - to ktoś, kto rozpowszechnia media FUD.
dictionary.fiat.title = FIAT
dictionary.fiat.description = - oficjalne waluty emitowane przez rządy (EUR, USD itp.)
dictionary.fundament.title = Analiza fundamentalna
dictionary.fundament.description = - analiza oparta na publicznie dostępnych informacjach w celu określenia przyszłej ceny
dictionary.fundament.description.2 = / stocks ...
dictionary.genesis.title = Blok Genesis
dictionary.genesis.description = - Pierwszy blok w
dictionary.genesis.description.2 = blockchain
dictionary.halving.title = Połowa
dictionary.halving.description = - to zdarzenie, w którym następuje podział nagród za zajętych
dictionary.halving.description.2 = dokładnie pół bloku. To wydarzenie zmniejszy również o połowę stopę inflacji, a także prędkość, z jaką nowe Bitcoiny wchodzą do obiegu. Dzieje się tak raz na 210 000 wydobytych bloków.
dictionary.hardfork.title = Hard Fork
dictionary.hardfork.description = - aktualizacja oprogramowania prowadząca do zmiany niekompatybilnej z aktualną wersją oprogramowania (starsza), co oznacza, że ​​taki nieaktualny węzeł nie jest w stanie w pełni funkcjonować ze zaktualizowanymi węzłami (może nie móc weryfikować transakcje, odbierać lub wysyłać transakcje itp.). Po twardym forcie zawsze jest miejsce na nową walutę. Dzieje się tak, gdy część sieci odrzuca aktualizację i pozostaje w starej wersji. Od tej wersji obie sieci żyją własnym życiem. Jeśli sieć otrzyma niekompatybilną aktualizację, mówimy o dysku twardym bez nowej kryptowaluty.
dictionary.hardwallet.title = Portfel sprzętowy
dictionary.hardwallet.description = - kryptograficznie bezpieczny sprzęt przeznaczony do zabezpieczania informacji w Twoim portfelu. Przykładami są portfel
dictionary.hashrate.title = Hashrate
dictionary.hashrate.description = - Liczba wskazująca prędkość ściągania, a dokładniej liczbę skrótów, które maszyna może rozwiązać na sekundę.
dictionary.hodl.title = HODL
dictionary.hodl.description = - termin wywodzący się z oryginalnego HOLD oznacza trzymanie, a nie sprzedaż monet.
dictionary.hotwallet.title = Gorący portfel
dictionary.hotwallet.description = - portfel połączony z internetem do codziennych transakcji. Jednak ze względu na Internet jest mniej bezpieczny.
dictionary.hype.title = Hype
dictionary.hype.description = - masowy entuzjazm nie tylko wokół kryptowaluty, aby była widoczna na rynku. Termin generalnie nie jest powiązany z kryptowalutą.
dictionary.ico.title = ICO (wstępna oferta monet)
dictionary.ico.description = - pierwsza oferta publiczna cyfrowej waluty przed wystawieniem. Jest to podobne do finansowania społecznościowego w świecie cyfrowym.
dictionary.kaico.title = KAICO
dictionary.kaico.description = - CryptoKami wpadł na swój własny pomysł na ICO. To swego rodzaju konkurent dla DAICO. Chociaż są do siebie podobne, mają też inne właściwości.
dictionary.kaico.description.2 = Możesz przeczytać więcej na ten temat tutaj.
dictionary.cap.title = Wielkie litery
dictionary.cap.description = - wszystkie monety danej kryptowaluty znajdujące się w obiegu pomnożone przez aktualną wartość monety.
dictionary.cap.description.2 = Możesz przeczytać więcej na ten temat tutaj.
dictionary.confirmation.title = Potwierdzenie
dictionary.confirmation.description = - Transakcja jest potwierdzona, jeśli została potwierdzona przez określoną liczbę węzłów (górników) w sieci. To jestudane cięcie transakcji i dodanie jej do łańcucha blokowego.
dictionary.correction.title = Korekta
dictionary.correction.description = - jest odwrotnym ruchem, zwykle ujemnym, zwykle 10-procentowym spadkiem akcji lub papierów wartościowych ... gdzie przeszacowanie ceny do tyłu jest kompensowane. Korekty są tymczasowe i przerywają zwykle trend wzrostowy.
dictionary.consensus.title = Konsensus
dictionary.consensus.description = - jest osiągany, gdy wszystkie uczestniczące węzły zgadzają się na zawarcie transakcji w łańcuchu bloków.
dictionary.kyc.title = KYC (Poznaj swojego klienta)
dictionary.kyc.description = - poznaj swojego klienta. Proces, w którym klient (kupujący) weryfikuje swoją tożsamość, wprowadzając dane osobowe, a często również przesyłając karty identyfikacyjne na serwer.
dictionary.marketcap.title = Kapitalizacja rynkowa
dictionary.marketcap.description = - łączna wartość wszystkich monet znajdujących się w obiegu danej kryptowaluty.
dictionary.mooning.title = Mooning
dictionary.mooning.description = - podaj, kiedy cena rośnie. Niekoniecznie jest to ekstremalny wzrost.
dictionary.multisignature.title = Multi-podpis
dictionary.multisignature.description = - (multisig) Wiele adresów z możliwością podpisania umożliwia wielu stronom zażądanie więcej niż jednego klucza w celu autoryzacji transakcji. Wymagana liczba podpisów jest uzgadniana podczas tworzenia adresu. Adresy z wieloma podpisami są znacznie bardziej odporne na kradzież.
dictionary.nativetoken.title = Natywny token
dictionary.nativetoken.description = - Cardano umożliwia tworzenie własnych
dictionary.nativetoken.description.2 = w sieci Cardano, którą nazywa natywną. Natywne, ponieważ nie różnią się w żaden szczególny sposób od oryginalnego tokenu ADA. W przypadku ETH różnice są między ERC-20 a
dictionary.nativetoken.description.3 = tokeny ERC-721
dictionary.nativetoken.description.4 = a ETH.
dictionary.nft.title = NFT (tokeny niewymienialne)
dictionary.nft.description = to są tokeny, które nie są wymienne. Są niepowtarzalne, ponieważ są różne. Różnią się właściwościami meta tokena. Na przykład tokeny ERC-20 w sieci Ethereum są tokenami o takich samych właściwościach meta, a zatem 1 ETH jest wymienny z innym 1 ETH. W przypadku tokenów NFT nie można wymienić 1 tokena na inny, ponieważ nie są one identyczne i dlatego nie mają tej samej ceny / wartości. NFT są tworzone w celu reprezentowania zasobów fizycznych i wirtualnych (broni, odzieży i innych przedmiotów w grach, muzyce itp.).
dictionary.node.title = Węzeł
dictionary.node.description = - Kopia księgi (blockchain transakcji) obsługiwana przez uczestnika sieci.
dictionary.margin.title = Handel marżą
dictionary.margin.description = - Handel pieniędzmi pożyczonymi przez samą giełdę. Aby otrzymać pożyczkę, kapitał musi zostać wniesiony jako depozyt.
dictionary.p2p.title = P2P (Peer to Peer)
dictionary.p2p.description = - Sieć, w której każdy węzeł może pełnić rolę zarówno serwera, jak i klienta. Nie ma centralnego punktu w postaci jednego lub więcej serwerów, jak ma to miejsce w przypadku architektury klient-serwer.
dictionary.paperwallet.title = Papierowy portfel
dictionary.paperwallet.description = - Wydrukowany papier z informacjami o portfelu. Często te informacje to adres prywatny i adres
dictionary.parachain.title = Parachain
dictionary.parachain.description = to struktura danych specyficzna dla aplikacji, która jest globalnie spójna i zatwierdzona przez walidatory
dictionary.parachain.description.2 = Zwykle przybiera formę łańcucha bloków, ale nie musi to być prawdziwy łańcuch bloków. Ze spadochronami możesz się łączyć
dictionary.parachain.description.3 = ekosystem istniejące wcześniej kryptograficzne łańcuchy bloków. Mogą one działać równolegle (weryfikacja ...) z łańcuchem przekaźników, co pozwoli na doskonałe skalowanie tego ekosystemu.
dictionary.wallet.title = Portfel
dictionary.wallet.description = - cyfrowy portfel na 1 lub więcej nazw cyfrowych. Jest to miejsce, w którym nie są przechowywane same monety, ale klucze prywatne i publiczne potrzebne do wysyłania i odbierania monet.
dictionary.pow.title = Dowód pracy (PoW)
dictionary.pow.description = - To system, w oparciu o który zarządzany jest blockchain. Weryfikacja i dodanie transakcji do łańcucha blokowego odbywa się poprzez tzw. Ekstrakcję, która wymaga znacznych mocy obliczeniowych (w tym
dictionary.pos.title = Dowód stawki (PoS)
dictionary.pos.description = - To system, w oparciu o który zarządzany jest blockchain. Transakcje są odbierane w celu weryfikacji transakcji przez każdy węzeł, w zależności od tego, ile kryptocenu posiada. Im więcej posiada, tym bardziej węzeł (portfel) jest w stanie weryfikować transakcje w czasie, a tym samym uzyskiwać więcej nagród w postaci kryptowaluty lub innej zaprojektowanej do tego kryptowaluty.
dictionary.publickey.title = Klucz publiczny
dictionary.publickey.description = - Para kluczy publiczny-prywatny jest szeroko stosowana w kryptografii do uzyskania zaszyfrowanej komunikacji między dwoma interesariuszami. The sender musi znać klucz publiczny odbiorcy wiadomości. Zauważ, że klucz publiczny zwykle nie jest równy adresowi twojego krypto
dictionary.publickey.description.2 =, ale często jest z niego obliczany.
dictionary.privatekey.title = Klucz prywatny
dictionary.privatekey.description = - para kluczy publiczny i prywatny jest szeroko stosowana w kryptografii do uzyskania zaszyfrowanej komunikacji między dwoma interesariuszami. Nadawca podpisuje wiadomości swoim unikalnym kluczem prywatnym. W krypto adres prywatny to dane, które pozwalają na odtworzenie portfela, podpisanie z nim transakcji. Nie myl się z nasionami.
dictionary.pumpdump.title = Pompuj i zrzuć
dictionary.pumpdump.description = - zorganizowana manipulacja cenami, w której wartość kryptowaluty jest zwiększana poprzez zakupy masowe w stosunkowo krótkim czasie. Po osiągnięciu ceny maksymalnej następuje masowa wyprzedaż i gwałtowny spadek ceny.
dictionary.relaychain.title = Łańcuch przekaźników
dictionary.relaychain.description = to centralny łańcuch ekosystemu
dictionary.relaychain.description.2 = Wszystkie walidatory
dictionary.relaychain.description.3 = są połączone z łańcuchem przekaźników i sprawdzają poprawność łańcucha przekaźników.
dictionary.resistance.title = Opór
dictionary.resistance.description = - Poziom oporu jest wyższy od aktualnej ceny aktywa i działa jako pułap dla rosnących cen. Logika odwrotna do poziomów wsparcia - poziomy oporu oznaczają, że cena prawdopodobnie odbije się od tego poziomu, zamiast go przebić.
dictionary.support.title = Wsparcie
dictionary.support.description = - Poziom wsparcia jest poniżej aktualnej ceny aktywów i definiuje obszary, w których spadające ceny znajdą powtarzające się wsparcie przed dalszymi spadkami. Oznacza to, że cena raczej „odbije się” od tego poziomu niż go przekroczy.
dictionary.ta.title = TA (analiza techniczna / trendów)
dictionary.ta.description = - proces badania kształtowania się ceny na podstawie danych ekonomicznych w celu określenia jej przyszłego rozwoju.
dictionary.token.title = Token
dictionary.token.description = - jednostka / moneta kryptowaluty. Token jest zwykle nazywany monetą utworzoną na istniejącej platformie (zwykle przeznaczoną dla usługi o tej samej nazwie). Na przykład
dictionary.tx.title = Opłata transakcyjna
dictionary.tx.description = - Wszystkie transakcje kryptowalutowe wiążą się z niewielką opłatą transakcyjną. Te opłaty transakcyjne są zwiększane o nagrodę blokową, którą górnik otrzymuje, gdy pomyślnie przetworzy blok.
dictionary.mining.title = Wydobywanie
dictionary.mining.description = - To jest akt walidacji transakcji blockchain. Górnicy dostarczają moc obliczeniową do sieci blockchain, aby pomóc zidentyfikować następny blok. Górnicy są zwykle nagradzani w postaci monet. Innymi słowy, sieć musi weryfikować transakcje zachodzące w sieci, a do weryfikacji, która kosztuje moc obliczeniową górnika, a pieniądze potrzebne na zakup komputerów i energii elektrycznej, otrzymuje jako zachętę do wartości jednostki waluta.
dictionary.satoshi.title = Satoshi
dictionary.satoshi.description = - Najmniejsza jednostka Bitcoin. Zgodnie z nią 1 BTC = 1 00 000 000 Satoshi.
dictionary.nakamoto.title = Satoshi Nakamoto
dictionary.nakamoto.description = Nieznany twórca Bitcoin. Może to być jedna osoba lub grupa. Nadal nie jest publicznie znane, kto występuje pod tym pseudonimem.
dictionary.softfork.title = Miękki widelec
dictionary.softfork.description = - aktualizacja oprogramowania prowadząca do zmiany zgodnej z aktualną wersją oprogramowania (starszą), co oznacza, że ​​nawet przestarzały węzeł jest w stanie w pełni funkcjonować ze zaktualizowanymi węzłami.
dictionary.smartcontract.title = Inteligentna umowa
dictionary.smartcontract.description = - reguły biznesowe napisane w języku programowania, które można znaleźć w
dictionary.smartcontract.description.2 = jako oprogramowanie wywoływane przez uczestników sieci. Nie ma potrzeby, aby strona trzecia była wymagana między nadawcą a odbiorcą.
dictionary.staking.title = Stakowanie
dictionary.staking.description = - W systemie Proof of Stake oznacza to zazwyczaj pozostawienie monet w portfelu, aby w najbliższej przyszłości otrzymasz za nie nagrodę w tej samej lub innej wyznaczonej walucie. Nagrody dostosowują się w czasie. Dla niektórych portfel musi być online, dla innych może nie.
dictionary.stop.title = Stop Loss
dictionary.stop.description = - funkcja na giełdach, która pozwala ustawić wartość, za jaką ma zostać sprzedana kryptowaluta.
dictionary.seed.title = Ziarno
dictionary.seed.description = - grupa posortowanych słów, gdzie ich kolejność zależy i mogę odtworzyć portfel /
dictionary.seed.description.2 =, ponieważ proces tworzenia portfela jest deterministyczny. Ma inną liczbę słów 12, 13, 15 ...
dictionary.volatile.title = Zmienność
dictionary.volatile.description = - termin określający, jak często zmienia się cena waluty cyfrowej. Przeciwieństwem tej koncepcji jestpojęcie stabilności.
dictionary.vel.title = Wieloryb
dictionary.vel.description = - oznaczenie dla posiadacza dużej ilości wszystkich monet danej kryptowaluty, który może stać się manipulatorem jej ceny.

dictionary.tokens = tokeny
dictionary.cryptos = kryptowaluty
dictionary.here = tutaj
dictionary.and = i

page.not.found = 404 Nie znaleziono strony
page.index.description = Agregator nowego artykułu kryptograficznego z całego świata.
external.description = Usługi, które dostarczają kryptowalutę użytkownikowi i światu kryptowalut, pojawiają się na całym świecie i jest ich coraz więcej. Na stronie kryptotipy.sk znajdziecie zestawienie najciekawszych.
cooperation.descr = Współpraca z portalem kryptotipy.sk. Wymiana linków zwrotnych (budowanie linków zwrotnych), wyświetlanie linków do artykułów na kryptotipy.sk, artykuł o kryptotipy.sk lub inny rodzaj współpracy.
crypto.learning.descr = Kryptotipy.sk nie tylko gromadzi interesujące treści kryptograficzne z całego świata, ale także tworzy własne treści. Czytaj artykuły kryptograficzne za pomocą pióra kryptotipy.sk
did.you.know.descr = Sekcja kryptowalut, która zawiera interesujące fakty dotyczące kryptowalut na temat różnych kryptowalut z różnych okresów, nie tylko wiadomości.
default.descr = z całego świata w jednym miejscu. Zawsze najnowsze wiadomości dotyczące kryptowalut.

