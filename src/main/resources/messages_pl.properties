external.services.h1 = Zewnętrzne usługi kryptograficzne
external.services.h1.description = Wybór interesujących stron, portali, giełd, aplikacji, usług kryptowalut.
external.services.service.1.title = Krzesło
external.services.service.1.description = Usługa, która może wyszukiwać transakcje i inne dane w 17 różnych łańcuchach bloków, takich jak BTC, Monero, ETH, LTC ...
external.services.service.2.title = Safe One (czarny)
external.services.service.2.description = Zimny ​​portfel z maksymalnym bezpieczeństwem Twoich kryptowalut. Obsługuje wiele kryptowalut.
external.services.service.3.title = Coinbase
external.services.service.3.description = Usługa kupna i sprzedaży wybranych kryptowalut opartych na usługach GDAx. Jego główną zaletą jest prostota.
external.services.service.4.title = Exodus
external.services.service.4.description = Portfel obsługujący wiele kryptowalut plus zawiera wbudowaną giełdę obsługiwaną przez usługę Shapeshift.
external.services.service.5.title = Coinbase.Pro
external.services.service.5.description = Wymiana kryptowalut Coinbase. Z oryginalną nazwą GDAX znaną obecnie jako Coinbase.Pro jako dobrze znana giełda kryptowalut.
external.services.service.6.title = Poloniex
external.services.service.6.description = Amerykańska giełda kryptowalut, która powstała w 2014 roku w Ameryce. To także ciekawy sposób na rozpoczęcie handlu kryptomasami.
external.services.service.7.title = Jaxx
external.services.service.7.description = Portfel obsługujący kilka monet. Jest lekki i gorący. Nie trzeba pobierać całego łańcucha bloków. Online.
external.services.service.8.title = Skarbiec T
external.services.service.8.description = Zimny ​​portfel ze zwiększonym bezpieczeństwem Twoich kryptowalut. Obsługuje jeszcze więcej kryptowalut niż model One.
external.services.service.9.title = Kucoin
external.services.service.9.description = Giełda kryptowalut, na której możesz znaleźć kryptowaluty, których najprawdopodobniej nie zobaczysz na innych giełdach.
external.services.service.10.title = KeepKey
external.services.service.10.description = Portfel sprzętowy obsługujący wiele kryptowalut. Odpowiednia jako tańsza alternatywa dla Bezpiecznych produktów.
external.services.service.11.title = Kraken
external.services.service.11.description = Amerykańska giełda kryptowalut z bogatą historią. Powstała w 2011 roku. Kolejny sposób na rozpoczęcie handlu kryptowalutami.
external.services.service.12.title = Neo to Gas
external.services.service.12.description = Oblicza ponownie, ile tokena GAS otrzymasz jako dochód pasywny za trzymanie tokenów NEO w specjalistycznym portfelu NEON.
external.services.service.13.title = ATHA
external.services.service.13.description = Ostatni wszechczasowy kryptowalut (ATH) encje ze znacznikiem czasu. ATH to maksymalna wartość, jaką kiedykolwiek osiągnęła kryptowaluta.
external.services.service.14.title = Ledger Nano X
external.services.service.14.description = Zimny ​​portfel z naciskiem na bezpieczeństwo obsługuje wiele kryptowalut. Obsługuje połączenie Bluetooth. Najpierw wsparcie dla obstawiania Polkadot.
external.services.service.15.title = ShapeShift
external.services.service.15.description = To jest giełda kryptowalut. Jego główną zaletą jest brak konieczności rejestracji. Służy do zmiany kryptowalut na kryptowaluty.
external.services.service.16.title = Ethplorer
external.services.service.16.description = Po wprowadzeniu adresu może pokazać nie tylko saldo ETH na Twoim portfelu, ale także saldo wszystkich tokenów ETH na podanym adresie.
external.services.service.17.title = Binance
external.services.service.17.description = Giełda kryptowalut założona w Chinach w 2017 roku. Dziś jest to największa giełda kryptowalut na świecie.
external.services.service.18.title = Bitfinex
external.services.service.18.description = Wymiana kryptowalut. Twórca USDT. Została założona w 2012 roku. Jest własnością i jest zarządzana przez iFinex Inc.
external.services.service.19.title = Bittrex
external.services.service.19.description = Wymiana kryptowalut. Został założony w Ameryce w 2013 roku. Jako pierwszy zaoferował rekompensatę dla USDT, tzw. True USD.
external.services.service.20.title = Bitscreener
external.services.service.20.description = Sortuj według ceny waluty, limitu rynkowego, wolumenu w ciągu 24 godzin i typu. Chartview oferuje procentowe podsumowanie zmiany.
external.services.service.21.title = Coinmarketcap
external.services.service.21.description = Strona monitorowania kryptowaluty będąca w obrocie. Oferuje szereg przydatnych rankingów, wykresów i krypto-informacji.
external.services.service.22.title = Cryptocompare
external.services.service.22.description = Monitorowanie kryptowalut, różne kalkulatory dla górników, portfele kryptowalut, REST API dla programistów i nie tylko.
external.services.service.23.title = Coindar
external.services.service.23.description = To jest rodzaj kalendarza kryptograficznego. Dzięki tej usłudze będziesz informowany o nadchodzących wydarzeniach kryptograficznych i niczego nie przegapisz.
external.services.service.24.title = Crypto Fear & Greed Index
external.services.service.24.description = Crypto Fear & Greed Index mierzy obecny nastrój na rynkach kryptowalut. Kontroluje dwa podstawowe nastroje, strach i chciwość.
external.services.service.25.title = Radar bankomatów na monety
external.services.service.25.description = Usługa internetowa, która umożliwia znajdowanie różnych kryptowalut w celu kupowania i sprzedawania różnych kryptowalut w Twojej najbliższej okolicy.
external.services.service.26.title = Airdrops.io
external.services.service.26.description = Usługa monitorująca tak zwane zrzuty tokenów, które są darmowymi tokenami do wykonywania najczęstszych zadań w sieciach społecznościowych i tym podobnych.
external.services.service.27.title = Obstawianie nagród
external.services.service.27.description = Dzięki tej usłudze możesz wygodnie obliczyć, ile wynosi Twój pasywny dochód, jeśli posiadasz jeden z potwierdzeń tokenów stawki.
external.services.service.28.title = Crypto tank
external.services.service.28.description = To stacja benzynowa w Czechach, na której za paliwo można płacić popularną kryptowalutą Bitcoin.
external.services.service.29.title = Whitepapers.io
external.services.service.29.description = Biała księga to pierwsza specyfikacja techniczna kryptowaluty. Ta usługa umożliwia ich przeszukiwanie. Wszystko w jednym miejscu.
external.services.service.30.title = Nekrologi Bitcoin
external.services.service.30.description = Bitcoiny przewidziały śmierć łącznie 395 razy. To było 3 razy w tym roku. Ile takich prognoz przetrwa Bitcoin?

did.you.know.title = Ciekawostki kryptograficzne
did.you.know.description = ze świata kryptowalut, których być może nie znasz.
did.you.know.bitcoin.1 = Bitcoin trafił do sprzedaży w 2010 roku za 0,0008 $. W dniu 17 grudnia 2017 roku osiągnął maksymalną wartość 20 089 USD.
did.you.know.bitcoin.2 = Po wydobyciu ostatniego Bitcoina górnicy będą nadal motywowani do kontynuowania sprawdzania poprawności transakcji z opłatami za zakończone transakcje. Dziś są również nagradzani określoną liczbą bitcoinów po każdym wyodrębnionym bloku.
did.you.know.bitcoin.3 = Bitcoin halving to wydarzenie, w którym nagroda za wyodrębniony blok jest dzielona na pół. To wydarzenie zwiększy również stopę inflacji, a także prędkość, z jaką nowe Bitcoiny wejdą do obiegu. Dzieje się to co 210 000 wydobytych bloków.
did.you.know.bitcoin.4 = Szacuje się, że ostatni wydobyty blok Bitcoina ujrzy światło cyberświata w 2140 roku.
did.you.know.bitcoin.5 = Nagrody za wydobyty blok Bitcoin wyniosły 50 BTC w 2009 roku, po pierwszym halvingu było to tylko 25 BTC, a po 11.5.2020 (trzeci halving) jest to obecnie 6,25 BTC.
did.you.know.bitcoin.6 = Bitcoin ma maksymalną liczbęmonet o wartości 21 milionów. Nie będzie więcej.
did.you.know.bitcoin.7.3 = To było 3 razy w tym roku. Ile takich prognoz przetrwa Bitcoin?
did.you.know.bitcoin.7.1 = Bitcoin już przewidział śmierć
did.you.know.bitcoin.7.2 = łącznie 395 razy
did.you.know.bitcoin.8 = W obiegu jest mniej monet Bitcoin niż monet Litecoin. Dla porównania liczba monet Bitcoin wynosi 18,5 miliona vs. liczba monet Litecoin 66,2 miliona. (2021)
did.you.know.bitcoin.9.1 = Największym kopaczem w sieci Bitcoin jest pula o nazwie F2Pool, która zapewnia ponad 17% całej sieci.
did.you.know.bitcoin.9.2 = Drugi to BinancePool z 11,9%, a pierwsze trzy są zamknięte przez pulę Poolin z 11,7% hashratem sieci.
did.you.know.bitcoin.10 = 8.1.2021, po raz pierwszy w historii Bitcoin przekroczył wartość pod względem 1 miliona słowackich koron. Zdarzyło się to po raz drugi 6.2.2021. Do trzeciego od 8.2.2021 r. Utrzymuje się powyżej tego poziomu do dziś.

did.you.know.monero.1 = Maksymalna liczba monet Monera nie jest ograniczona. Jednak ich wydawanie jest regulowane. Nagroda w postaci monet zostanie obniżona do końca maja 2022 r., Kiedy w obiegu będzie 18 132 000 monet. Następnie nagroda zatrzyma się na 0,6 XMR.

did.you.know.neo.1 = Jeśli włożysz tokeny NEO do swojego portfela NEON, będziesz mógł automatycznie zarobić kolejną kryptowalutę, czyli GAS. Innymi słowy, otrzymujesz dochód pasywny.
did.you.know.neo.2 = Neo jest dowodem platformy stawki często postrzeganej jako chińskie Ehereum. Podobnie jak Ethereum, NEO oferuje możliwość tworzenia tzw. Inteligentnych kontraktów.

did.you.know.ethereum.1 = Ethereum 2.0 został uruchomiony 1.12.2020. Główne zmiany obejmują Dowód stawki zamiast poprzedniego Dowodu pracy. W ciągu 2 lat wzrosła liczba transakcji z 15 do 100 000 na sekundę.

did.you.know.iota.1 = jest jedyną kryptowalutą, której opłaty transakcyjne są równe 0. Innymi słowy, są one bezpłatne.
did.you.know.iota.2 = Jak sama nazwa wskazuje, IOTA jest gotowa na tak zwany IOT Internet of Things, w którym wszystko będzie połączone i dostępne przez Internet. Na przykład Twoja lodówka będzie mogła płacić i robić zakupy bez Twojej wiedzy i nie tylko. IOTA jest jedyną, która pozwala na mikrotransakcje, które staną się powszechne w przyszłości. Kto pierwszy wdraża mikrotransakcje i jak to nie jest ważne. Jednak już dziś mamy platformę, która dzięki zerowym opłatom może wcielić w życie ideę mikrotransakcji. Do wykonania transakcji wystarczy zweryfikowanie jej przez dwa inne węzły sieci.
did.you.know.iota.3 = IOTA prezentuje inteligentne kontrakty na swojej platformie, które mogą stać się rzeczywistością do końca 2021 roku.

did.you.know.litecoin.1 = Litecoin pochodzi z kodu źródłowego Bitcoin w 2011 roku.
did.you.know.litecoin.2 = Litecoin ma maksymalną liczbę monet ustawioną na 84 miliony. Nie będzie więcej.
did.you.know.litecoin.3 = W obiegu jest mniej monet Bitcoin niż monet Litecoin. Dla porównania liczba monet Bitcoin wynosi 18,5 miliona vs. liczba monet Litecoin 66,2 miliona. (2021)

did.you.know.tether.1 = Tether to stablecoin stworzony we współpracy z Tether Limited i giełdą
did.you.know.tether.2 = 1 Tether pokrywa dokładnie 1 dolara.
did.you.know.tether.3 = Tether został stworzony, aby handlowcy nie musieli niepotrzebnie zmieniać swoich kryptowalut na FIAT podczas swoich transakcji.

did.you.know.btccash.1 = Bitcoin Cash został utworzony jako hard fork Bitcoin.

did.you.know.btccash.2 = Głównym powodem dla Bitcoin Cash było zwiększenie bloku transakcji z 1 MB do 8 MB. W rezultacie Bitcoin Cash może przetwarzać więcej transakcji na sekundę niż Bitcoin.

did.you.know.btcsv.1 = SV to skrót od Satoshi Vision, co przekłada się na wizję Satoshi.
did.you.know.btcsv.2 = Bitcoin SV powstał jako hard fork kryptowaluty Bitcoin Cash.
did.you.know.btcsv.3 = Za pojawieniem się kryptowaluty Bitcoin SV ponownie stoi wzrost bloku transakcji z 8 MB do 128 MB, co oznacza jeszcze większą liczbę sprawdzanych transakcji na sekundę.


