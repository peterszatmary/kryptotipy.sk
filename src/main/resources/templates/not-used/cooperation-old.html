<html xmlns:th="http://www.thymeleaf.org" lang="en" th:remove="tag">
<section id="subintro">
    <div class="jumbotron subhead" id="overview">
        <div class="container">
            <div class="row">
                <div class="span12">
                    <div class="centered">
                        <h1 style="font-size: 22px; color: #fff;" th:text="#{cooperation.title}"></h1>
                        <p>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<section id="breadcrumb">
    <div class="container">
        <div class="row">
            <div class="span12">
                <ul class="breadcrumb notop">
                    <li>
                        <a href="/" th:text="#{navbar.home}"></a>
                        <span class="divider">/</span>
                    </li>
                    <li class="active" th:text="#{cooperation.title}"></li>
                </ul>
            </div>
        </div>
    </div>
</section>

<section id="maincontent">
    <div class="container">
        <div class="row">
            <ul class="portfolio-area da-thumbs">
                <h2 style="font-size: 35px;" th:text="#{cooperation.title}"></h2>
<!--                <img src="/assets/img/services/cooperation/cooperation.png" style="margin-top: 30px; margin-bottom: 40px;"-->
<!--                     th:alt="#{cooperation.title}" width="800" height="165" />-->


                <div class="row">
                    <div class="span12">
                        <div class="row">
                            <div class="span4">
                                <div class="priceBox">
                                    <h4 class="light">STANDARD</h4>
                                    <hr>
                                    <span class="emphasis" th:text="#{cooperation.paid.standard.price}"></span>
                                    <em th:text="#{cooperation.paid.methods}"></em>
                                    <hr>
                                    <span th:text="#{cooperation.paid.standard.1}"></span>
                                    <hr>
                                    <span th:text="#{cooperation.paid.standard.2}"></span>
                                    <hr>
                                    <span th:text="#{cooperation.paid.standard.3}"></span>
                                    <hr>
                                    <span th:text="#{cooperation.paid.standard.discount}"></span>
                                    <hr>
                                    <span class="emphasis-2" style="margin-top:63px;margin-bottom:63px;">
                                        <a class="btn btn-success" href="mailto:info@kryptotipy.sk?subject=STANDARD PACKAGE ORDER">
                                            <span th:text="#{cooperation.paid.order}"></span>
                                        </a>
                                    </span>
                                </div>
                            </div>
                            <div class="span4">
                                <div class="priceBox special">
                                    <h4 class="light">PREMIUM</h4>
                                    <hr>
                                    <span class="emphasis" th:text="#{cooperation.paid.premium.price}"></span>
                                    <em th:text="#{cooperation.paid.methods}"></em>
                                    <hr>
                                    <span th:text="#{cooperation.paid.premium.1}"></span>
                                    <hr>
                                    <span th:text="#{cooperation.paid.premium.2}"></span>
                                    <hr>
                                    <span th:text="#{cooperation.paid.premium.3}"></span>
                                    <hr>
                                    <span th:text="#{cooperation.paid.premium.4}"></span>
                                    <hr>
                                    <span th:text="#{cooperation.paid.premium.discount}"></span>
                                    <hr>
                                    <span class="emphasis-2" style="margin-top:37px;margin-bottom:37px;">
                                        <a class="btn btn-success" href="mailto:info@kryptotipy.sk?subject=PREMIUM PACKAGE ORDER">
                                            <span th:text="#{cooperation.paid.order}"></span>
                                        </a>
                                    </span>
                                </div>
                            </div>
                            <div class="span4">
                                <div class="priceBox">
                                    <h4 class="light">PROFESSIONAL</h4>
                                    <hr>
                                    <span class="emphasis" th:text="#{cooperation.paid.pro.price}"></span>
                                    <em th:text="#{cooperation.paid.methods}"></em>
                                    <hr>
                                    <span th:text="#{cooperation.paid.pro.1}"></span>
                                    <hr>
                                    <span th:text="#{cooperation.paid.pro.2}"></span>
                                    <hr>
                                    <span th:text="#{cooperation.paid.pro.3}"></span>
                                    <hr>
                                    <span th:text="#{cooperation.paid.pro.4}"></span>
                                    <hr>
                                    <span th:text="#{cooperation.paid.pro.5}"></span>
                                    <hr>
                                    <span th:text="#{cooperation.paid.pro.6}"></span>
                                    <hr>
                                    <span th:text="#{cooperation.paid.pro.discount}"></span>
                                    <hr>
                                    <span class="emphasis-2">
                                        <a class="btn btn-success" href="mailto:info@kryptotipy.sk?subject=PROFESSIONAL PACKAGE ORDER">
                                            <span th:text="#{cooperation.paid.order}"></span>
                                        </a>
                                    </span>
                                </div>
                            </div>
                        </div>

                        <div style="font-size: 17px; margin-top: 50px;margin-bottom: 50px;">
                            <span th:text="#{cooperation.paid.descr}"></span>
                            <br /><br />
                            <span th:text="#{cooperation.paid.descr2}"></span>
                        </div>
                    </div>
                </div>


                <div style="font-size: 17px; margin-top: 20px;margin-bottom: 50px;">
                    <h3><span th:text="#{cooperation.unpaid.title}"></span></h3>
                    <div>
                        <span th:text="#{cooperation.unpaid.descr}"></span>
                    </div>
                </div>


                <div th:each="service : ${services}" th:remove="tag">
                    <div th:replace="~{fragments/service :: one_service(${service}, ${link_is_no_follow})}" th:remove="tag"></div>
                </div>
            </ul>
        </div>
    </div>
</section>
