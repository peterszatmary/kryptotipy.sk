<li class="portfolio-item2" th:fragment="one_post(post)">
    <div class="span3">
        <div class="thumbnail">
            <div class="image-wrapp">
                <a th:href="${post.url}" target="_blank">
                    <img th:src="@{${'/' + post.imgSrc}}" th:alt="${post.title}" th:title="${post.title}" />
                    <article class="da-animate da-slideFromRight" style="display: block;">
                        <h4 th:text="${post.titleRender}"></h4>
                    </article>
                </a>
                <a th:href="${post.url}" th:text="${post.titleRender}" target="_blank" class="post-title" th:title="${post.title}" style="text-decoration: none;"></a>
                <span class="post-labels">
                      <a th:each="label : ${post.labels}" th:href="@{${'/posts/' + label.name}}" th:text="@{${label.name} + '&nbsp;&nbsp;' }"></a>
                </span>
                <div class="post-metadata">

                <a th:href="@{${'/posts-by-i18n/' + post.i18n}}">
                    <img th:src="@{${'/assets/img/flags/' + post.i18n + '.png'}}" width="20" height="35" th:title="@{${post.i18n + ' flag'}}" th:alt="@{${post.i18n + ' flag'}}" style="float: left;padding-right: 10px;"/>
                </a>
                    <div th:text="${#temporals.format(post.birthday,'dd.MM.yyyy') + '&nbsp;&nbsp;' + post.sourceRender}"></div>
                </div>
            </div>
        </div>
    </div>
</li>
