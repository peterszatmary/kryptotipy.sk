<html xmlns:th="http://www.thymeleaf.org" lang="en" th:remove="tag">

<li class="portfolio-item2" th:fragment="one_post(post)">
    <div class="span3">
        <div class="thumbnail">
            <div class="image-wrapp"  itemscope itemtype="https://schema.org/Article">
                <a th:href="${post.getPostViewUrl()}" rel="nofollow">
                    <img th:src="@{${'/' + post.imgSrc}}" th:alt="${post.title}" th:title="${post.title}" />
                    <article class="da-animate da-slideFromRight" style="display: block;" >
                        <h4 th:text="${post.titleRender}"></h4>
                    </article>
                </a>


                <a th:href="${post.getPostViewUrl()}" th:utext="${post.titleRender}" target="_blank" class="post-title" th:title="${post.title}" style="text-decoration: none;" rel="nofollow"></a>
                <div class="post-labels">
                      <th:block th:if="${post.labelName1 != null and post.labelRelevance1 != null}">
                         <a th:href="@{${'/posts/' + post.labelName1}}"
                            th:text="#{@{'a.label.' + ${post.labelName1}}}" style="margin-right:2px;"></a>
                      </th:block>
                      <th:block th:if="${post.labelName2 != null and post.labelRelevance2 != null}">
                         <a th:href="@{${'/posts/' + post.labelName2}}"
                            th:text="#{@{'a.label.' + ${post.labelName2}}}" style="margin-right:2px;"></a>
                      </th:block>
                      <th:block th:if="${post.labelName3 != null and post.labelRelevance3 != null}">
                         <a th:href="@{${'/posts/' + post.labelName3}}"
                            th:text="#{@{'a.label.' + ${post.labelName3}}}" style="margin-right:2px;"></a>
                      </th:block>
                      <th:block th:if="${post.labelName4 != null and post.labelRelevance4 != null}">
                         <a th:href="@{${'/posts/' + post.labelName4}}"
                            th:text="#{@{'a.label.' + ${post.labelName4}}}"></a>
                      </th:block>
                </div>
                <div class="post-metadata">
                    <a th:href="@{${'/news?lang=' + post.lang}}">
                        <img th:src="@{${'/assets/img/flags/' + post.lang + '.png'}}" width="20" height="35" style="float: left;padding-right: 10px;"
                                 th:title="#{${post.getI18nFlagRender()}}" th:alt="#{${post.getI18nFlagRender()}}"/>
                    </a>
                    <div>
                        <span th:text="${#temporals.format(post.birthday,'dd.MM.yyyy') + '&nbsp;&nbsp;' + post.getPostRenderShort()}">
                        </span>
                        &nbsp;
                        <i class="icon-eye-open" style="margin-right:-2px;"></i>
                        <span th:text="${post.views}"></span>
<!--                        <i class="icon-heart" style="margin-right:-2px;"></i>-->
<!--                        <span th:text="${post.likes}"></span>-->
                    </div>
                </div>
            </div>
        </div>
    </div>
</li>
