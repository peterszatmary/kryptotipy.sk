    <html xmlns:th="http://www.thymeleaf.org" lang="en" th:remove="tag">
    <section id="intro">
        <div class="jumbotron masthead">
            <div class="container">
                <!-- slider navigation -->
                <div class="sequence-nav">
                    <div class="prev">
                        <span></span>
                    </div>
                    <div class="next">
                        <span></span>
                    </div>
                </div>
                <!-- end slider navigation -->
                <div class="row">
                    <div class="span12">
                        <div id="slider_holder">
                            <div id="sequence">
                                <p class="btc_price" >
                                    <a href="/posts/bitcoin">
                                        <img src="/assets/img/icons/btc-icon.png"
                                             height="20"
                                             width="20"
                                             th:alt="#{indexbar.btc.price}" />
                                    </a>
                                    <span th:text="@{${'€ ' + btc_price}}"></span>
                                </p>
                                <ul>

                                    <!-- Layer 1 -->
                                    <li>
                                        <div class="info">
                                            <h2 th:text="#{indexbar.slider.1.title}"></h2>
                                            <br />
                                            <h3 th:text="#{indexbar.slider.1.2.title}"></h3>
                                            <p th:text="#{indexbar.slider.1.description}"></p>
                                            <a class="btn btn-success" href="/news" th:text="#{indexbar.link.all.posts}"></a>
                                            <br />
                                        </div>
                                        <img class="slider_img" src="/assets/img/slides/sequence/3.jpg"
                                             alt="Banner kryptotipy.sk" />
                                    </li>

                                    <!-- Layer 2 -->

                                    <li>
                                        <div class="info">
                                            <h2 th:text="#{indexbar.slider.2.title}"></h2>
                                            <br />
                                            <h3 th:text="#{indexbar.slider.2.2.title}"></h3>
                                            <p>
                                                <span th:text="#{indexbar.slider.2.count.a}"></span>
                                                <span th:text="${posts_count}"></span>
                                                <span th:text="#{indexbar.slider.2.count.b}"></span>
                                            </p>
                                            <a class="btn btn-success" href="/news" th:text="#{indexbar.link.all.posts}"></a>
                                            <br />
                                        </div>
                                        <img class="slider_img" src="/assets/img/slides/sequence/4.jpg"
                                             alt="Banner kryptotipy.sk" />
                                    </li>

                                    <!-- Layer 3 -->
                                    <li>
                                        <div class="info">
                                            <h2 th:text="#{indexbar.slider.3.title}"></h2>
                                            <br />
                                            <h3>
                                                <a href="https://shop.trezor.io/product/trezor-model-t?offer_id=15&aff_id=5933"
                                                    target="_blank"
                                                    th:text="#{indexbar.slider.3.2.title}">
                                                </a>
                                            </h3>
                                            <p>

                                            </p>
                                            <a class="btn btn-success" href="/krypto-learning"
                                               th:text="#{indexbar.link.all.posts}"></a>
                                            <br />
                                        </div>

                                        <img class="slider_img" src="/assets/img/slides/sequence/TREZOR-T.jpg"
                                             alt="Banner kryptotipy.sk" />
                                    </li>
                                </ul>
                            </div>
                        </div>
                        <!-- Sequence Slider::END-->
                    </div>
                </div>
            </div>
        </div>
    </section>
