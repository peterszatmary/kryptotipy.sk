    <script>
        function hideAndShowPostFilter() {
          var x = document.getElementById("filter-component");
          if (x.style.display === "none") {
            x.style.display = "block";
          } else {
            x.style.display = "none";
          }
        }

        function hideAndShowMoreCategories() {
          var x = document.getElementById("more-categories");

        }

        // select / unselect  all checkboxes by one
        document.getElementById('select-all').onclick = function() {
            var checkboxesLabel = document.getElementsByName('label');
            var allExceptMore = document.querySelectorAll('[title="main-element"]');
            for (var checkbox of allExceptMore) {
                checkbox.checked = this.checked;
            }
            var checkboxesLang = document.getElementsByName('lang');
            for (var checkbox of checkboxesLang) {
                checkbox.checked = this.checked;
            }
        }
