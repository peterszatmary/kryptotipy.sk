<html xmlns:th="http://www.thymeleaf.org" lang="en" th:remove="tag">
    <section id="subintro">
        <div class="jumbotron subhead" id="overview">
            <div class="container">
                <div class="row">
                    <div class="span12">
                        <div class="centered">
                            <h1 style="font-size: 22px; color: #fff;">Externé krypto služby</h1>
                            <p>Výber zaujímavých stránok, portálov, búrz, aplikácií, služieb týkajúcich sa kryptomien.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section id="breadcrumb">
        <div class="container">
            <div class="row">
                <div class="span12">
                    <ul class="breadcrumb notop">
                        <li><a th:href="${base_url}">Domov</a><span class="divider">/</span></li>
                        <li class="active">Externé krypto služby</li>
                    </ul>
                </div>
            </div>
        </div>
    </section>

    <section id="maincontent">
        <div class="container">
            <div class="row">
                <ul class="portfolio-area da-thumbs">
                    <div th:each="service : ${services}" th:remove="tag">
                        <div th:replace="fragments/service :: one_service(${service})" th:remove="tag"></div>
                    </div>
                </ul>
            </div>
        </div>
    </section>
