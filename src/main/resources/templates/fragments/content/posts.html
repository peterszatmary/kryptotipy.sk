<html xmlns:th="http://www.thymeleaf.org" lang="en" th:remove="tag">
<a name="newest-posts"></a>

<section id="subintro">
    <div class="jumbotron subhead" id="overview">
        <div class="container">
            <div class="row">
                <div class="span12">
                    <div class="centered">
                        <h1 style="font-size: 22px; color: #fff;" th:text="${label_render}"></h1>
                        <p>
                            Výber najnovších krypto noviniek zo sveta kryptomien zoradených vhodne do krypto kategórií.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<section id="breadcrumb">
    <div class="container">
        <div class="row">
            <div class="span12">
                <ul class="breadcrumb notop">
                    <li><a th:href="${base_url}">Domov</a><span class="divider">/</span></li>
                    <li class="active"><a th:href="@{${base_url + 'news' }}">Krypto novinky</a><span class="divider">/</span></li>
                    <li class="active" th:text="${label_render_path}"></li>
                </ul>
            </div>
        </div>
    </div>
</section>

<section id="maincontent">
    <div class="container">
        <div class="row" style="margin-top: -30px;">
<!--            <div class="span12">-->
<!--                <div class="navbar navbar-inner">-->

<!--                </div>-->
<!--            </div>-->

            <div th:replace="fragments/filter-component" th:remove="tag"></div>


            <ul class="portfolio-area da-thumbs">
                   <div th:each="post : ${posts}">
                       <div th:replace="fragments/post :: one_post(${post})"></div>
                   </div>
               </ul>
           </div>

           <p class="posts_ends_for_free">
               <a href="mailto:info@kryptotipy.sk" target="_blank">
                   <i class="icon-rounded icon-28 icon-pencil active"></i>
               </a>
                Ak ste sa preskrolovali až sem a radi by ste čítali staršie články, neváhajte nás kontaktovať
               na <a href="mailto:info@kryptotipy.sk" target="_blank">info@kryptotipy.sk</a>.
           </p>
       </div>
   </section>
