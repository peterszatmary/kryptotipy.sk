<html xmlns:th="http://www.thymeleaf.org" lang="en" th:remove="tag">
<a name="newest-posts"></a>

<section id="subintro">
    <div class="jumbotron subhead" id="overview">
        <div class="container">
            <div class="row">
                <div class="span12">
                    <div class="centered">
                        <h1 style="font-size: 22px; color: #fff;" th:text="${label_render}"></h1>
                        <p th:text="#{posts.description}"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<section id="breadcrumb">
    <div class="container">
        <div class="row">
            <div class="span12">
                <ul class="breadcrumb notop">
                    <li>
                        <a href="/" th:text="#{navbar.home}"></a>
                        <span class="divider">/</span>
                    </li>
                    <li class="active">
                        <a href="/news" th:text="#{link.news}"></a>
                        <span class="divider">/</span>
                    </li>
                    <li class="active" th:text="${label_render_path}"></li>
                </ul>
            </div>
        </div>
    </div>
</section>

<section id="maincontent">
    <div class="container">
        <div class="row" style="margin-top: -30px;">

            <div th:replace="fragments/filter-component" th:remove="tag"></div>

            <div style="margin-left:25px; margin-top: 20px;margin-bottom: 20px;margin-right: 20px;" >
                <h4 th:text="#{posts.interesting}"></h4>
                <a href="/article/majk-spirit-wexo-nft" target="_blank" th:text="#{article.majk.spirit.nft}"></a> |
                <a href="/article/ethereum-dapps-today" target="_blank" th:text="#{article.ethereum.dapps}"></a> |
                <a href="/article/passive-income-with-polkadot-on-ledger" target="_blank" th:text="#{posts.article.title.polkadot}"></a> |
                <a href="https://shop.trezor.io/product/trezor-model-t?offer_id=15&aff_id=5933" target="_blank">Trezor T</a> |
                <a href="/article/btc-is-not-the-first" target="_blank" th:text="#{posts.article.title.btc.first}"></a> |
                <a href="https://shop.trezor.io/product/trezor-one-black?offer_id=35&aff_id=5933" target="_blank">Trezor One</a> |
                <a href="/article/passive-income-with-cardano" target="_blank"  th:text="#{posts.article.title.cardano}"></a> |
                <a href="https://shop.ledger.com/pages/ledger-nano-x?r=b88bca019506" target="_blank">Ledger Nano X</a> |
                <a href="/article/passive-income-with-cosmos-atom" target="_blank" th:text="#{posts.article.title.cosmos}"></a> |
                <a href="https://lddy.no/v0jj" target="_blank">KeepKey</a> |
                <a href="/article/passive-income-with-algorand" target="_blank" th:text="#{posts.article.title.algorand}"></a>
            </div>

            <ul class="portfolio-area da-thumbs">
                   <div th:each="post : ${posts}">
                       <div th:replace="fragments/post :: one_post(${post})"></div>
                   </div>
               </ul>
           </div>

           <p class="posts_ends_for_free">
               <a href="mailto:info@kryptotipy.sk" target="_blank">
                   <i class="icon-rounded icon-28 icon-pencil active"></i>
               </a>
               <span th:text="#{posts.end.text}"></span>
               <a href="mailto:info@kryptotipy.sk" target="_blank">info@kryptotipy.sk</a>.
           </p>
       </div>
   </section>
