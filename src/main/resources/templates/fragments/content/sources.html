<html xmlns:th="http://www.thymeleaf.org" lang="en" th:remove="tag">

<section id="subintro">
    <div class="jumbotron subhead" id="overview">
        <div class="container">
            <div class="row">
                <div class="span12">
                    <div class="centered">
                        <h1 style="font-size: 22px;color: #fff;" th:text="${page_title}"></h1>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<section id="breadcrumb">
    <div class="container">
        <div class="row">
            <div class="span12">
                <ul class="breadcrumb notop">
                    <li><a href="/" th:text="#{navbar.home}"></a><span class="divider">/</span></li>
                    <li class="active"><span th:text="#{footer.sources.text}" itemprop="name"></span></li>
                </ul>
            </div>
        </div>
    </div>
</section>

<section id="maincontent">
    <div class="container">
        <div class="row">
            <div class="span12">
                <article itemscope itemtype="https://schema.org/Article">
                    <div class="heading">
                        <h2 th:text="${post_title}" itemprop="name"></h2>
                    </div>

                    <table class="table table-striped">
                        <thead>
                        <tr>
                            <th scope="col">#</th>
                            <th scope="col" th:text="#{sources.table.name}"></th>
                            <th scope="col" th:text="#{sources.table.url}"></th>
                            <th scope="col" th:text="#{sources.table.birthday}"></th>
                            <th scope="col" th:text="#{sources.table.numofpost}"></th>
                            <th scope="col" th:text="#{sources.table.country}"></th>
                        </tr>
                        </thead>
                        <tbody th:each="source : ${sources}">
                        <tr>
                            <th scope="row" th:text="${source.order}"></th>
                            <td th:text="${source.urlRendered}"></td>
                            <td><a th:href="${source.url}" th:text="${source.url}" rel="nofollow"></a></td>
                            <td th:text="${source.birthday}"></td>
                            <td th:text="${source.numberOfPosts}"></td>
                            <td>
                                <a th:href="@{${'/news?lang=' + source.i18n}}">
                                    <img th:src="@{${'/assets/img/flags/' + source.i18n + '.png'}}" width="40" height="70" style="float: left;padding-right: 10px;" />
                                         <!--th:title="#{${post.getI18nFlagRender()}}" th:alt="#{${post.getI18nFlagRender()}}" -->
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>

                    <div class="row">
                        <div class="span8">

                            <br /><br /><br />
                            <div th:replace="fragments/social-networks"></div>

                        </div>

                        <div class="span4">

                        </div>
                    </div>
                </article>
            </div>
        </div>
    </div>
</section>
