<html xmlns:th="http://www.thymeleaf.org" lang="en" th:remove="tag">
    <section id="subintro">
        <div class="jumbotron subhead" id="overview">
            <div class="container">
                <div class="row">
                    <div class="span12">
                        <div class="centered">
                            <h1 style="font-size: 22px; color: #fff;" th:text="#{crypto.learning.title}"></h1>
                            <p th:text="#{crypto.learning.description}">
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section id="breadcrumb">
        <div class="container">
            <div class="row">
                <div class="span12">
                    <ul class="breadcrumb notop">
                        <li>
                            <a href="/" th:text="#{navbar.home}"></a>
                            <span class="divider">/</span></li>
                        <li class="active" th:text="#{crypto.learning.title}"></li>
                    </ul>
                </div>
            </div>
        </div>
    </section>

    <section id="maincontent">
        <div class="container">
            <div class="row">
                <ul class="portfolio-area da-thumbs">
                    <div th:each="article : ${articles}" th:remove="tag">
                        <div th:replace="fragments/article :: one_article(${article})" th:remove="tag"></div>
                    </div>
                </ul>
            </div>
        </div>
    </section>
