<html xmlns:th="http://www.thymeleaf.org" lang="en" th:remove="tag">

<section id="subintro">
    <div class="jumbotron subhead" id="overview">
        <div class="container">
            <div class="row">
                <div class="span12">
                    <div class="centered">
                        <div class="iframe_post">
                            <div>
                                <div style="font-size: 15px; margin-top: 3px;">
                                    <span th:text="#{one.frame.you.watching.kryptotipy}"></span> <span th:text="${one_post.sourceRender}"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<section id="breadcrumb">
    <div class="container">
        <div class="row">
            <div class="span12">
                <ul class="breadcrumb notop">
                    <li>
                        <a href="/" th:text="#{navbar.home}"></a>
                        <span class="divider">/</span>
                    </li>
                    <li class="active">
                        <a href="/posts/all" th:text="#{link.news}"></a>
                        <span class="divider">/</span>
                    </li>
                    <li class="active" th:text="${one_post.title}"></li>
                </ul>
            </div>
        </div>
    </div>
</section>


<section id="maincontent">
    <div class="container">
        <div class="row" style="margin-top: -30px;">
            <div class="span8">

                <a th:href="@{${'/news?lang=' + one_post.i18n}}">
                    <img th:src="@{${'/assets/img/flags/' + one_post.i18n + '.png'}}" width="50" style="float: left;padding-right: 10px;padding-top: 5px;"
                         th:title="#{${one_post.getI18nFlagRender()}}" th:alt="#{${one_post.getI18nFlagRender()}}"/>
                </a>
                <h1 th:text="${one_post.title}"></h1>
                <p>
                    <strong th:text="${one_post.sourceRender}"></strong>
                    <span th:text="${#temporals.format(one_post.birthday,'dd.MM.yyyy')}"></span>
                </p>

                <div class="post-labels" style="padding-top:15px; padding-bottom:15px;font-size: 14px;">
                    <th:block th:if="${one_post_with_label.labelName1 != null and one_post_with_label.labelRelevance1 != null}">
                        <a th:href="@{${'/posts/' + one_post_with_label.labelName1}}"
                           th:text="#{@{'a.label.' + ${one_post_with_label.labelName1}}}" style="margin-right:2px;"></a>
                    </th:block>
                    <th:block th:if="${one_post_with_label.labelName2 != null and one_post_with_label.labelRelevance2 != null}">
                        <a th:href="@{${'/posts/' + one_post_with_label.labelName2}}"
                           th:text="#{@{'a.label.' + ${one_post_with_label.labelName2}}}" style="margin-right:2px;"></a>
                    </th:block>
                    <th:block th:if="${one_post_with_label.labelName3 != null and one_post_with_label.labelRelevance3 != null}">
                        <a th:href="@{${'/posts/' + one_post_with_label.labelName3}}"
                           th:text="#{@{'a.label.' + ${one_post_with_label.labelName3}}}" style="margin-right:2px;"></a>
                    </th:block>
                    <th:block th:if="${one_post_with_label.labelName4 != null and one_post_with_label.labelRelevance4 != null}">
                        <a th:href="@{${'/posts/' + one_post_with_label.labelName4}}"
                           th:text="#{@{'a.label.' + ${one_post_with_label.labelName4}}}"></a>
                    </th:block>
                </div>
                <img th:src="${page_image}" width="100%" style="height:300px;" />
                <p th:text="${one_post.content}" style="font-size: 15px;line-height: 1.8em; text-align: justify; padding-top: 20px; padding-bottom: 20px;">
                </p>

                <a class="btn btn-light" th:href="${one_post.url}" rel="nofollow">
                    <span th:text="#{one.frame.goto.kryptotipy}"></span> <span th:text="${one_post.sourceRender}"></span>
                </a>


            </div>
            <div class="span4"></div>
        </div>
    </div>
</section>
