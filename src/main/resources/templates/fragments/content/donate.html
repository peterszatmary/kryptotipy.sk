<html xmlns:th="http://www.thymeleaf.org" lang="en" th:remove="tag">
<section id="subintro">
    <div class="jumbotron subhead" id="overview">
        <div class="container">
            <div class="row">
                <div class="span12">
                    <div class="centered">
                        <h1 style="font-size: 22px; color: #fff;" th:text="#{donate.title}"></h1>
                        <p>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<section id="breadcrumb">
    <div class="container">
        <div class="row">
            <div class="span12">
                <ul class="breadcrumb notop">
                    <li>
                        <a href="/" th:text="#{navbar.home}"></a>
                        <span class="divider">/</span>
                    </li>
                    <li class="active" th:text="#{donate.title}"></li>
                </ul>
            </div>
        </div>
    </div>
</section>

<section id="maincontent">
    <div class="container">
        <div class="row">
            <ul class="portfolio-area da-thumbs">
                <h2 style="font-size: 35px;" th:text="#{donate.title}"></h2>

                <p>
                    <span th:text="#{donate.text.1}"></span>
                    <br />
                    <span th:text="#{donate.text.2}"></span>
                    <br />
                    <span th:text="#{donate.text.3}"></span>
                    <span th:text="#{donate.contact}"></span>.
                    <br />
                    <span th:text="#{donate.text.4}"></span>
                </p>

                <table class="table table-striped donate-table-big">
                    <thead>
                    <tr>
                        <th scope="col" th:text="#{donate.table.col.name}"></th>
                        <th scope="col" th:text="#{donate.table.col.imgurl}"></th>
                        <th scope="col" th:text="#{donate.table.col.address}"></th>
                        <th scope="col" th:text="#{donate.table.qr}"></th>
                    </tr>
                    </thead>
                    <tbody th:each="donate : ${donates}">
                        <tr>
                            <td>
                                <strong>
                                    <span th:text="${donate.name}" style="font-size:25px;"></span>
                                </strong>
                            </td>
                            <td>
                                <img th:src="${donate.img}" th:alt="${donate.name}"  th:title="${donate.name}" height="200" width="200" />
                            </td>
                            <td>
                                <span th:text="${donate.address}"></span>
                            </td>
                            <td>
                                <img th:src="${donate.qrImgUrl}" th:alt="${donate.name}"  th:title="${donate.name}" height="250" width="250" />
                            </td>
                        </tr>
                    </tbody>
                </table>


                <table class="table table-striped donate-table-small">
                    <thead>
                    <tr>
                        <th scope="col" th:text="#{donate.table.col.name}"></th>
                        <th scope="col" th:text="#{donate.table.qr}"></th>
                    </tr>
                    </thead>
                    <tbody th:each="donate : ${donates}">
                    <tr>
                        <td>
                            <img th:src="${donate.img}" th:alt="${donate.name}"  th:title="${donate.name}" height="200" width="200" />
                        </td>
                        <td>
                            <img th:src="${donate.qrImgUrl}" th:alt="${donate.name}"  th:title="${donate.name}" height="250" width="250" />
                        </td>
                    </tr>
                    </tbody>
                </table>
            </ul>
        </div>
    </div>
</section>
