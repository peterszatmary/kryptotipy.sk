<html xmlns:th="http://www.thymeleaf.org" lang="en" th:remove="tag">

<section class="iframe_post">
    <div class="container">
        <div class="row iframe_post">
            <div class="span12">
                <div style="font-size: 15px; margin-top: 3px;">Práve prezeráte stránky <span th:text="${post_url_rendered}"></span></div><br />
                <button type="button" class="btn btn-success" style="background-color: #94c045">Vrátiť sa na články</button>
                <button type="button" class="btn btn-secondary">Prejsť na stránky <span th:text="${post_url_rendered}"></span></button>
            </div>
        </div>
    </div>
</section>

<section class="iframe_post">
    <iframe th:src="${post_url_iframe}" style="height:900px;width:100%;" th:title="${post_url_value}">
    </iframe>
</section>
