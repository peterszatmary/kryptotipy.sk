<html xmlns:th="http://www.thymeleaf.org" lang="en" th:remove="tag">

<a name="newest-posts"></a>
<section id="maincontent">
    <div class="container">

        <div class="row">
            <div class="span12">
                <h2 style="font-size: 22px;margin-bottom: 0px;" th:text="#{index.new.posts}"></h2>
                <!--<div style="margin-bottom: 20px;">
                    <a href="/cooperation"><span th:text="#{index.cooperation.text}"></span></a>
                </div>-->
            </div>

            <ul class="portfolio-area da-thumbs">
                <div th:each="post : ${posts}">
                    <div th:replace="~{fragments/post :: one_post(${post})}"></div>
                </div>
            </ul>
        </div>


        <div class="row">
            <div class="span12">
                <h1 style="font-size: 22px;" th:text="#{navbar.crypto.learning}"></h1>
            </div>
            <ul class="portfolio-area da-thumbs">
                <div th:each="article : ${articles}" th:remove="tag">
                    <div th:replace="~{fragments/article :: one_article(${article})}" th:remove="tag"></div>
                </div>
            </ul>
        </div>

        <div class="row">
            <div class="span12">
                <h2 style="font-size: 22px;margin-bottom: 0px;" th:text="#{external.services.h1}"></h2>
                <!--<div style="margin-bottom: 20px;">
                    <a href="/cooperation"><span th:text="#{index.cooperation.text}"></span></a>
                </div>-->
            </div>

            <ul class="portfolio-area da-thumbs">
                <div th:each="ext_service : ${external_services}">
                    <div th:replace="~{fragments/service :: one_service(${ext_service}, ${link_is_no_follow})}" th:remove="tag"></div>
                </div>
            </ul>
        </div>
    </div>
</section>
