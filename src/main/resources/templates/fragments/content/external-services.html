<html xmlns:th="http://www.thymeleaf.org" lang="en" th:remove="tag">
    <section id="subintro">
        <div class="jumbotron subhead" id="overview">
            <div class="container">
                <div class="row">
                    <div class="span12">
                        <div class="centered">
                            <h3>Externé služby</h3>
                            <p>
                                Kryptomeny a svet okolo nich je ešte stale v plienkach. Z toho nevyhnutne plynie, že je pre bežné použitie stále náročné. Denne vznikajú nové služby, ktoré ponúkajú isté uľahčenie, informáciu ...
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section id="breadcrumb">
        <div class="container">
            <div class="row">
                <div class="span12">
                    <ul class="breadcrumb notop">
                        <li><a th:href="${base_url}">Domov</a><span class="divider">/</span></li>
                        <li class="active">Externé služby</li>
                    </ul>
                </div>
            </div>
        </div>
    </section>

    <section id="maincontent">
        <div class="container">
            <div class="row">
                <ul class="portfolio-area da-thumbs">
                    <div th:each="service : ${services}" th:remove="tag">
                        <div th:replace="fragments/service :: one_service(${service})" th:remove="tag"></div>
                    </div>
                </ul>
            </div>
        </div>
    </section>
