            <html xmlns:th="http://www.thymeleaf.org" lang="en" th:remove="tag">
            <li class="portfolio-item2" th:fragment="one_article(article)">
                <div class="span3">
                    <div class="thumbnail">
                        <div class="image-wrapp" itemscope itemtype="https://schema.org/Article">
                            <a th:href="${article.url}" target="_blank" th:rel="bookmark">
                                <img th:src="@{${'/assets/img/articles/index/' + article.imgSrc}}" th:alt="${article.title}" />
                                <article class="da-animate da-slideFromRight" style="display: block;">
                                    <h4 th:text="${article.title}"></h4>
                                </article>
                            </a>
                            <a th:href="${article.url}" class="post-title" th:text="${article.title}" target="_blank" style="text-decoration: none;" th:rel="${link_is_not_internal} ? 'external' : 'bookmark'"></a>
                            <span class="post-metadata" th:text="${article.description}"></span>
                        </div>
                    </div>
                </div>
            </li>
