            <html xmlns:th="http://www.thymeleaf.org" lang="en" th:remove="tag">
            <li class="portfolio-item2" th:fragment="one_service(service)">
                <div class="span3">
                    <div class="thumbnail">
                        <div class="image-wrapp">
                            <a th:href="${service.url}" target="_blank">
                                <img th:src="@{${'/assets/img/services/' + service.imgSrc}}" th:alt="${service.name}" />
                                <article class="da-animate da-slideFromRight" style="display: block;">
                                    <h4 th:text="${service.name}"></h4>
                                </article>
                            </a>
                            <a th:href="${service.url}" class="post-title" th:text="${service.name}" target="_blank" style="text-decoration: none;"></a>
                            <span class="post-metadata" th:text="${service.description}"></span>
                        </div>
                    </div>
                </div>
            </li>
