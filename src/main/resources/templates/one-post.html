<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${resolved_locale}" itemscope itemtype="https://schema.org/WebSite">
    <!-- duplication just because noindex head -->
    <head>

        <!-- Global site tag (gtag.js) - Google Analytics -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=UA-182396559-1"></script>
        <script>
                  window.dataLayer = window.dataLayer || [];
                  function gtag(){dataLayer.push(arguments);}
                  gtag('js', new Date());

                  gtag('config', 'UA-182396559-1');
            </script>

        <!--        <meta HTTP-EQUIV="REFRESH" th:content="@{${'0; url=https://www.kryptotipy.sk/' + site}}">-->
        <link rel="canonical" th:href="@{${base_url_without_port + site}}" itemprop="url" />


        <meta charset="utf-8">
        <title th:text="${page_title}"></title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="ahrefs-site-verification" content="9db20406c04a652307c41783ebc05970f93314d929d54c484f05e0367eb3dae2" />
        <meta name="description" th:content="${page_description}" />
        <meta name="author" th:content="${page_author}" />

        <!-- social open graph -->
        <meta property="og:url" th:content="${canonical_url}" itemprop="url" />
        <meta property="og:title" th:content="${page_title}" />
        <meta property="og:type" content="website" />
        <meta property="og:description" th:content="${page_description}" />
        <meta property="og:site_name" th:content="${page_title}" />
        <meta property="og:image" th:content="${page_image}" />
        <meta property="og:image:width" th:content="${page_image_width}"/>
        <meta property="og:image:height" th:content="${page_image_height}"/>
        <meta property="og:article:published_time" th:content="${page_date}" />
        <meta name="robots" content="noindex" />

        <!-- social twitter cards -->
        <meta name="twitter:card" content="summary" />
        <meta name="twitter:title" th:content="${page_title}" />
        <meta name="twitter:image" th:content="${page_image}" />
        <meta name="twitter:description" th:content="${page_description}" />
        <meta name="twitter:site" th:content="${canonical_url}" />
        <meta name="twitter:image:alt" th:content="${page_description}" />


        <!-- styles -->
        <link href="https://fonts.googleapis.com/css?family=Open+Sans:400italic,400,600,700" rel="stylesheet" />
        <link href="/assets/css/bootstrap.css" rel="stylesheet" />
        <link href="/assets/css/bootstrap-responsive.css" rel="stylesheet" />
        <link href="/assets/css/docs.css" rel="stylesheet" />
        <link href="/assets/js/google-code-prettify/prettify.css" rel="stylesheet" />
        <link href="/assets/css/flexslider.css" rel="stylesheet" />
        <link href="/assets/css/sequence.css" rel="stylesheet" />
        <link href="/assets/css/style.css" rel="stylesheet" />
        <link href="/assets/color/default.css" rel="stylesheet" />
        <link href="/assets/css/additional.css" rel="stylesheet" />


        <!-- fav and touch icons -->
        <link href="/assets/ico/favicon.ico" type="image/png" rel="icon" />
        <link href="/assets/ico/apple-touch-icon-144-precomposed.png" rel="apple-touch-icon-precomposed" sizes="144x144" />
        <link href="/assets/ico/apple-touch-icon-114-precomposed.png" rel="apple-touch-icon-precomposed" sizes="114x114" />
        <link href="/assets/ico/apple-touch-icon-72-precomposed.png" rel="apple-touch-icon-precomposed" sizes="72x72" />
        <link href="/assets/ico/apple-touch-icon-57-precomposed.png" rel="apple-touch-icon-precomposed" sizes="57x57" />
        <link rel="alternate" type="application/rss+xml" title="Kryptotipy.sk RSS zdroj" href="/rss" />
    </head>

    <body id="top">
        <!-- Google Tag Manager (noscript) -->
        <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-T3RDJ8D"
                          height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
        <!-- End Google Tag Manager (noscript) -->
        <div th:replace="fragments/cookies"></div>

        <header>
            <div class="navbar navbar-fixed-top">
                <div class="navbar-inner">
                    <div class="container">
                        <div style="float:left;">
                            <!-- logo -->
                            <a class="brand logo" href="/">
                                <img th:id="#{banner.kryptotipy}" th:alt="${page_title}" />
                            </a>
                        </div>

                        <div style="float:right; margin-bottom:10px; margin-top:20px; margin-right:20px;">
                            <div class="iframe_post">
                                <div>
                                    <div style="font-size: 15px; margin-top: 13px;">
                                        <span th:text="#{one.frame.you.watching}"></span> <span th:text="${one_post.sourceRender}"></span>
                                    </div><br />
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="social-panel" style="background-color: #333; color: #f2f2f2; text-align:right; padding-top:10px; padding-bottom: 10px;">

                            <div style="float:left; padding-left: 10px;padding-top: 5px;">
                                <i class="icon-eye-open" style="font-size:16px;padding-right:10px;">
                                    <span th:text="${one_post.views}"></span>
                                </i>

                                <a th:href="@{${'/news?lang=' + one_post.lang}}">
                                    <img th:src="@{${'/assets/img/flags/' + one_post.lang + '.png'}}" width="50"  style="float: left;padding-right: 10px;margin-top:-6px;"
                                         th:title="#{${one_post.getI18nFlagRender()}}" th:alt="#{${one_post.getI18nFlagRender()}}"/>
                                </a>
                                <span style="background-color:#f2f2f2;padding:10px;padding-bottom:12px;border-radius: 25px;">

                                    <a href="https://bit.ly/3cil00w" title="Ledger Nano X" target="_blank" rel="nofollow">
                                        <img src="/assets/img/logo/ledger.png"
                                             height="25" width="25"
                                             style="margin-left:10px;margin-right:10px;"
                                             alt="Ledger Nano X" />
                                    </a>

                                    <a href="https://shop.trezor.io/product/trezor-model-t?offer_id=15&aff_id=5933" title="Trezor T" target="_blank" rel="nofollow">
                                        <img src="/assets/img/logo/trezort.png"
                                             height="25" width="25"
                                             style="margin-right:10px;"
                                             alt="Trezor T" />
                                    </a>

                                    <a href="https://lddy.no/v0jj" title="Keep Key" target="_blank" rel="nofollow">
                                        <img src="/assets/img/logo/keepkey.png"
                                             height="25" width="25"
                                             style="margin-right:10px;"
                                             alt="Keep Key" />
                                    </a>

                                    <a href="https://shop.trezor.io/product/trezor-one-black?offer_id=35&aff_id=5933" title="Trezor One" target="_blank" rel="nofollow">
                                        <img src="/assets/img/logo/trezor-one.png"
                                             height="25" width="25"
                                             style="margin-right:10px;"
                                             alt="Trezor One" />
                                    </a>
                                </span>
                            </div>

                            <div style="margin-top:0px;">
                                <a class="btn btn-success" style="background-color: #94c045;" href="/news" th:text="#{one.frame.back}"></a>
                                <a class="btn btn-light" th:href="${one_post.url}" rel="nofollow" style="margin-right:10px;">
                                    <span th:text="#{one.frame.goto}"></span> <span th:text="${one_post.sourceRender}"></span>
                                </a>
                            </div>

                    </div>
                </div>
            </div>
        </header>

        <!-- self content start -->
        <section class="iframe_post">
            <iframe th:src="${one_post.url}" style="height:900px;width:100%;" th:title="${one_post.url}">
            </iframe>
        </section>
    </body>
</html>
