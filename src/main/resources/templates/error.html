<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" itemscope itemtype="https://schema.org/WebSite">

<head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            .error-template {padding: 40px 15px;text-align: center;}
            .error-actions {margin-top:15px;margin-bottom:15px;}
            .error-actions .btn { margin-right:10px; }
        </style>
        <link href="//netdna.bootstrapcdn.com/bootstrap/3.0.0/css/bootstrap.min.css" rel="stylesheet" id="bootstrap-css">
        <script src="//netdna.bootstrapcdn.com/bootstrap/3.0.0/js/bootstrap.min.js"></script>
        <script src="//code.jquery.com/jquery-1.11.1.min.js"></script>
    </head>
    <body>
        <div class="container">
            <div class="row">
                <div class="col-md-12">
                    <div class="error-template">
                        <h1 th:text="#{error.title}"></h1>
                        <h2 th:text="#{error.message}"></h2>
                        <div class="error-details" th:text="#{error.recommendation}">
                        </div>
                        <div class="error-actions">
                            <a href="https://www.kryptotipy.sk" class="btn btn-success btn-lg">
                                <span class="glyphicon glyphicon-home"></span> <span th:text="#{error.get.me.back}"></span>
                            </a>

                            <a href="mailto:info@kryptotipy.sk" class="btn btn-default btn-lg">
                                <span class="glyphicon glyphicon-envelope"></span> <span th:text="#{error.or.contact.us}"></span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
