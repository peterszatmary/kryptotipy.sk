external.services.h1 = Externe cryptodiensten
external.services.h1.description = Selectie van interessante sites, portals, uitwisselingen, applicaties, cryptocurrency-services.
external.services.service.1.title = Blockchair
external.services.service.1.description = Dienst die transacties en andere gegevens in 17 verschillende blockchains kan doorzoeken, zoals BTC, Monero, ETH, LTC ...
external.services.service.2.title = Safe One (zwart)
external.services.service.2.description = Koude portemonnee met maximale beveiliging voor uw cryptocurrencies. Ondersteunt een aantal cryptocurrencies.
external.services.service.3.title = Coinbase
external.services.service.3.description = Dienst om geselecteerde cryptocurrencies te kopen en verkopen die gebouwd zijn op lonkende GDAx. Het voordeel is eenvoud.
external.services.service.4.title = Exodus
external.services.service.4.description = De portemonnee die een aantal cryptocurrencies ondersteunt, plus een ingebouwd wisselkantoor dat wordt aangedreven door een andere Shapeshift-service.
external.services.service.5.title = Coinbase.Pro
external.services.service.5.description = Coinbase cryptocurrency-uitwisseling. Met de oorspronkelijke naam GDAX nu bekend als Coinbase.Pro.
external.services.service.6.title = Poloniex
external.services.service.6.description = Amerikaanse crypto-uitwisseling, opgericht in 2014 in Amerika. Het is ook een interessante manier om te beginnen met handelen in cryptoma's.
external.services.service.7.title = Jaxx
external.services.service.7.description = Portemonnee die een aantal munten ondersteunt. Het is lichtgewicht en heet. Het hoeft niet de hele blockchain te downloaden, wat ruimte bespaart op harde schijven.
external.services.service.8.title = Kluis T
external.services.service.8.description = Koude portemonnee met verbeterde beveiliging voor uw cryptocurrencies. Het ondersteunt zelfs meer cryptocurrencies dan het One-model.
external.services.service.9.title = Kucoin
external.services.service.9.description = Cryptocurrency Exchange. Het voegt snel en betrouwbaar nieuwe cryptocenen met potentieel toe. Hier vindt u cryptocurrencies die u niet op andere beurzen zult zien.
external.services.service.10.title = KeepKey
external.services.service.10.description = Wallet-hardware die een aantal cryptocurrencies van de Shapeshift-groep ondersteunt. Geschikt als goedkoper alternatief voor Safe-producten.
external.services.service.11.title = Kraken
external.services.service.11.description = Amerikaanse cryptocurrency exchange met een rijke geschiedenis. Het werd opgericht in 2011. Een andere manier om te beginnen met handelen in cryptoma's.
external.services.service.12.title = Neo to Gas
external.services.service.12.description = Berekent opnieuw hoeveel GAS-token er moet worden opgehaaldals passief inkomen voor het houden van NEO-tokens in een gespecialiseerde NEON-portemonnee.
external.services.service.13.title = ATHA
external.services.service.13.description = Laatste aller tijden hoge (ATH) cryptocurrencies met tijdstempel. ATH is de maximale waarde die de cryptocurrency ooit heeft bereikt.
external.services.service.14.title = Ledger Nano X
external.services.service.14.description = Koude portemonnee met nadruk op beveiliging ondersteunt een aantal cryptocurrencies. Ondersteunt Bluetooth-verbinding
external.services.service.15.title = ShapeShift
external.services.service.15.description = Het is een crypto-wisselkantoor. Het belangrijkste voordeel is dat u zich niet hoeft te registreren. Het wordt gebruikt om cryptocurrencies te veranderen in cryptomunten.
external.services.service.16.title = Ethplorer
external.services.service.16.description = Nadat je het adres hebt ingevoerd, kan het niet alleen het ETH-saldo in je portemonnee laten zien, maar ook het saldo van alle ETH-tokens op het opgegeven adres.
external.services.service.17.title = Binance
external.services.service.17.description = Cryptocurrency Exchange. Het werd opgericht in China in 2017. In hetzelfde jaar was het meer dan succesvol. Tegenwoordig is het een van de grootste crypto-exchanges ter wereld.
external.services.service.18.title = Bitfinex
external.services.service.18.description = Cryptocurrency Exchange. Maker van USDT. Het werd opgericht in 2012. Het is eigendom van en wordt beheerd door iFinex Inc.
external.services.service.19.title = Bittrex
external.services.service.19.description = Cryptocurrency Exchange. Het werd opgericht in Amerika in 2013. AKo was de eerste die een vervanger aanbood voor de USDT, de zogenaamde TUSD (echte USD).
external.services.service.20.title = Bitscreener
external.services.service.20.description = Sorteer op valutaprijs, marktkapitalisatie, 24-uursvolume en type. Chartview biedt een procentuele samenvatting van de wijziging.
external.services.service.21.title = Coinmarketcap
external.services.service.21.description = Cryptocurrency monitoring pagina wordt verhandeld. Het biedt een aantal bruikbare rankings, grafieken en crypto-informatie.
external.services.service.22.title = Cryptocompare
external.services.service.22.description = Cryptocurrency monitoring, verschillende rekenmachines voor miners, cryptocurr wallets, REST API voor ontwikkelaars en meer.
external.services.service.23.title = Coindar
external.services.service.23.description = Dit is een soort crypto-kalender. Dankzij deze service word je op de hoogte gehouden van aankomende crypto-evenementen en mis je niets.
external.services.service.24.title = Crypto Fear & Greed Index
external.services.service.24.description = Crypto Fear & Greed Index meet de huidige stemming in cryptomenmarkten. Het controleert twee basale stemmingen: angst en hebzucht.
external.services.service.25.title = Muntautomaat-radar
external.services.service.25.description = Een webservice waarmee u verschillende cryptocurrencies kunt vinden om verschillende cryptocurrencies in uw directe omgeving te kopen en verkopen.
external.services.service.26.title = Airdrops.io
external.services.service.26.description = Service monitoring zogenaamde token airdrops, dit zijn gratis tokens voor het uitvoeren van de meest voorkomende taken op sociale netwerken en dergelijke.
external.services.service.27.title = Uitzetbeloningen
external.services.service.27.description = Met deze service kunt u gemakkelijk berekenen hoeveel uw passief inkomen is als u een van de bewijzen van inzetfiches bezit.
external.services.service.28.title = Crypto-tank
external.services.service.28.description = Dit is een tankstation in Tsjechië, waar het mogelijk is om voor brandstof te betalen met de populaire Bitcoin.
external.services.service.29.title = Whitepapers.io
external.services.service.29.description = Whitepaper is de technische specificatie van het cryptoceen. Deze service biedt ze allemaal op één plek.
external.services.service.30.title = Bitcoin overlijdensberichten
external.services.service.30.description = Bitcoins hebben in totaal 395 keer de dood voorspeld. Het is dit jaar 3 keer geweest. Hoeveel van dergelijke voorspellingen zal Bitcoin nog overleven?
did.you.know=Wist je dat
did.you.know.title = Crypto-curiositeiten
did.you.know.description = uit een wereld van cryptocurrencies die je misschien niet kent.
did.you.know.bitcoin.1 = Bitcoin ging in 2010 in de verkoop voor $ 0,0008. Op 17 december 2017 bereikte het zijn maximale waarde van $ 20.089.
did.you.know.bitcoin.2 = Wanneer de laatste Bitcoin is geëxtraheerd, zullen miners gemotiveerd blijven om transacties te valideren met vergoedingen voor voltooide transacties. Tegenwoordig worden ze bovendien beloond met een bepaald aantal bitcoins na elk geëxtraheerd blok.
did.you.know.bitcoin.3 = Bitcoin-halvering is een gebeurtenis waarbij de beloningen voor een geëxtraheerd blok in tweeën worden gedeeld. Deze gebeurtenis zal ook het inflatiepercentage verhogen en ook de snelheid waarmee nieuwe Bitcoins in omloop komen. Dit gebeurt elke 210.000 geëxtraheerde blokken.
did.you.know.bitcoin.4 = Geschat wordt dat het laatste gedolven blok Bitcoin het licht van de cyberwereld zal zien in 2140.
did.you.know.bitcoin.5 = Beloningen voor het geëxtraheerde Bitcoin-blok bedroegen 50 BTC in 2009, na de eerste halvering was het slechts 25 BTC en na 11.5.2020 (derde halvering) is het momenteel 6,25 BTC.
did.you.know.bitcoin.6 = Bitcoin heeft een maximum aantal munten van 21 miljoen. Er zal niet meer zijn.
did.you.know.bitcoin.7.3 = Het is dit jaar 3 keer geweest. Hoeveel van dergelijke voorspellingen zal Bitcoin nog overleven?
did.you.know.bitcoin.7.1 = Bitcoin had de dood al voorspeld
did.you.know.bitcoin.7.2 = in totaal 395 keer
did.you.know.bitcoin.8 = Er zijn minder Bitcoin-munten in omloop dan Litecoin-munten. Ter vergelijking: het aantal Bitcoin-munten is 18,5 miljoen vs. aantal Litecoin-munten 66,2 miljoen. (2021)
did.you.know.bitcoin.9.1 = De grootste mijnwerker in het Bitcoin-netwerk is een pool genaamd F2Pool, die meer dan 17% van de volledige netwerkhashate levert.
did.you.know.bitcoin.9.2 = De tweede is BinancePool met 11,9% en de eerste drie worden gesloten door de Poolin-pool met 11,7% van de netwerkhashate.
did.you.know.bitcoin.10 = 8.1.2021, voor het eerst in de geschiedenis overtrof Bitcoin de waarde in termen van 1 miljoen Slowaakse kronen. Dit gebeurde voor de tweede keer op 6.2.2021. Tot de derde van 8.2.2021 blijft het tot op de dag van vandaag boven dit niveau.
did.you.know.bitcoin.11=Steve Wozniak, mede-oprichter van 's werelds grootste beursgenoteerde bedrijf, is een fan van Bitcoin. In 2021 zei hij dat Bitcoin een wonderbaarlijke technologie is met een unieke wiskundige formule.
did.you.know.bitcoin.12=In 2010 werden 184 miljard bitcoins gedolven nadat een aanvaller een codefout had misbruikt. Het was een blok met het nummer 74638. Satoshi Nakamoto repareerde de fout 5 uur na ontdekking.
did.you.know.bitcoin.13=Millennials, mensen geboren tussen 1980 en 1995, zijn dol op BTC en investeren er graag in.
did.you.know.bitcoin.14=Bitcoin verbruikt veel minder energie dan goudwinning of traditioneel bankieren. (2021, Galaxy Digitaal)
did.you.know.bitcoin.15=AXA, de op één na grootste verzekeringsmaatschappij van Europa, gaat Bitcoin accepteren. (202)
did.you.know.bitcoin.16=De duurste NFT werd verkocht voor $ 69 miljoen. (202)
did.you.know.bitcoin.17=Geschat wordt dat tot 20% van alle Bitcoins onherstelbaar verloren gaat. Dit is ongeveer 3-4 miljoen BTC. (2021)
did.you.know.bitcoin.18=90% van alle Bitcoins is al gemined. (2021)
did.you.know.bitcoin.19=In New York kun je ook onroerend goed kopen voor cryptocurrencies. Specifiek voor Bitcoin, Ethereum, DogeCoin. Algocap Real Estate heeft besloten om betalingen in cryptocurrencies te accepteren.
did.you.know.bitcoin.20=Ray Dalio, de oprichter van 's werelds grootste hedgefonds, is ook eigenaar van Bitcoin. (2021)
did.you.know.bitcoin.21.1=Daymak Avvenire elektrische auto genaamd
did.you.know.bitcoin.21.2=kan de cryptocurrencies Bitcoin en Dogecoin minen tijdens het opladen.
did.you.know.monero.1 = Het maximum aantal Monera-munten is niet beperkt. Hun uitgifte is echter gereguleerd. De muntbeloning wordt verlaagd tot eind mei 2022, wanneer er 18.132.000 in omloop zijn, daarna stopt de beloning bij 0,6 XMR.

did.you.know.neo.1 = Als u NEO-tokens in uw NEON-portemonnee steekt, kunt u automatisch een andere cryptocurrency verdienen en dat is GAS. Met andere woorden, u krijgt een passief inkomen.
did.you.know.neo.2 = Neo is een proof of stake-platform dat vaak wordt gezien als het Chinese Ehereum. Net als Ethereum biedt NEO de mogelijkheid om zogenaamde slimme contracten te creëren.

did.you.know.ethereum.1 = Ethereum 2.0 werd gelanceerd op 1.12.2020. De belangrijkste wijzigingen zijn onder meer Bewijs van inzet in plaats van het vorige Bewijs van werk. Binnen 2 jaar een stijging van het aantal transacties van 15 naar 100.000 per seconde.
did.you.know.ethereum.2=Na het harde fort van Londen wordt er elke minuut voor $ 10.000 aan ETH verbrand. (2021)
did.you.know.iota.1 = is de enige cryptocurrency waarvan de transactiekosten gelijk zijn aan 0. Met andere woorden, ze zijn gratis.
did.you.know.iota.2 = Zoals de naam al aangeeft, is IOTA klaar voor het zogenaamde IOT Internet of Things, waar alles verbonden en toegankelijk zal zijn via internet. Uw koelkast kan bijvoorbeeld betalen en winkelen zonder uw medeweten en meer. IOTA is de enige die microtransacties toestaat die in de toekomst gemeengoed zullen worden. Wie als eerste microtransacties implementeert en hoe het niet belangrijk is. We hebben vandaag echter al een platform dat het idee van microtransactie tot leven kan brengen dankzij nulkosten. Om de transactie uit te voeren, is het voldoende als deze is geverifieerd door twee andere netwerkknooppunten.
did.you.know.iota.3 = IOTA presenteert slimme contracten op zijn platform, wat tegen het einde van 2021 een realiteit zou kunnen zijn.

did.you.know.litecoin.1 = Litecoin is ontstaan ​​uit de Bitcoin-broncode in 2011.
did.you.know.litecoin.2 = Litecoin heeft een maximum aantal munten van 84 miljoen. Er zal niet meer zijn.
did.you.know.litecoin.3 = Er zijn minder Bitcoin-munten in omloop dan Litecoin-munten. Ter vergelijking: het aantal Bitcoin-munten is 18,5 miljoen vs. aantal Litecoin-munten 66,2 miljoen. (2021)

did.you.know.tether.1 = Tether is een stablecoin gecreëerd in samenwerking met Tether Limited en de beurs
did.you.know.tether.2 = 1 Tether dekt precies $ 1.
did.you.know.tether.3 = Tether is gemaakt zodat handelaren hun cryptocurrencies voor FIAT niet onnodig hoeven te veranderen tijdens hun transacties.

did.you.know.btccash.1 = Bitcoin Cash is gemaakt als een harde vork van Bitcoin.
did.you.know.btccash.2 = De belangrijkste reden voor Bitcoin Cash was om het transactieblok te vergroten van 1 MB naar 8 MB. Hierdoor kan Bitcoin Cash meer transacties per seconde verwerken dan Bitcoin.

did.you.know.btcsv.1 = SV staat voor Satoshi Vision, wat zich vertaalt naar Satoshi's visie.
did.you.know.btcsv.2 = Bitcoin SV is ontstaan ​​als een harde vork van de cryptocurrency Bitcoin Cash.
did.you.know.btcsv.3 = Achter de opkomst van de cryptocurrency Bitcoin SV zit opnieuw een toename van het transactieblok van 8 MB naar 128 MB, wat een nog hoger aantal gevalideerde transacties per seconde betekent.


