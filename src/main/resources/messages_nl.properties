dictionary.address.title = Adres
dictionary.address.description = worden gebruikt om transacties op het netwerk te verzenden en te ontvangen. Dit zijn hexadecimale tekenreeksen die uw unieke ID vertegenwoordigen
dictionary.arbitraz.title = Arbitrage
dictionary.arbitraz.description = - gebruik van ongelijke prijzen van een bepaald object op verschillende plaatsen / markten voor een winst die gelijk is aan het verschil tussen deze prijzen (bij afwezigheid van gerelateerde risico's)
dictionary.wallets.href = portefeuilles
dictionary.blockchain.href = blockchaine
dictionary.in = in
dictionary.airdrop.title = Airdrop
dictionary.airdrop.description = in cryptocurrencies is het proces van distributie naar nieuwe of bestaande eigenaren van een bepaalde valuta, of
dictionary.airdrop.description.1 =, waar het soms nodig is om het menu te bezitten of aan andere vereisten te voldoen.
dictionary.altcoin.title = Altcoin (Alt)
dictionary.altcoin.description = - alles
dictionary.altcoin.description.2 = (digitale valuta) gemaakt na Bitcoin worden altcoins genoemd.
dictionary.atl.title = ATL (Altijd laag)
dictionary.atl.description =- is het tegenovergestelde van ATH, met andere woorden de laagste waarde die de cryptocurrency voor de hele periode heeft bereikt.
dictionary.ath.title = ATH (Altijd hoog)
dictionary.ath.description = - de hoogste prijs van een bepaalde cryptocurrency in zijn hele geschiedenis.
dictionary.asic.title = ASIC (toepassingsspecifieke geïntegreerde schakeling)
dictionary.asic.description = - microchips zijn gemaakt voor slechts één taak, namelijk het delven van een specifieke
dictionary.asic.description.2 = (een die het gebruik van brute kracht toestaat = hoe hoger de macht, hoe groter de winst van mijnbouw).
dictionary.bearish.title = Bearish markt
dictionary.bearish.description = - geef aan wanneer de markt een dalende trend heeft.
dictionary.bip.title = BIP (Bitcoin-verbeteringsvoorstellen)
dictionary.bip.description = vertaalde suggesties voor verbetering
dictionary.bip.description.2 = Bitcoin
dictionary.bip.description.3 =, die kan worden ingediend door iedereen die geïnteresseerd is in het verbeteren van het Bitcoin-netwerk.
dictionary.btc.title = Bitcoin (BTC)
dictionary.btc.description = - de eerste digitale valuta die in 2009 werd gelanceerd door een persoon of groep onder het pseudoniem Satoshi Nakamoto.
dictionary.blockchain.title = Blockchain
dictionary.blockchain.description = - een gedistribueerde (gedecentraliseerde) database of netwerk waarin alle openbare cryptocurrency-boeken worden opgeslagen.
dictionary.blocks.title = Blokken
dictionary.blocks.description = - zijn datapakketten die permanent opgenomen data overdragen in
dictionary.bullish.title = Bullish markt
dictionary.bullish.description = - een staat waarin de markt een opwaartse trend vertoont.
dictionary.coldwallet.title = Koude portemonnee
dictionary.coldwallet.description = - Digitale valuta opgeslagen buiten het internet. Voorbeelden zijn een papieren portemonnee, een hardware-portemonnee. De reden voor het bestaan ​​van dergelijke soorten portemonnees is een grotere beveiliging. Het tegenovergestelde is de zogenaamde hot wallet.
dictionary.coin.title = Munt
dictionary.coin.description = - een eenheid van digitale cryptocurrency. Het wordt vaak gebruikt als synoniem en een kortere term voor een cryptocurrency.
dictionary.crypto.title = Crypto-valuta (cryptocurrency)
dictionary.crypto.description = - digitale valuta gebaseerd op cryptografie.
dictionary.dyor.title = DYOR (doe je eigen onderzoek)
dictionary.dyor.description = - betekent dat je je eigen onderzoek of overzicht doet over een bepaald onderwerp of valuta.
dictionary.dao.title = DAO - (gedecentraliseerde autonome organisaties)
dictionary.dao.description = betekent in vertaling gedecentraliseerde autonome organisaties - je kunt ze voorstellen als bedrijven die kunnen functioneren zonder enige menselijke tussenkomst (autonomie) en die alle vormen van controle hebben omgezet in niet-corrupte bedrijfsregels.
dictionary.daico.title = DAICO - Gedecentraliseerde ICO
dictionary.daico.description = - De werking van de ICO wordt alleen geleverd door een slim contract dat werkt in de gegeven
dictionary.daico.description.2 =. (Allereerst
dictionary.daico.description.3 =, aangezien de maker van het idee Vitalik Buterin is)
dictionary.dapp.title = DAPP - (Een gedecentraliseerde applicatie)
dictionary.dip.title = Dip
dictionary.dip.description = - het laagste punt op de grafiek of de lokale minimumwaarde
dictionary.dip.description.2 = Ook tijd om te shoppen.
dictionary.dump.title = Dump
dictionary.dump.description = - een significante daling van de waarde van een cryptocurrency of aandeel of handelswaar.
dictionary.erc20.title = ERC-20
dictionary.erc20.description = - Interface op basis waarvan nieuwe worden aangemaakt
dictionary.erc20.description.2 = gebaseerd op
dictionary.erc20.description.3 =. Met andere woorden, een slim contract dat een bepaalde ERC-20-verordening implementeert.
dictionary.erc20.description.4 = Lees hier meer over wat de ERC-20 beschrijft.
dictionary.erc223.title = ERC-223
dictionary.erc223.description = - opvolger van de ERC20-standaard. Het zou onder andere goedkopere transacties moeten opleveren en bijvoorbeeld de mogelijkheid moeten hebben om lang verloren gegane tokens te selecteren waartoe niemand toegang heeft. Meer informatie
dictionary.erc721.title = ERC-721
dictionary.erc721.description = is een standaardtoken in het Ethereum-netwerk waarmee u alleen NFT-tokens kunt produceren en ontwikkelaars dwingt om voor elk nieuw token een nieuw slim contract te maken en te implementeren. Ter vergelijking: met de ERC-1155-tokenstandaard kunnen zowel NFT-tokens als vervangbare tokens worden gemaakt. Het is niet nodig om voor elk token een nieuw smart contract aan te maken en te implementeren. Slechts één is genoeg.
dictionary.erc1155.title = ERC-1155
dictionary.erc1155.description = ERC-1155 is een tokenstandaard waarmee u zowel zogenaamde niet-vervangbare tokens (NFT) als fungibele tokens op het Ethereum-netwerk kunt maken. De ERC-1155-tokenstandaard is gemaakt om te functioneren als een automaat, waar ontwikkelaars een enkel smart contract kunnen inzetten, dat kan worden gebruikt om onbeperkt vervangbare (identieke) tokens te maken, evenals (unieke) NFT-tokens. Ter vergelijking: de ERC-721-tokenstandaard produceert alleen NFT-tokens en dwingt ontwikkelaars om voor elk nieuw token een nieuw slim contract te implementeren en te creëren.
dictionary.ep5.title = EP-5
dictionary.ep5.description = - Vergelijkbaar met ERC20 of ERC223, dit is een standaard token maar voor
dictionary.exchange.title = Uitwisseling
dictionary.exchange.description = - een website met een digitale beurs waar ze kopen en verkopen
dictionary.fomo.title = FOMO (De angst om te missen)
dictionary.fomo.description = - emotie van angst voor gemiste kansen. Het is vaak de oorzaak van het kopen van valuta op zijn hoogtepunt of het verkopen met verlies.
dictionary.fork.title = VORK
dictionary.fork.description = - Een software-update die resulteert in een wijziging die mogelijk compatibel of incompatibel is met de huidige softwareversie. Zie harde vork, zachte vork.
dictionary.fud.title = FUD (angst, onzekerheid en twijfel)
dictionary.fud.description = - een mengeling van emoties zoals angst, onzekerheid en twijfel, veroorzaakt door negatief nieuws uit de wereld van cryptocurrencies. Als gevolg van dergelijke paniek kan de prijs vaak dalen.
dictionary.fudster.title = FUDster
dictionary.fudster.description = - is iemand die FUD-media verspreidt.
dictionary.fiat.title = FIAT
dictionary.fiat.description = - officiële valuta uitgegeven door overheden (EUR, USD, etc.)
dictionary.fundament.title = Fundamentele analyse
dictionary.fundament.description = - analyse op basis van openbaar beschikbare informatie om de toekomstige prijs te bepalen
dictionary.fundament.description.2 = / akcie ...
dictionary.genesis.title = Genesis blok
dictionary.genesis.description = - Het allereerste blok in
dictionary.genesis.description.2 = blockchaine
dictionary.halving.title = Halvering
dictionary.halving.description = - is een evenement waarin de verdeling van beloningen voor de bezetters plaatsvindt
dictionary.halving.description.2 = precies half blok. Deze gebeurtenis zal ook het inflatiepercentage halveren en ook de snelheid waarmee nieuwe Bitcoins in omloop komen. Dit gebeurt eens per 210.000 geëxtraheerde blokken.
dictionary.hardfork.title = Harde vork
dictionary.hardfork.description = - software-update die leidt tot een wijziging die niet compatibel is met de huidige softwareversie (ouder), wat betekent dat een dergelijk verouderd knooppunt niet volledig kan functioneren met bijgewerkte knooppunten (mogelijk niet transacties kunnen verifiëren, transacties kunnen ontvangen of verzenden, enz.). Na het harde fort is er altijd ruimte voor een nieuwe munteenheid. Dit gebeurt wanneer een deel van het netwerk de update afwijst en de oude versie blijft gebruiken. Vanaf deze versie leiden beide netwerken hun eigen leven. Als het netwerk een incompatibele update krijgt, spreken we van een harde schijf zonder nieuwe cryptocurrency.
dictionary.hardwallet.title = Hardware Portemonnee
dictionary.hardwallet.description = - cryptografisch beveiligde hardware die is ontworpen om de informatie in uw portemonnee te beveiligen. Voorbeelden zijn een portemonnee
dictionary.hashrate.title = Hashrate
dictionary.hashrate.description = - Een getal dat de snelheid van de pull aangeeft, meer specifiek het aantal hashes dat de machine per seconde kan oplossen.
dictionary.hodl.title = HODL
dictionary.hodl.description = - een term afgeleid van de originele HOLD betekent houden en niet verkopen van munten.
dictionary.hotwallet.title = Hot portemonnee
dictionary.hotwallet.description = - portemonnee verbonden met internet, voor dagelijkse transacties. Maar vanwege internet is het minder veilig.
dictionary.hype.title = Hype
dictionary.hype.description = - massaal enthousiasme, niet alleen rond een cryptocurrency om deze zichtbaar te maken op de markt. De term is over het algemeen niet gebonden aan een crypto.
dictionary.ico.title = ICO (eerste muntenaanbieding)
dictionary.ico.description = - eerste openbare aanbieding van digitale valuta vóór aanbieding. Het is vergelijkbaar met crowdfunding in de digitale wereld.
dictionary.kaico.title = KAICO
dictionary.kaico.description = - CryptoKami kwam met hun eigen idee van ICO. Het is een soort concurrent voor DAICO. Hoewel ze op elkaar lijken, bieden ze ook verschillende eigenschappen.
dictionary.kaico.description.2 = Je kunt er hier meer over lezen.
dictionary.cap.title = Hoofdlettergebruik
dictionary.cap.description = - alle munten van een bepaalde cryptocurrency die in omloop zijn, vermenigvuldigd met de huidige waarde van de munt.
dictionary.cap.description.2 = Je kunt er hier meer over lezen.
dictionary.confirmation.title = Bevestiging
dictionary.confirmation.description = - De transactie wordt bevestigd als deze is bevestigd door een bepaald aantal knooppunten (mijnwerkers) in het netwerk. Dit is een succesvol wachtwoord dat wordt ingeslikt en aan de blockchain wordt toegevoegd.
dictionary.correction.title = Correctie
dictionary.correction.description = - is de tegenovergestelde beweging, meestal negatief, meestal een daling van 10 procent in aandelen of effecten ... waarbij de overwaardering van de prijs achterwaarts wordt gecompenseerd. Correcties zijn tijdelijk en onderbreken de doorgaans opwaartse trend.
dictionary.consensus.title = Consensus
dictionary.consensus.description = - wordt bereikt wanneer alle deelnemende knooppunten ermee instemmen om de transactie in de blockchain op te nemen.
dictionary.kyc.title = KYC (Ken uw klant)
dictionary.kyc.description = - ken uw klant. Het proces waarbij de klant (koper) zijn identiteit verifieert door persoonsgegevens in te vullen en vaak ook door identificatiekaarten naar de server te uploaden.
dictionary.marketcap.title = Marktkapitalisatie
dictionary.marketcap.description = - totale waarde van alle munten in omloop van de gegeven cryptocurrency.
dictionary.mooning.title = Mooning
dictionary.mooning.description = - geef aan wanneer de prijs stijgt. Dit hoeft niet per se een extreme stijging te zijn.
dictionary.multisignature.title = Meerdere handtekeningen
dictionary.multisignature.description = - (multisig) meerdere ondertekenbare adressen zorgen ervoor dat meerdere partijen meer dan één sleutel nodig hebben om een ​​transactie te autoriseren. Het vereiste aantal handtekeningen wordt afgesproken bij het aanmaken van het adres. Adressen met meerdere handtekeningen zijn veel beter bestand tegen diefstal.
dictionary.nativetoken.title = Native token
dictionary.nativetoken.description = - Met Cardano kunt u uw eigen aanmaken
dictionary.nativetoken.description.2 = in het Cardano-netwerk, dat het native noemt. Native omdat ze op geen enkele speciale manier verschillen van het originele ADA-token. In het geval van ETH zijn de verschillen tussen ERC-20 en
dictionary.nativetoken.description.3 = ERC-721-tokens
dictionary.nativetoken.description.4 = een ETH.
dictionary.nft.title = NFT (niet-vervangbare tokens)
dictionary.nft.description = dit zijn tokens die niet uitwisselbaar zijn. Ze zijn onmiskenbaar omdat ze verschillend zijn. Ze verschillen in de meta-eigenschappen van het token. ERC-20-tokens op het Ethereum-netwerk zijn bijvoorbeeld tokens met dezelfde meta-eigenschappen en daarom is 1 ETH uitwisselbaar met een andere 1 ETH. Bij NFT-tokens kun je 1 token niet inwisselen voor een andere, omdat ze niet identiek zijn en dus niet dezelfde prijs / waarde hebben. NFT's zijn gemaakt om zowel fysieke als virtuele activa te vertegenwoordigen (wapens, kleding en andere items in games, muziek, ...).
dictionary.node.title = Knooppunt
dictionary.node.description = - Een kopie van het grootboek (transactie blockchain) beheerd door de netwerkdeelnemer.
dictionary.margin.title = Margehandel
dictionary.margin.description = - Handel in geld dat door de beurs zelf aan u is geleend. Om de lening te ontvangen, moet het kapitaal als aanbetaling worden geïnjecteerd.
dictionary.p2p.title = P2P (peer-to-peer)
dictionary.p2p.description = - Een netwerk waar elk knooppunt zowel de rol van server als client kan vervullen. Er is geen centraal punt in de vorm van een of meer servers, zoals bij de client-server architectuur het geval is.
dictionary.paperwallet.title = Papieren portemonnee
dictionary.paperwallet.description = - Gedrukt papier met portefeuille-informatie. Vaak is deze informatie een privé-adres en een adres
dictionary.parachain.title = Parachain
dictionary.parachain.description = is een applicatiespecifieke datastructuur die globaal coherent is en gevalideerd kan worden door validators
dictionary.parachain.description.2 = Het zal gewoonlijk de vorm aannemen van een blockchain, maar het hoeven geen echte blockchains te zijn. Met Parachines kunt u verbinding maken met
dictionary.parachain.description.3 = reeds bestaande cryptomen blockchains in het ecosysteem. Deze kunnen parallel werken (verificatie ...) aan de Relay-keten, wat een uitstekende schaalbaarheid van dit ecosysteem mogelijk maakt.
dictionary.wallet.title = Portemonnee
dictionary.wallet.description = - digitale portemonnee voor 1 of meer digitale namen. Het is een plaats waar de munten zelf niet worden opgeslagen, maar de private en publieke sleutels die nodig zijn om munten te verzenden en te ontvangen.
dictionary.pow.title = Bewijs van werk (PoW)
dictionary.pow.description = - Is het systeem waarop de blockchain wordt beheerd. Verificatie en toevoeging van de transactie aan de blockchain vindt plaats door middel van zogenaamde extractie, waarvoor veel rekenkracht nodig is (waarvan
dictionary.pos.title = Bewijs van inzet (PoS)
dictionary.pos.description = - Is het systeem waarop de blockchain wordt beheerd. Transacties voor transactieverificatie worden door elk knooppunt verdiend op basis van hoeveel van de cryptocurrency het bezit. Hoe meer het bezit, hoe meer het knooppunt (portemonnee) in staat is om transacties in de loop van de tijd te verifiëren en dus meer beloningen krijgt in de vorm van cryptocurrencies of andere cryptocurrencies die ervoor zijn ontworpen.
dictionary.publickey.title = Openbare sleutel
dictionary.publickey.description = - Het publiek-private sleutelpaar wordt veel gebruikt in cryptografie om gecodeerde communicatie tussen twee belanghebbenden te bereiken. De afzender moet de openbare sleutel van de ontvanger van het bericht kennen. Merk op dat de openbare sleutel meestal niet gelijk is aan het adres van uw crypto
dictionary.publickey.description.2 =, maar wordt er vaak op basis van berekend.
dictionary.privatekey.title = Privésleutel
dictionary.privatekey.description = - het publieke en private sleutelpaar wordt veel gebruikt in cryptografie om gecodeerde communicatie tussen twee belanghebbenden te bereiken. De afzender ondertekent de berichten met zijn unieke privésleutel. In de crypto zijn het privé-adres de gegevens waarmee u de portemonnee opnieuw kunt maken, waarmee u transacties ondertekent. Wees niet verkeerd met zaad.
dictionary.pumpdump.title = Pomp en dump
dictionary.pumpdump.description = - georganiseerde prijsmanipulatie, waarbij de waarde van de cryptocurrency wordt verhoogd door bulkaankopen in een relatief korte tijdspanne. Na het bereiken van de maximale prijs is er een massale verkoop en is er een plotselinge prijsdaling.
dictionary.relaychain.title = Relay-keten
dictionary.relaychain.description = is de centrale keten van het ecosysteem
dictionary.relaychain.description.2 = Alle validators
dictionary.relaychain.description.3 = zijn gekoppeld aan een Relay Chain en valideren voor een Relay Chain.
dictionary.resistance.title = Weerstand
dictionary.resistance.description =- Het weerstandsniveau is hoger dan de huidige prijs van het actief en fungeert als een plafond voor stijgende prijzen. De tegenovergestelde logica van de ondersteuningsniveaus - de weerstandsniveaus betekenen dat de prijs waarschijnlijk van dit niveau afketst in plaats van het te breken.
dictionary.support.title = Ondersteuning
dictionary.support.description = - Het ondersteuningsniveau ligt onder de huidige activaprijs en definieert gebieden waar dalende prijzen herhaaldelijk ondersteund zullen worden voordat ze verder dalen. Dit betekent dat de prijs eerder van dit niveau zal "stuiteren" dan te breken.
dictionary.ta.title = TA (technische / trendanalyse)
dictionary.ta.description = - het proces van het onderzoeken van de prijsontwikkeling op basis van economische gegevens om de toekomstige ontwikkeling ervan te bepalen.
dictionary.token.title = Token
dictionary.token.description = - eenheid / munt van de cryptocurrency. Een token wordt meestal een munt genoemd die op een bestaand platform is gemaakt (meestal bedoeld voor een dienst met dezelfde naam). Bijvoorbeeld
dictionary.tx.title = Transactiekosten
dictionary.tx.description = - Alle cryptocurrency-transacties brengen kleine transactiekosten met zich mee. Deze transactiekosten worden verhoogd met de blokbeloning die de miner ontvangt wanneer hij het blok met succes verwerkt.
dictionary.mining.title = Mijnbouw
dictionary.mining.description = - Dit is een handeling van het valideren van blockchain-transacties. Mijnwerkers dragen rekenkracht bij aan het blockchain-netwerk om het volgende blok te helpen identificeren. Mijnwerkers worden meestal beloond in de vorm van munten. Met andere woorden, het netwerk moet de transacties verifiëren die plaatsvinden in het netwerk, en voor de verificatie die de rekenkracht van de mijnwerker kost en het geld dat nodig is om computers te kopen en elektriciteit wordt ontvangen als een stimulans tegen de waarde van de eenheid van de munteenheid.
dictionary.satoshi.title = Satoshi
dictionary.satoshi.description = - De kleinste eenheid van Bitcoin. Er geldt dat 1 BTC = 100 000 000 Satoshi.
dictionary.nakamoto.title = Satoshi Nakamoto
dictionary.nakamoto.description = Onbekende Bitcoin-maker. Het kan een persoon zijn of een groep. Het is nog steeds niet publiekelijk bekend wie onder dit pseudoniem verschijnt.
dictionary.softfork.title = Zachte vork
dictionary.softfork.description = - software-update die leidt tot een wijziging die compatibel is met de huidige softwareversie (ouder), wat betekent dat zelfs een verouderd knooppunt volledig kan functioneren met bijgewerkte knooppunten.
dictionary.smartcontract.title = Slim contract
dictionary.smartcontract.description = - bedrijfsregels geschreven in de programmeertaal, te vinden in
dictionary.smartcontract.description.2 = als software die wordt aangeroepen door netwerkdeelnemers. Er is geen noodzaak voor een derde partij tussen de afzender en de ontvanger.
dictionary.staking.title = Uitzetten
dictionary.staking.description = - In het Proof of Stake-systeem betekent dit meestal dat u uw munten in uw portemonnee laat, zodat u er in de nabije toekomst voor beloond zult worden, in dezelfde valuta of in een andere aangewezen valuta. Beloningen passen zich in de loop van de tijd aan. Voor sommigen moet de portemonnee online zijn, voor anderen misschien niet.
dictionary.stop.title = Stop met verlies
dictionary.stop.description = - een functie op beurzen waarmee u de waarde kunt instellen waarop de cryptocurrency moet worden verkocht.
dictionary.seed.title = Zaad
dictionary.seed.description = - een groep gesorteerde woorden, waarvan de volgorde afhangt en ik de portefeuille opnieuw kan aanmaken /
dictionary.seed.description.2 =, aangezien het proces voor het aanmaken van een portefeuille deterministisch is. Het heeft een ander aantal woorden 12, 13, 15 ...
dictionary.volatile.title = Vluchtigheid
dictionary.volatile.description = - Een term die aangeeft hoe vaak de prijs van een digitale valuta verandert. Het tegenovergestelde van dit concept is het concept van stabiliteit.
dictionary.vel.title = Walvis
dictionary.vel.description = - aanduiding voor de eigenaar van een grote hoeveelheid van alle munten van een bepaalde cryptocurrency, die een manipulator van de prijs kan worden.
dictionary.supercycle.title=Supercyklus
dictionary.supercycle.description=Een aanhoudende periode van abnormaal sterke groei van de vraag die producenten moeilijk kunnen evenaren, wat leidt tot een prijsstijging die jaren of in sommige gevallen een decennium of langer kan duren.
