cooperation.service.1.title=Výmena spätných odkazov (Backlink building)
cooperation.service.1.description=Radi podporíme projekty / stránky podobného charakteru výmenou spätných odkazov. Takýto odkaz umiestnime do pätičky stránok kryptotipy.sk. Výmena bude zavŕšená pridaním odkazu kryptotipy.sk do pätičky vašich stránok.
cooperation.service.2.title=Zobrazenie odkazov na vaše články na našich stránkach
cooperation.service.2.description=Ak máte záujem byť medzi ďalšími portálmi, ktorých odkazy na články zobrazujeme, napíšte nám na info@kryptotipy.sk. Určite sa dohodneme na obojstranne výhodnej spolupráci.
cooperation.service.3.title=Článok o kryptotipy.sk
cooperation.service.3.description=Ak máte záujem o nás napísať článok alebo blog post alebo akýkoľvek text a chýbajú vám informácie, radi Vám ich poskytneme. Stačí nám napísať na info@kryptotipy.sk o vašom zámere a položiť otázky, na ktoré by ste radi dostali odpoveď.
cooperation.service.4.title=Iný druh spolupráce
cooperation.service.4.description=Samozrejme existuje jeden veľký kopec možností spolupráce a my o tom vieme. Ak vám napadla spolupráca, ktorá nebola spomenutá v predošlých 3 možnostiach, neváhajte nás takisto kontaktovať na info@kryptotipy.sk. Tešíme sa na vás a spoluprácu s vami.

cooperation.paid.descr=Kryptotipy.sk ponúkajú možnosť zverejniť na našom webe tlačovú správu akéhokoľvek druhu sponzorovaného obsahu súvisiaceho so sektorom kryptomien a využiť výhody našej cieľovej čitateľskej základne.
cooperation.paid.descr2=Odoslanie tlačovej správy prostredníctvom stránky kryptotipy.sk dáva našim vydavateľom hodnotu vďaka nízkym cenám v kombinácii s veľkým dosahom, ktorý môžu dosiahnuť. Publikovanie vášho krypto PR alebo sponzorovaného článku na našich webových stránkach je jednou z najchytrejších marketingových aktivít, ktoré môžete v súčasnosti urobiť pre svoju značku, službu alebo produkt.
cooperation.unpaid.title=Ďalšie možnosti spolupráce
cooperation.unpaid.descr=Pre tých z vás, ktorí chcú svoj začínajúci alebo už fungujúci web propagovať formou vytvárania širšej komunity a vzájomnej podpory, sme otvorení aj iným druhom spoluprác. V prípade, že si viete predstaviť iní možnosti, neváhajte nás kontaktovať.
