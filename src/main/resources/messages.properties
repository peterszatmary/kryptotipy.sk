external.services.h1=Externé krypto služby
external.services.h1.description=Výber zaujímavých stránok, portálov, búrz, aplikácií, služieb týkajúcich sa kryptomien.
external.services.service.1.title=Blockchair
external.services.service.1.description=Služba, ktorá dokáže prehľadávať transakcie a ďalšie údaje v 17 rôznych blockchainoch ako BTC, Monero, ETH, LTC ...
external.services.service.2.title=Trezor One (Black)
external.services.service.2.description=Cold peňaženka s maximálnou bezpečnosťou pre vaše kryptomeny. Podporuje množstvo kryptomien.
external.services.service.3.title=Coinbase
external.services.service.3.description=Služba na nákup a predaj vybraných kryptomien vybudovaná na beckende GDAxu. Jej výhodou je jednoduchosť.
external.services.service.4.title=Exodus
external.services.service.4.description=Peňaženka podporujúca množstvo kryptomien plus obsahuje zabudovanú zmenáreň poháňanú ďalšou službou Shapeshift.
external.services.service.5.title=Coinbase.Pro
external.services.service.5.description=Burza kryptomien patriaca Coinbase. S originálnym názvom GDAX teraz známa ako Coinbase.Pro.
external.services.service.6.title=Poloniex
external.services.service.6.description=Americká krypto burza, ktorá vznikla roku 2014 v amerike. Je takisto zaujímavou možnosťou ako začať obchodovať s kryptomenami.
external.services.service.7.title=Jaxx
external.services.service.7.description=Peňaženka podporujúca množstvo coinov. Je Lightweight a hot. Nepotrebuje sťahovať celý blockchain, čiže šetrí miesto na hard diskoch.
external.services.service.8.title=Trezor T
external.services.service.8.description=Cold peňaženka s vylepšenou bezpečnosťou pre vaše kryptomeny. Podporuje ešte väčšie množstvo kryptomien ako model One.
external.services.service.9.title=Kucoin
external.services.service.9.description=Burza kryptomien. Rýchlo a spoľahlivo pridáva nové kryptomeny s potenciálom. Možno tu nájsť kryptomeny aké na iných burzách neuvidíte.
external.services.service.10.title=KeepKey
external.services.service.10.description=Hardvér peňaženka podporujúca množstvo kryptomien od skupiny Shapeshift. Vhodná ako lacnejšia alternatíva ku Trezor produktom.
external.services.service.11.title=Kraken
external.services.service.11.description=Americká burza kryptomien s bohatou históriou. Vznikla roku 2011. Ďalšia z možností ako začať obchodovať s kryptomenami.
external.services.service.12.title=Neo to Gas
external.services.service.12.description=Prepočíta, aké množstvo GAS tokenu získate ako pasívny príjem za držanie NEO tokenov v špecializovanej NEON peňaženke.
external.services.service.13.title=ATHA
external.services.service.13.description=Posledné All time high (ATH) kryptomien s časovým údajom. ATH je maximálna hodnota, ktorú kryptomena kedy dosiahla.
external.services.service.14.title=Ledger Nano X
external.services.service.14.description=Cold peňaženka s dôrazom na bezpečnosť podporuje množstvo kryptomien. Podporuje pripojenie cez Bluetooth
external.services.service.15.title=ShapeShift
external.services.service.15.description=Je krypto-zmenáreň. Jej hlavnou výhodou je, že sa nie je potrebné registrovať. Slúži na zmenu kryptomien na kryptomeny.
external.services.service.16.title=Ethplorer
external.services.service.16.description=Po zadaní adresy vie ukázať nielen ETH zostatok na vašej peňaženke, ale aj zostatok všetkých ETH tokenov na danej adrese.
external.services.service.17.title=Binance
external.services.service.17.description=Burza kryptomien. Bola založená v Číne roku 2017. V tom istom roku sa jej viac než darilo. Dnes patrí medzi najväčšie krypto-burzy sveta.
external.services.service.18.title=Bitfinex
external.services.service.18.description=Burza kryptomien. Tvorca USDT. Založená bola v roku 2012. Vlastní a prevádzkuje spoločnosť iFinex Inc.
external.services.service.19.title=Bittrex
external.services.service.19.description=Burza kryptomien. Založená bola v amerika roku 2013. AKo prvá ponúkla náhradu za USDT tzv. TUSD (True USD).
external.services.service.20.title=Bitscreener
external.services.service.20.description=Sortovanie podľa ceny meny, marketcapu, 24 hodinového volume a typu. Chartview ponúka percentuálny súhrn zmeny.
external.services.service.21.title=Coinmarketcap
external.services.service.21.description=Stránka monitorujúca kryptomeny, ktoré sa obchodujú. Ponúka množstvo použiteľných rankingov, grafov a krypto-informácií.
external.services.service.22.title=Cryptocompare
external.services.service.22.description=Monitoring kryptomien, rôzne kalkulačky pre ťažiarov, peňaženky podľa kryptomien, pre developerov je tu REST API a ďalšie.
external.services.service.23.title=Coindar
external.services.service.23.description=Ide o akýsi krypto-kalendár. Vďaka tejto službe budete informovaný o nadchádzajúcich krypto udalostiach a nič vám už neunikne.
external.services.service.24.title=Crypto Fear & Greed Index
external.services.service.24.description=Crypto Fear & Greed Index meria aká je aktuálna nálada na kryptomenových trhoch. Kontroluje dve základné nálady a to strach a chamtivosť.
external.services.service.25.title=Coin ATM radar
external.services.service.25.description=Webová služba umožňujúca nájsť rôzne kryptomaty pre kúpu a predaj rôznych kryptomien vo vašom najbližšom okolí.
external.services.service.26.title=Airdrops.io
external.services.service.26.description=Služba monitorujúca takzvané airdropy tokenov, čo sú tokeny zadarmo za splnenie najčastejšie úloh na sociálnych sieťach a podobne.
external.services.service.27.title=Staking Rewards
external.services.service.27.description=Vďaka tejto službe si viete pohodlne vyrátať, aký veľký je váš pasívny príjem, ak vlastníte niektorý z proof of stake tokenov.
external.services.service.28.title=Krypto tank
external.services.service.28.description=Ide o čerpaciu stanicu v Českej republike, kde je možné platiť pohonné látky obľúbeným Bitcoinom.
external.services.service.29.title=Whitepapers.io
external.services.service.29.description=Whitepaper je technickou špecifikáciou danej kryptomeny. Táto služba ich všetky ponúka na jednom mieste.
external.services.service.30.title=Bitcoin Obituaries
external.services.service.30.description=Bitcoinu predpovedali smrť už dokopy 395 krát. Tohto roku to bolo už 3 krát. Koľko takýchto predpovedí Bitcoin ešte prežije ?
did.you.know=Vedeli ste, že
did.you.know.title=Krypto zaujímavosti
did.you.know.description=zo sveta kryptomien, ktoré ste možno nevedeli.
did.you.know.bitcoin.1=Bitcoin sa začal predávať v roku 2010 za 0,0008 USD. 17 decembra 2017 dosiahol svoju maximálnu hodnotu 20 089 USD.
did.you.know.bitcoin.2=Keď sa vyťaží posledný Bitcoin, ťažiari budú naďalej motivovaný pokračovať vo validácii transakcií poplatkami za vykonané transakcie. Dnes sú navyše odmeňovaný po každom vyťaženom bloku aj určitým počtom bitcoinov.
did.you.know.bitcoin.3=Bitcoin halving je udalosť, pri ktorej nastáva delenie odmien za vyťažený blok presne na polovicu. Táto udalosť tiež zvýši inflačnú rýchlosť a takisto rýchlosť akou sa do obehu dostávajú nové Bitcoiny. Deje sa tak každých 210 000 vyťažených blokov.
did.you.know.bitcoin.4=Odhaduje sa, že posledný vyťažený blok Bitcoinu uzrie svetlo kybersveta v roku 2140.
did.you.know.bitcoin.5=Odmeny za vyťažený Bitcoin blok činili v roku 2009 až 50 BTC, po prvom halvingu to bolo už len 25 BTC a po 11.5.2020 (tretí halving) to je aktuálne 6,25 BTC.
did.you.know.bitcoin.6=Bitcoin má maximálny počet mincí stanovený na 21 miliónov. Viac ich už nebude.
did.you.know.bitcoin.7.3=Tohto roku to bolo už 3 krát. Koľko takýchto predpovedí Bitcoin ešte prežije ?
did.you.know.bitcoin.7.1=Bitcoinu predpovedali smrť už 
did.you.know.bitcoin.7.2=dokopy 395 krát 
did.you.know.bitcoin.8=V obehu je menší počet mincí Bitcoinu ako mincí Litecoinu. Pre porovnanie počet mincí Bitcoinu je 18,5 milióna vs. počet mincí Litecoinu 66,2 milióna. (2021)
did.you.know.bitcoin.9.1=Najväčším ťažiarom v Bitcoin sieti je pool s názvom F2Pool, ktorý poskytuje viac než 17% celého hashrate siete.
did.you.know.bitcoin.9.2=Druhý sú v poradí BinancePool s 11,9% a prvú trojku uzatvára pool Poolin s 11,7% hashrate siete.
did.you.know.bitcoin.10=8.1.2021, prvýkrát v histórií vôbec, prekonal Bitcoin hodnotu v prepočte 1 milión slovenských korún. Druhýkrát sa tak stalo 6.2.2021. Do tretice od 8.2.2021 sa drží nad touto úrovňou dodnes.
did.you.know.bitcoin.11=Spoluzakladateľ najväčšej verejne obchodovanej spoločnosti na svete  Apple Steve Wozniak je fanúšikom Bitcoinu.Roku 2021 sa vyjadril, že Bitcoin je zázračnou technológiou s jedinečným matematickým vzorcom.
did.you.know.bitcoin.12=V roku 2010 bolo vyťažených 184 miliárd bitcoinov, po tom, čo útočník využil chybu v kóde.  Išlo o blok s číslom 74638. Satoshi Nakamoto opravil chybu 5 hodín po jej objavení.
did.you.know.bitcoin.13=Mileniáli, ľudia narodený v rokoch 1980 – 1995, zbožňujú BTC a radi do neho investujú.
did.you.know.bitcoin.14=Bitcoin spotrebúvava ďaleko menej energie než ťažba zlata alebo tradičné bankovníctvo. (2021, Galaxy Digital)
did.you.know.bitcoin.15=2. najväčšia poisťovňa v európe AXA, začne prijímať Bitcoin. (2021)
did.you.know.bitcoin.16=Najdrahšie NFT sa predalo za 69 miliónov dolárov. (2021)
did.you.know.bitcoin.17=Podľa odhadov je až 20% všetkých Bitcoinov nenávratne stratených. Ide o približne 3 - 4 miliónov BTC. (2021)
did.you.know.bitcoin.18=90% všetkých Bitcoinov už bolo vyťažených. (2021)
did.you.know.bitcoin.19=V meste New-york si môžete kúpiť nehnuteľnosť aj za kryptomeny. Konkrétne za Bitcoin, Ethereum, DogeCoin. Platby v kryptomenách sa rozhodla prijímať realitná kancelária Algocap Real Estate.
did.you.know.bitcoin.20=Ray Dalio, zakladateľ najväčšieho hedžového fondu na svete, tiež vlastní Bitcoin. (2021)
did.you.know.bitcoin.21.1=Elektromobil spoločnosti Daymak Avvenire s názvom
did.you.know.bitcoin.21.2=dokáže počas nabíjania ťažiť kryptomeny Bitcoin a Dogecoin.


did.you.know.monero.1=Maximálny počet mincí Monera nie je obmedzený. Je však regulovaná ich emitácia. Odmena v podobe mincí sa bude znižovať až do konca mája 2022, keď ich bude v obehu 18 132 000. Potom sa odmena zastaví na 0.6 XMR.

did.you.know.neo.1=Ak si vložíte NEO tokeny do peňaženky NEON, získate možnosť zarábať automaticky ďalšiu kryptomenu a tou je GAS. Inými slovami získate pasívny príjem.
did.you.know.neo.2=Neo je proof of stake platforma často vnímaná ako čínske Ehereum. Takisto ako Ethereum aj NEO ponúka možnosť vytvárať takzvané Smart kontrakty.

did.you.know.ethereum.1=Ethereum 2.0 bolo spustené 1.12.2020. Medzi hlavné zmeny patria Proof of stake miesto predošlého Proof of work. Do 2 rokov aj zväčšenie počtu transakcií z 15 na 100 000 za sekundu.
did.you.know.ethereum.2=Po London hard forku sa každú minútu spália ETH v hodnote 10 000 dolárov. (2021)

did.you.know.iota.1=je jedinou kryptomenou, ktorej transakčné poplatky sa rovnajú 0.Inými slovami sú bez poplatku.
did.you.know.iota.2=Ako už z názvu vyplýva IOTA je pripravená na takzvané IOT Internet of things, kde bude všetko pripojené a dostupné cez internet. Tak aj napríklad vaša chladnička bude môct platiť a nakupovať bez vášho vedomia a nielen to. IOTA ako jediná umožňuje mikrotransakcie, ktoré sa v budúcnosti stanú samozrejmosťou. Kto prvý implementuje mikrotransakcie a ako nie je dôležité. Už dnes však máme platformu, ktorá myšlienku mikrotransakcie dokáže vďaka nulovým poplatkom prisviesť k životu. Na vykonanie transakcie stačí ak ju overia dva ďalšie uzly siete.
did.you.know.iota.3=IOTA predstavuje smart kontrakty na svojej platforme, ktoré by mohli byť realitou už koncom roku 2021.

did.you.know.litecoin.1=Litecoin vznikol zo zdrojového kódu Bitcoinu už v roku 2011.
did.you.know.litecoin.2=Litecoin má maximálny počet mincí stanovený na 84 miliónov. Viac ich už nebude.
did.you.know.litecoin.3=V obehu je menší počet mincí Bitcoinu ako mincí Litecoinu. Pre porovnanie počet mincí Bitcoinu je 18,5 milióna vs. počet mincí Litecoinu 66,2 milióna. (2021)

did.you.know.tether.1=Tether je stablecoin, ktorá vznikla v spolupráci s Tether Limited a burzou 
did.you.know.tether.2=1 Tether kryje presne 1 dolár.
did.you.know.tether.3=Tether vznikol, aby obchodníci nemuseli zbytočne meniť svoje kryptomeny za FIAT počas svojich obchodov.

did.you.know.btccash.1=Bitcoin Cash vznikol ako hard fork Bitcoinu.
did.you.know.btccash.2=Hlavným dôvodom vzniku Bitcoin Cash-u bolo zväčšenie transakčného bloku z 1 MB na 8 MB. Vo výsledku dokáže takto Bitcoin Cash spracovať viac transakcií za sekundu ako Bitcoin.

did.you.know.btcsv.1=Skratka SV znamená Satoshi Vision, čo v preklade je Satoshiho vízia.
did.you.know.btcsv.2=Bitcoin SV vznikol ako hard fork kryptomeny Bitcoin Cash.
did.you.know.btcsv.3=Za vznikom kryptomeny Bitcoin SV je opäť zväčšenie transakčného bloku z 8 MB na 128 MB, čo znamená ešte väčší počet zvalidovaných transakcií za sekundu.


