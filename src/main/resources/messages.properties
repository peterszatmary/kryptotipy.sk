dictionary.d=Krypto slovník pomáha zorientovať sa v novom krypto svete a jeho krypto pojmoch. Vysvetľuje najbežnejšie / najdôležitejšie krypto pojmy tvoriace doménu kryptomien.
dictionary.title=Krypto slovník
dictionary.description=Krypto slovník vysvetľujúci najbežnejšie / najdôležitejšie pojmy tvoriace doménu kryptomien
dictionary.address.title=Adresa
dictionary.address.description=sa používajú na posielanie a prijímanie transakcií v sieti. Sú to hexadecimálne reťazce, ktoré reprezentujú unikátny identifikátor vašej
dictionary.arbitraz.title=Arbitráž
dictionary.arbitraz.description=– využitie nerovnakých cien daného objektu na rôznych miestach / trhoch na zisk rovnajúci sa rozdielu týchto cien (za absencie akýchkoľvek súvisiacich rizík)
dictionary.wallets.href=peňaženky
dictionary.blockchain.href=blockchaine
dictionary.in=v
dictionary.airdrop.title=Airdrop
dictionary.airdrop.description=v kryptomenách je to proces distribúcie novým alebo existujúcim vlastníkom danej meny alebo
dictionary.airdrop.description.1=, kde je niekedy potrebné buď vlastniť menu alebo splniť iné požiadavky.
dictionary.altcoin.title=Altcoin (Alt)
dictionary.altcoin.description=– všetky
dictionary.altcoin.description.2=(digitálne meny), ktoré vznikli po Bitcoine sa nazývajú altcoinami.
dictionary.atl.title=ATL (All time Low)
dictionary.atl.description=– je opakom ATH, inými slovami najnižšia hodnota, ktorú kryptomena za celé obdobie dosiahla.
dictionary.ath.title=ATH (All time high)
dictionary.ath.description=– najvyššia cena danej kryptomeny v jej celej histórii.
dictionary.asic.title=ASIC (Application Specific Integrated Circuit)
dictionary.asic.description=- sú mikročipy vyrobené iba na jedinú úlohu a to ťaženie konkrétnej
dictionary.asic.description.2=(takej, ktorá povoľuje využitie hrubej sily = čím vyšší výkon, tým väčší profit z ťaženia).
dictionary.bearish.title=Bearish market (medvedí trh)
dictionary.bearish.description=– stav, kedy trh má klesajúci trend.
dictionary.bip.title=BIP (Bitcoin Improvement Proposals)
dictionary.bip.description=v preklade návrhy na zlepšenie
dictionary.bip.description.2=Bitcoinu
dictionary.bip.description.3=, ktoré môžu byť predložené hocikým, kto má záujem zlepšiť sieť Bitcoin.
dictionary.btc.title=Bitcoin (BTC)
dictionary.btc.description=– prvá digitálna mena, ktorá bola spustená v roku 2009 osobou alebo skupinou pod pseudonymom Satoshi Nakamoto.
dictionary.blockchain.title=Blockchain
dictionary.blockchain.description=– distribuovaná (decentralizovaná) databáza alebo sieť, ktorá uchováva všetky verejné účtovné knihy kryptomien.
dictionary.blocks.title=Bloky
dictionary.blocks.description=- sú balíky údajov, ktoré prenášajú natrvalo zaznamenané dáta v
dictionary.bullish.title=Bullish market (Býčí trh)
dictionary.bullish.description=– stav, kedy trh má stúpajúci trend.
dictionary.coldwallet.title=Cold wallet (studená peňaženka)
dictionary.coldwallet.description=– Digitálne meny uložené mimo dostupnosti internetu. Príklad sú papierová peňaženka, hardvérová peňaženka. Dôvodom existencie takýchto typov peňaženiek je vyššia bezpečnosť. Opakom je takzvaná hot wallet.
dictionary.coin.title=Coin
dictionary.coin.description=– jedna jednotka digitálnej kryptomeny. Často sa používa ako synonymum a kratší výraz pre pomenovanie kryptomena.
dictionary.crypto.title=Crypto-currency (kryptomena)
dictionary.crypto.description=– digitálne platidlo založené na kryptografii.
dictionary.dyor.title=DYOR (Do Your Own Research)
dictionary.dyor.description=– znamená urobiť si vlastný prieskum alebo prehľad o danej tématike alebo mene.
dictionary.dao.title=DAO - (Decentralised Autonomous Organizations)
dictionary.dao.description=v preklade znamená Decentralizované autonómne organizácie - si môžte predstaviť ako korporáty, ktoré dokážu fungovať bez akéhokoľvek zásahu človeka (autonomita) a presunuli všetky formy kontroly do nezkorumpovateľných biznis pravidiel.
dictionary.daico.title=DAICO - Decentralizované ICO
dictionary.daico.description=- Fungovanie ICO bude zabezpečovať iba smart kontrakt, ktorý bude fungovať v danom
dictionary.daico.description.2=. (Najskôr
dictionary.daico.description.3=, keďže tvorcom myšlienky je Vitalik Buterin)
dictionary.dapp.title=DAPP - (A Decentralised application)
dictionary.dip.title=Dip
dictionary.dip.description=- najnižší bod na grafe alebo lokálne minimum hodnoty
dictionary.dip.description.2=Aj čas na výhodný nákup.
dictionary.dump.title=Dump
dictionary.dump.description=- výrazný prepad hodnoty kryptomeny alebo akcie alebo komodity.
dictionary.erc20.title=ERC-20
dictionary.erc20.description=- Interface na základe, ktorého vznikajú nové
dictionary.erc20.description.2=založené na
dictionary.erc20.description.3=. Inými slovami smart kontrakt, ktorý implementuje daný ERC-20 predpis.
dictionary.erc20.description.4=Viac o tom, čo popisuje ERC-20 nájdete tu.
dictionary.erc223.title=ERC-223
dictionary.erc223.description=- nástupca ERC20 štandardu. Mal by priniesť okrem iného lacnejšie transakcie a napríklad možnosť vybrať dávno stratené tokeny ku ktorým nemá nikto prístup. Viac info
dictionary.erc721.title=ERC-721
dictionary.erc721.description=je  štandard tokenov v sieti Ethereum, ktorý umožňuje produkovať iba NFT tokeny a núti vývojárov pre každý nový token vytvoriť a nasadiť  aj nový smart kontrakt. Pre porovnanie, štandard tokenov ERC-1155 umožňuje tvorbu NFT tokenov aj fungible tokenov. Pritom nie je potrebné pre každý token vytvárať a nasadiť nový smart contract. Stačí iba jeden.
dictionary.erc1155.title=ERC-1155
dictionary.erc1155.description=ERC-1155 je token štandard, ktorý umožňuje vytvárať takzvané Non-fungible tokens (NFT) ale aj fungible tokeny na Ethereum sieti. Štandard tokenov ERC-1155 bol vytvorený tak, aby fungoval ako automat, kde môžu vývojári nasadiť jediný smart kontract, pomocou ktorého je možné vytvárať neobmedzené zastupiteľné (identické) tokeny, ale aj (jedinečné) NFT tokeny. Pre porovnanie, štandard tokenov ERC-721 produkuje iba NFT tokeny a núti vývojárov pre každý nový token nasadiť  a vytvoriť aj nový smart kontrakt.
dictionary.ep5.title=EP-5
dictionary.ep5.description=- Podobne ako ERC20 alebo ERC223 ide o token štandard avšak pre
dictionary.exchange.title=Exchange
dictionary.exchange.description=– webstránka s digitálnou burzou, kde sa nakupujú a predávajú
dictionary.fomo.title=FOMO (The Fear Of Missing Out)
dictionary.fomo.description=– emócia strachu z premeškanej príležitosti. Je často príčinou nákupu meny na jej vrchole alebo predaja v strate.
dictionary.fork.title=FORK
dictionary.fork.description=– softvérová aktualizácia, ktorá vedie ku zmene, ktorá môže byť kompatibilná alebo aj nekompatibilná s aktuálnou verziou softvéru. Pozri hard fork, soft fork.
dictionary.fud.title=FUD (Fear, Uncertainty, and Doubt)
dictionary.fud.description=– zmes emócii ako strach, neistota a pochybnosti, ktorých príčinou sú negatívne správy zo sveta kryptomien. Dôsledkom takto vyvolanej paniky môže aj často nastáva pád ceny.
dictionary.fudster.title=FUDster
dictionary.fudster.description=– je niekto, kto šíri FUD médiami.
dictionary.fiat.title=FIAT
dictionary.fiat.description=– vládami vydané oficiálne meny (EUR, USD atď.)
dictionary.fundament.title=Fundamentálna analýza
dictionary.fundament.description=– analýza založená na verejne dostupných informáciách s cieľom určiť budúcu cenu
dictionary.fundament.description.2=/ akcie ...
dictionary.genesis.title=Genesis blok
dictionary.genesis.description=- Úplne prvý blok v
dictionary.genesis.description.2=blockchaine
dictionary.halving.title=Halving
dictionary.halving.description=- je udalosť, pri ktorej nastáva delenie odmien za vyťažený
dictionary.halving.description.2=blok presne na polovicu. Táto udalosť tiež zvýši inflačnú rýchlosť o polovicu a takisto rýchlosť akou sa do obehu dostávajú nové Bitcoiny. Deje sa tak raz každých 210 000 vyťažených blokov.
dictionary.hardfork.title=Hard Fork
dictionary.hardfork.description=- softvérová aktualizácia, ktorá vedie ku zmene, ktorá je nekompatibilná s aktuálnou verziou softvéru (staršou), čo znamená, že takto neaktualizovaný uzol nie je schopný plnohodnotne fungovať s aktualizovanými uzlami (nemusí vedieť overovať transakcie, prijímať alebo posielať transakcie atď). Po hard forku je vždy priestor pre vznik novej meny. Tá vzniká ak časť siete odmieta aktualizáciu a ostáva na starej verzii. Od tejto verzie si žijú obe siete svojím vlastným životom. Ak sieť prijme nekompatibilnú aktualizáciu hovoríme o hard forku bez vzniku novej kryptomeny.
dictionary.hardwallet.title=Hardvérová peňaženka (Hardware Wallet)
dictionary.hardwallet.description=– kryptograficky bezpečný hardvér určený na zaistenie bezpečnosti informácií v peňaženke. Príkladmi sú peňaženka
dictionary.hashrate.title=Hashrate
dictionary.hashrate.description=- Číslo, ktoré udáva akou rýchlosť ťaženia, konkrétnejšie počet hashov, ktoré dokáže stroj vyriešiť za sekundu.
dictionary.hodl.title=HODL
dictionary.hodl.description=– výraz, ktorý vznikol z pôvodného HOLD (držanie), znamená držať a nepredávať mince.
dictionary.hotwallet.title=Hot wallet (Horúca peňaženka)
dictionary.hotwallet.description=- peňaženka pripojená k internetu, pre dennodenné transakcie. Práve kvôli internetu je ale menej bezpečná.
dictionary.hype.title=Hype
dictionary.hype.description=– hromadné nadšenie nielen okolo nejakej kryptomeny za účelom jej zviditeľnenia na trhu. Pojem je všeobecný nie viazaný na krypto.
dictionary.ico.title=ICO (Initial Coin Offering)
dictionary.ico.description=– prvotná verejná ponuka digitálnej meny ešte pred vstupom na burzu. Je to obdoba crowdfunding v digitálnom svete.
dictionary.kaico.title=KAICO
dictionary.kaico.description=- CryptoKami prišli s vlastnou ideou ako robiť ICO. Je to akýsi konkurent pre DAICO. Aj keď sú podobné, ponúkajú aj odlišné vlastnosti.
dictionary.kaico.description.2=Viac si o tom môžte prečítať tu.
dictionary.cap.title=Kapitalizácia
dictionary.cap.description=- všetky mince danej kryptomeny, ktoré sú v obehu vynásobené aktuálnou hodnotou mince.
dictionary.cap.description.2=Viac si o tom môžte prečítať tu.
dictionary.confirmation.title=Konfirmácia / Potvrdenie (Confirmation)
dictionary.confirmation.description=– Transakcia je potvrdená ak bola potvrdená určitým počtom uzlov (ťažiarov) v sieti. Ide o úspešné zahešhovanie transakcie a jej pridanie do blokchainu.
dictionary.correction.title=Korekcia
dictionary.correction.description=- je opačný pohyb, zvyčajne negatívny, zvyčajne 10 percentný pokles akcií alebo cenných papierov ...  kde sa vyrovnáva nadhodnotenie ceny smerom späť. Korekcie sú dočasné a prerušujú zvyčajne stúpajúci trend (uptrend).
dictionary.consensus.title=Konsenzus
dictionary.consensus.description=- je dosiahnutý, keď všetky zúčastnené uzly súhlasia so zaradením transakcie do blockchainu.
dictionary.kyc.title=KYC (Know your customer)
dictionary.kyc.description=- poznaj svojho zákazníka. Proces kde zákazník (kupujúci) overuje svoju totožnosť vyplnením osobných údajom a často taktieť nahratím identifikačných preukazov na server.
dictionary.marketcap.title=Market cap
dictionary.marketcap.description=– celková hodnota všetkých mincí v obehu danej kryptomeny.
dictionary.mooning.title=Mooning
dictionary.mooning.description=– stav, kedy cena rastie hore. Nemusí ísť nevyhnutne o extrémny nárast.
dictionary.multisignature.title=Multi-signature
dictionary.multisignature.description=- (multisig) viacnásobne podpísateľné adresy umožňujú viacerým stranám vyžadovať viac ako jeden kľúč na autorizáciu transakcie. Potrebný počet podpisov je dohodnutý pri vytvorení adresy. Adresy viacerých podpisov majú oveľa väčšiu odolnosť proti krádežiam.
dictionary.nativetoken.title=Natívny token
dictionary.nativetoken.description=- Cardano umožňuje vytvárať si vlastné 
dictionary.nativetoken.description.2=v Cardano sieti, ktoré nazýva natívne. Natívne preto, lebo sa nijak špeciálne neodlišujú od pôvodného ADA tokenu. V prípade ETH sú rozdiely medzi ERC-20 a
dictionary.nativetoken.description.3=ERC-721 tokenmi
dictionary.nativetoken.description.4=a ETH.
dictionary.nft.title=NFT (Non-fungible tokens)
dictionary.nft.description=ide o tokeny, ktoré sú nezameniteľné. Nezameniteľné sú pretože sú odlišné. Odlišujú sa v meta vlastnostiach tokenu. Napríklad ERC-20 tokeny na Ethereum sieti sú tokeny s rovnakými meta vlastnosťami a preto 1 ETH je zameniteľné za iné 1 ETH. Pri NFT tokenoch neviete zameniť  1 token za 1 iný, pretože nie sú totožné a ani nemajú teda tú istú cenu / hodnotu. NFT vznikajú, aby reprezentovali fyzický, ale aj virtuálny majetok (zbrane, oblečenie a iné predmety v hrách, hudba, ...).
dictionary.node.title=Node
dictionary.node.description=- Kópia účtovnej knihy (blockchainu s transakciami), ktorú prevádzkuje účastník siete.
dictionary.margin.title=Obchodovanie s maržami (Margin Trading)
dictionary.margin.description=– Obchodovanie s peniazmi, ktoré vám boli vypožičané burzou samotnou. K prijatiu uvedeného úveru musí byť vložený kapitál ako vklad.
dictionary.p2p.title=P2P (Peer to Peer)
dictionary.p2p.description=- Sieť, kde každý uzol môže vykonávať úlohu servera ,ale aj klienta. Neexistuje centrálny bod v podobe jedného alebo viacerých serverov, ako je tomu v prípade architektúry klient-server.
dictionary.paperwallet.title=Papierová peňaženka (Paper Wallet)
dictionary.paperwallet.description=– Vytlačený papier s informáciou smerujúcou k peňaženke. Často je týmto údajom privátna adresa a adresa
dictionary.parachain.title=Parachain
dictionary.parachain.description=je dátová štruktúra špecifická pre aplikáciu, ktorá je globálne koherentná a validovateľná validátormi
dictionary.parachain.description.2=Zvyčajne bude mať formu blockchainu, ale nie je potrebné, aby išlo o skutočné blockchainy. Parachainy umožnia pripojiť do
dictionary.parachain.description.3=ekosystému už existujúce kryptomenové blockchainy. Tieto dokážu fungovať paralelne (overovanie ...) ku Relay chainu, čo umožní vynikajúce škálovanie tohto ekosystému.
dictionary.wallet.title=Peňaženka (Wallet)
dictionary.wallet.description=– digitálna peňaženka pre 1 alebo viac digitálych mien. Je to miesto, kde nie sú uložené samotné mince, ale privátne a verejné kľúče, ktoré sú potrebné na zasielanie a prijímanie mincí.
dictionary.pow.title=Proof of Work (PoW)
dictionary.pow.description=- Je systém na základe, ktorého sa blockchain manažuje. Overovanie a pridávanie transakcie do blockchainu prebieha takzvaným ťažením, na ktoré treba značný výpočetný výkon (z toho
dictionary.pos.title=Proof of Stake (PoS)
dictionary.pos.description=- Je systém na základe, ktorého sa blockchain manažuje. Odmeny za overovanie transakcií získava každý uzol podľa toho ako veľa z danej kryptomeny vlastní. Čím viac jej vlastní, tým viac je uzol (peňaženka) schopný overiť transakcií v čase,  a tým získať viac odmeny v podobe kryptomeny alebo inej kryptomeny na to určenej.
dictionary.publickey.title=Public Key (verejný kľúč)
dictionary.publickey.description=– dvojica verejný a privátny kľúč sa v kryptografii hojne používa k dosiahnutiu zašifrovanej komunikácii medzi dvoma zainteresovanými. Odosielateľ musí poznať verejný kľúč prijímateľa správy. Pozor verejný kľúč sa väčšinou nerovná adrese vašej krypto
dictionary.publickey.description.2=, ale je často z neho vyrátaný.
dictionary.privatekey.title=Private Key (privátny kľúč)
dictionary.privatekey.description=– dvojica verejný a privátny kľúč sa v kryptografii hojne používa k dosiahnutiu zašifrovanej komunikácii medzi dvoma zainteresovanými. Odosielateľ podpisuje správy svojim jedinečným privátnym kľúčom. V krypto je privátna adresa ten údaj vďaka, ktorému viete peňaženku znovu-vytvoriť, podpisujete nimi transakcie. Nemýliť si so seedom.
dictionary.pumpdump.title=Pump & Dump
dictionary.pumpdump.description=– organizované manipulovanie ceny, pri ktorom sa navyšuje hodnota kryptomeny hromadnými nákupmi v relatívne krátkom časovom úseku. Po dosiahnutí maximálnej ceny, nastáva hromadný predaj a dochádza k náhlemu poklesu ceny.
dictionary.relaychain.title=Relay chain
dictionary.relaychain.description=je centrálnym chainom ekosystému 
dictionary.relaychain.description.2=Všetci validátori
dictionary.relaychain.description.3=sú pripojený ku Relay Chain a validujú pre Relay Chain.
dictionary.resistance.title=Rezistencia (Odpor)
dictionary.resistance.description=- Úroveň rezistencie sa nachádza nad aktuálnou cenou aktíva a pôsobí ako strop pre ceny, ktoré majú rastúcu tendenciu. Opačná logika oproti úrovniam supportu - úrovne rezistencie znamenajú, že sa cena pravdepodobne odrazí od tejto úrovne, než že by ju prelomila.
dictionary.support.title=Support (Podpora)
dictionary.support.description=– Hladina supportu sa nachádza pod aktuálnou cenou aktíva a definuje oblasti, kde klesajúce ceny nájdu opakovanú podporu pred ďalším poklesom. To znamená, že sa cena pravdepodobne "odrazí" od tejto úrovne, než aby ju prelomila.
dictionary.ta.title=TA (technická / trendová analýza)
dictionary.ta.description=– proces skúmania vývoja ceny podľa ekonomických údajov s cieľom určiť jej budúci vývoj.
dictionary.token.title=Token
dictionary.token.description=– jednotka / minca danej kryptomeny. Tokenom sa väčšinou nazýva minca vytvorená na existujúcej platforme (väčšinou je určená pre rovnomennú službu). Napríklad 
dictionary.tx.title=Transakčný poplatok (Transaction Fee)
dictionary.tx.description=- Všetky transakcie kryptomeny zahŕňajú malý transakčný poplatok. Tieto transakčné poplatky sa zvyšujú o odmenu za blok, ktorú dostane ťažiar, keď úspešne spracuje blok.
dictionary.mining.title=Ťaženie (Mining)
dictionary.mining.description=- Jedná sa o akt validácie blockchainových transakcií. Mineri (ťažiari) prispievajú výpočtovou silou do blockchainovej siete, aby pomohli určiť ďalší blok. Ťažiari sú odmenený zvyčajne vo forme mincí. Inými slovami sieť potrebuje overovať transakcie prebiehajúce v sieti, a za overenie, ktoré stálo výpočetný výkon ťažiara a peniaze potrebné na kúpu počítačov a elektrinu dostáva ako motivačnú proti hodnotu jednotky danej meny.
dictionary.satoshi.title=Satoshi
dictionary.satoshi.description=- Najmenšia jednotka Bitcoinu. Platí, že 1 BTC = 1 00 000 000 Satoshi.
dictionary.nakamoto.title=Satoshi Nakamoto
dictionary.nakamoto.description=Neznámy tvorca Bitcoinu. Môže ísť o jedného človeka alebo skupinu. Stále nie je verejne známe kto pod týmto pseudonymom vystupuje.
dictionary.softfork.title=Soft fork
dictionary.softfork.description=- softvérová aktualizácia, ktorá vedie ku zmene, ktorá je kompatibilná s aktuálnou verziou softvéru (staršou), čo znamená, že aj neaktualizovaný uzol je schopný plnohodnotne fungovať s aktualizovanými uzlami.
dictionary.smartcontract.title=Smart kontrakt (Smart Contract)
dictionary.smartcontract.description=- biznis pravidlá napísané v programovacom jazyku, ktoré sa nachádzajú v
dictionary.smartcontract.description.2=ako softvér, ktorý je vyvolaný účastníkmi siete. Odpadá nutnosť aby medzi odosielateľom a prijímateľom musela byť tretia strana.
dictionary.staking.title=Staking
dictionary.staking.description=- V systéme Proof of Stake to zvyčajne znamená, že necháte svoje mince vo vašej peňaženke, aby ste za ne boli v zápätí odmenený, buď tou istou menou alebo inou na to určenou. Odmeny sa časom upravujú. Pri niektorých musí byť peňaženka online pri iných nemusí.
dictionary.stop.title=Stop Loss
dictionary.stop.description=– funkcia na burzách, ktorá umožňuje nastaviť hodnotu, pri dosiahnutí ktorej sa má kryptomena predať.
dictionary.seed.title=Seed
dictionary.seed.description=– skupina zoradených slov, kde záleží na ich poradí a dokážu znovu-vytvoriť peňaženku /
dictionary.seed.description.2=, keďže proces tvorby peňaženky je deterministický. Máva rôzny počet slov 12, 13, 15 ...
dictionary.volatile.title=Volatilita
dictionary.volatile.description=- Pojem, korý vyjadruje ako často sa cena digitálnej meny mení. Opakom tohto pojmu je pojem stabilita.
dictionary.vel.title=Veľryba (Whale)
dictionary.vel.description=– označenie pre vlastníka veľkého množstva zo všetkých mincí danej kryptomeny, ktorý sa môže stať manipulátorom jej ceny.
dictionary.supercycle.title=Supercyklus
dictionary.supercycle.description=Trvalý neobvyklý silný rast dopytu, ktorému sa producenti snažia vyrovnať, čo vyvolalo cenový rast, ktorý môže trvať roky alebo v niektorých prípadoch desať alebo viac rokov.
