page.not.found=404 Stránka nenájdená
page.index.description=Agregátor najčerstvejších článkov o kryptomenách z celého sveta.
page.index.description.long=Agregátor najčerstvejších článkov z celého sveta o kryptomenách na jednom mieste. Viac ako 150 000 krypto tipov, nielen o Bitcoine, Ethereu, Cardane, či Polkadot v podobe článkov a ďalších krypto správ obsahujúcich najnovšie krypto novinky rozdelené vhodne do krypto kategórií. Spájame už 150 krypto magazínov.
external.description=Služby, ktoré približujú používateľovi kryptomeny a krypto svet vznikajú po celom svete a je ich stále viac. Na stránkach kryptotipy.sk nájdete súhrn tých najzaujímavejších.
cooperation.descr=Spolupráca s portálom kryptotipy.sk. Výmena spätných odkazov (Backlink building), zobrazenie odkazov na vaše články na kryptotipy.sk, článok o kryptotipy.sk, alebo iný druh spolupráce.
crypto.learning.descr=Kryptotipy.sk nielen, že agregujú zaujímavý krypto obsah z celého sveta, ale vytvára aj vlastný obsah. Čítajte krypto články z pera kryptotipy.sk
did.you.know.descr=Krypto sekcia, ktorá prináša krypto zaujímavosti o rôznych kryptomenách z rôznych časových období, nielen aktuality.
default.descr= z celého sveta na jednom mieste. Vždy najčerstvejšie krypto novinky.
