footer.warning.content=Neposkytujeme finančné, ani investičné poradenstvo. Každý človek obchoduje s vlastným kapitálom a podľa vlastného uváženia. Informácie uverejnené na stránke kryptotipy.sk sú výhradne informačného charakteru a v žiadnom prípade nie sú investičnou radou alebo obchodným odporúčaním. Portál nenesie žiadnu zodpovednosť za vaše prípadne finančné straty pri investícii do kryptomien alebo iných. Pre finančné poradenstvo kontaktujte finančného poradcu.
