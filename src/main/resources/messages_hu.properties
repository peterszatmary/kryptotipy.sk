external.services.service.1.title = Blockchair
external.services.service.1.description = Szolgáltatás, amely 17 különböző blokkláncban kereshet tranzakciókat és egyéb adatokat, például BTC, Monero, ETH, LTC ...
external.services.service.2.title = Biztonságos (fekete)
external.services.service.2.description = Hideg pénztárca a kriptovaluták maximális biztonságával. Számos kriptovalutát támogat.
external.services.service.3.title = Coinbase
external.services.service.3.description = Szolgáltatás a beckende GDAx-re épített kiválasztott kriptovaluták adásvételére. Előnye az egyszerűség.
external.services.service.4.title = Exodus
external.services.service.4.description = A számos kriptovalutát támogató pénztárca tartalmaz egy beépített pénzváltót, amelyet egy másik Shapeshift szolgáltatás működtet.
external.services.service.5.title = Coinbase.Pro
external.services.service.5.description = Coinbase kriptovaluta csere. Az eredeti néven GDAX ma Coinbase.Pro néven ismert.
external.services.service.6.title = Poloniex
external.services.service.6.description = Amerikai kriptotőzsde, amelyet 2014-ben hoztak létre Amerikában. Érdekes módszer a kriptómákkal való kereskedés megkezdésére is.
external.services.service.7.title = Jaxx
external.services.service.7.description = Számos érmét támogató pénztárca. Könnyű és meleg. Nem szükséges letölteni a teljes blokkláncot, ami helyet takarít meg a merevlemezeken.
external.services.service.8.title = Trezor T
external.services.service.8.description = Hideg pénztárca fokozott biztonsággal a kriptovaluták számára. Még több kriptovalutát támogat, mint a One modell.
external.services.service.9.title = Kucoin
external.services.service.9.description = Kripto Csere. Gyorsan és megbízhatóan hozzáadja az új kriptocéneket potenciállal. Itt olyan kriptovalutákat találhat, amelyeket más tőzsdéken nem fog látni.
external.services.service.10.title = KeepKey
external.services.service.10.description = hardver pénztárca, amely számos kriptovalutát támogat az Alakváltás csoportból. Alkalmas a Safe termékek olcsóbb alternatívájaként.
external.services.service.11.title = Kraken
external.services.service.11.description = Gazdag történelemmel rendelkező amerikai kriptovaluta-csere. 2011-ben hozták létre. A kriptovalutákkal való kereskedés megkezdésének másik módja.
external.services.service.12.title = Neo to Gas
external.services.service.12.description = Újraszámolja, hogy mennyi GAS-tokent kap passzív jövedelemként, ha NEO-tokeneket tart egy speciális NEON-pénztárcában.
external.services.service.13.title = ATHA
external.services.service.13.description = Minden idők legmagasabb (ATH) kriptovalutái időbélyegzővel. Az ATH az a maximális érték, amelyet a kriptovaluta valaha elért.
external.services.service.14.title = Ledger Nano X
external.services.service.14.description = A biztonsági hangsúlyt fektető hideg pénztárca számos kriptovalutát támogat. Támogatja a Bluetooth kapcsolatot
external.services.service.15.title = ShapeShift
external.services.service.15.description = Ez egy kriptográfiai pénzváltó. Fő előnye, hogy nem szükséges regisztrálni. A kriptopénzek kriptopénzekre váltására szolgál.
external.services.service.16.title = Ethplorer
external.services.service.16.description = A cím megadása után nem csak az ETH egyenleget jelenítheti meg a pénztárcájában, hanem az adott címen található ETH tokenek egyenlegét is.
external.services.service.17.title = Binance
external.services.service.17.description = kriptovaluta csere. Kínában 2017-ben alapították. Ugyanebben az évben több mint sikeres volt. Ma ez az egyik legnagyobb kriptotőzsde a világon.
external.services.service.18.title = Bitfinex
external.services.service.18.description = kriptovaluta csere. Az USDT készítője. 2012-ben alakult. Az iFinex Inc. tulajdonosa és üzemeltetője.
external.services.service.19.title = Bittrex
external.services.service.19.description = kriptovaluta csere. Amerikában alapították 2013-ban. Az AKo elsőként ajánlott fel kártérítést az USDT, az ún TUSD (True USD).
external.services.service.20.title = Bitscreener
external.services.service.20.description = Rendezés devizaár, piaci ár, 24 órás mennyiség és típus szerint. A Chartview a változás százalékos összefoglalását kínálja.
external.services.service.21.title = Coinmarketcap
external.services.service.21.description = A kereskedelem alatt álló kriptovaluta-figyelő oldal. Számos használható rangsort, grafikont és titkosítási információt kínál.
external.services.service.22.title = Cryptocompare
external.services.service.22.description = kriptovaluta monitoring, különféle számológépek a bányászok számára, cryptocurr pénztárcák, REST API fejlesztőknek és még sok más.
external.services.service.23.title = Coindar
external.services.service.23.description = Ez egyfajta kriptográfiai naptár. Ennek a szolgáltatásnak köszönhetően tájékoztatást kap a közelgő titkosítási eseményekről, és nem fog lemaradni semmiről.
external.services.service.24.title = Crypto Fear & Greed Index
external.services.service.24.description = A Crypto Fear & Greed Index a kriptomén piacok jelenlegi hangulatát méri. Két alapvető hangulatot irányít, a félelmet és a kapzsiságot.
external.services.service.25.title = Coin ATM radar
external.services.service.25.description = Egy webes szolgáltatás, amely lehetővé teszi, hogy különböző kriptovalutákat találjon a közvetlen közelében lévő különböző kriptopénzek adásvételéhez.
external.services.service.26.title = Airdrops.io
external.services.service.26.description = Egy olyan szolgáltatás, amely figyeli az úgynevezett token légcseppeket, amelyek ingyenes tokenek a közösségi hálózatokon leggyakoribb feladatok elvégzéséhez és hasonlókhoz.
external.services.service.27.title = Staking Rewards
external.services.service.27.description = Ezzel a szolgáltatással kényelmesen kiszámíthatja, hogy mekkora a passzív jövedelme, ha Ön rendelkezik a tét tokenek egyik igazolásával.
external.services.service.28.title = Krypto tank
external.services.service.28.description = Ez egy csehországi benzinkút, ahol a népszerű Bitcoin segítségével lehet fizetni az üzemanyagért.
external.services.service.29.title = Whitepapers.io
external.services.service.29.description = A Whitepaper a kriptocén technikai specifikációja. Ez a szolgáltatás mindet egy helyen kínálja.
external.services.service.30.title = Bitcoin nekrológok
external.services.service.30.description = A Bitcoin összesen 395 alkalommal jósolta a halált. Idén háromszor. Hány ilyen jóslást fog még túlélni a Bitcoin?
did.you.know=Tudtad, hogy
did.you.know.title = Kripto érdekességek
did.you.know.description = olyan kriptovaluták világából, amelyet esetleg nem ismert.
did.you.know.bitcoin.1 = A Bitcoin 2010-ben került forgalomba 0,0008 dollárért. 2017. december 17-én elérte maximális értékét, 20 089 USD-t.
did.you.know.bitcoin.2 = Az utolsó Bitcoin kinyerésekor a bányászok továbbra is motiváltak lesznek folytatni a tranzakciók érvényesítését a befejezett tranzakciók díjaival. Ma minden egyes kivont blokk után bizonyos számú bitcoinral is jutalmazzák őket.
did.you.know.bitcoin.3 = A Bitcoin felezése olyan esemény, amelyben a kibontott blokk jutalma felére oszlik. Ez az esemény növeli az inflációs rátát és az új bitcoinok forgalomba kerülésének sebességét is. Ez minden 210 000 kivont blokk után történik.
did.you.know.bitcoin.4 = Becslések szerint a Bitcoin utolsó kitermelt blokkja 2140-ben látja majd a kibervilág fényét.
did.you.know.bitcoin.5 = A kibontott Bitcoin blokk jutalma 50 BTC volt 2009-ben, az első felezés után csak 25 BTC volt, és 2020.5.11 után (harmadik felezés) jelenleg 6.25 BTC.
did.you.know.bitcoin.6 = A Bitcoin érméinek maximális száma 21 millió. Nem lesz több.
did.you.know.bitcoin.7.3 = Idén háromszor volt. Hány ilyen jóslást fog még életben tartani a Bitcoin?
did.you.know.bitcoin.7.1 = A Bitcoin már megjósolta a halált
did.you.know.bitcoin.7.2 = összesen 395-szer
did.you.know.bitcoin.8 = Kevesebb Bitcoin érme van forgalomban, mint a Litecoin érmék. Összehasonlításképpen: a Bitcoin érmék száma 18,5 millió vs. a Litecoin-érmék száma 66,2 millió. (2021)
did.you.know.bitcoin.9.1 = A Bitcoin hálózat legnagyobb bányásza az F2Pool nevű medence, amely a teljes hálózati hashrate több mint 17% -át biztosítja.
did.you.know.bitcoin.9.2 = A második a BinancePool 11,9% -kal, az első hármat pedig a Poolin pool zárja a hálózati hashrate 11,7% -ával.
did.you.know.bitcoin.10 = 8.12021, a történelem során egyáltalán, a Bitcoin 1 millió szlovák korona tekintetében meghaladta az értéket. Ez másodszor történt 2021. 6.2. 2021 8.2-től a harmadikig a mai napig ezen a szinten marad.
did.you.know.bitcoin.11=Steve Wozniak, a világ legnagyobb tőzsdén jegyzett társaságának alapítója, a Bitcoin rajongója. 2021 -ben azt mondta, hogy a Bitcoin egy csodálatos technológia, egyedülálló matematikai képlettel.
did.you.know.bitcoin.12=2010 -ben 184 milliárd bitcoint bányásztak, miután egy támadó kihasználta a kódhibát. Ez egy 74638. számú blokk volt. Satoshi Nakamoto 5 órával a felfedezése után kijavította a hibát.
did.you.know.bitcoin.13=Az évezredek, az 1980 és 1995 között született emberek imádják a BTC -t, és szeretnek ebbe befektetni.
did.you.know.bitcoin.14=A Bitcoin sokkal kevesebb energiát fogyaszt, mint az aranybányászat vagy a hagyományos banki szolgáltatások. (2021, Galaxy Digital)
did.you.know.bitcoin.15=Az AXA, Európa második legnagyobb biztosítótársasága elkezdi elfogadni a Bitcoint. (2021)
did.you.know.bitcoin.16=A legdrágább NFT -t 69 millió dollárért adták el. (2021)
did.you.know.bitcoin.17=Becslések szerint az összes Bitcoin 20% -a helyrehozhatatlanul elveszett. Ez körülbelül 3-4 millió BTC. (2021)
did.you.know.bitcoin.18=Az összes Bitcoin 90% -át már kitermelték. (2021)
did.you.know.bitcoin.19=New Yorkban kriptovalutákért is vásárolhat ingatlant. Kifejezetten Bitcoin, Ethereum, DogeCoin. Az Algocap Real Estate úgy döntött, hogy elfogadja a fizetést kriptovalutákban.
did.you.know.bitcoin.20=Ray Dalio, a világ legnagyobb fedezeti alapjának alapítója szintén Bitcoint birtokol. (2021) 
did.you.know.bitcoin.21.1=Daymak Avvenire elektromos autó hívott
did.you.know.bitcoin.21.2=töltés közben bányászhatja a Bitcoin és Dogecoin kriptovalutákat.
did.you.know.monero.1 = A Monera érmék maximális száma nincs korlátozva. Kibocsátásuk azonban szabályozott. Az érme jutalmát 2022 május végéig csökkentik, amikor 18 132 000 lesz forgalomban. Ezt követően a jutalom 0,6 XMR-n áll meg.

did.you.know.neo.1 = Ha NEO tokent illeszt be a NEON pénztárcájába, akkor automatikusan megszerezhet egy másik kriptovalutát, ez pedig GAS. Más szóval, passzív jövedelmet kap.
did.you.know.neo.2 = A Neo a tétplatform bizonyítéka, amelyet gyakran a kínai Ehereumnak tartanak. Az Ethereumhoz hasonlóan a NEO is lehetőséget kínál úgynevezett intelligens szerződések létrehozására.

did.you.know.ethereum.1 = Az Ethereum 2.0 2020.12.1-én indult. A főbb változtatások között szerepel a tét igazolása a korábbi Munkaigazolás helyett. 2 éven belül a tranzakciók számának növekedése másodpercenként 15-ről 100 000-re.
did.you.know.ethereum.2=A londoni kemény erőd után 10 000 dollár értékű ETH -t égetnek el percenként. (2021)
did.you.know.iota.1 = az egyetlen kriptovaluta, amelynek tranzakciós díjai nulla. Más szóval, ingyenesek.
did.you.know.iota.2 = Ahogy a neve is mutatja, az IOTA készen áll az úgynevezett IOT tárgyak internetére, ahol minden összekapcsolódik és elérhető lesz az interneten keresztül. Például hűtőszekrénye képes fizetni és vásárolni az Ön tudta nélkül és még sok minden más nélkül. Az IOTA az egyetlen, amely lehetővé teszi a jövőben általánossá váló mikrotranzakciókat. Ki hajtja végre a mikrotranzakciókat, és hogyan nem fontos. Ma azonban már van olyan platformunk, amely a nulla díjnak köszönhetően életre keltheti a mikrotranzakció gondolatát. A tranzakció végrehajtásához elegendő, ha két másik hálózati csomópont ellenőrzi.
did.you.know.iota.3 = Az IOTA intelligens szerződéseket mutat be a platformján, amelyek 2021 végére valósággá válhatnak.

did.you.know.litecoin.1 = A Litecoin a Bitcoin forráskódjából származott még 2011-ben.
did.you.know.litecoin.2 = A Litecoin maximális érmeszáma 84 millió. Nem lesz több.
did.you.know.litecoin.3 = Kevesebb Bitcoin érme van forgalomban, mint a Litecoin érme. Összehasonlításképpen: a Bitcoin érmék száma 18,5 millió vs. a Litecoin-érmék száma 66,2 millió. (2021)

did.you.know.tether.1 = A Tether egy olyan stabilpénz, amelyet a Tether Limited és a tőzsde együttműködésével hoztak létre.
did.you.know.tether.2 = 1 A tether pontosan 1 dollárt fedez.
did.you.know.tether.3 = A tether azért jött létre, hogy a kereskedőknek ne kelljen feleslegesen váltaniuk kriptovalutáikat FIAT-okra kereskedéseik során.

did.you.know.btccash.1 = A Bitcoin Cash a Bitcoin kemény villájaként jött létre.

did.you.know.btccash.2 = A Bitcoin Cash fő oka az volt, hogy a tranzakciós blokkot 1 MB-ról 8 MB-ra növelje. Ennek eredményeként a Bitcoin Cash másodpercenként több tranzakciót képes feldolgozni, mint a Bitcoin.

did.you.know.btcsv.1 = SV jelentése Satoshi Vision, ami Satoshi látásmódját jelenti.
did.you.know.btcsv.2 = A Bitcoin SV a Bitcoin Cash kriptovaluta kemény villájaként keletkezett.
did.you.know.btcsv.3 = A Bitcoin SV kriptovaluta megjelenése mögött ismét a tranzakciós blokk növekedése áll 8 MB-ról 128 MB-ra, ami másodpercenként még nagyobb számú validált tranzakciót jelent.


