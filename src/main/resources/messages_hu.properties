dictionary.dump.description = - egy kriptovaluta, részvény vagy áru értékének jelentős csökkenése.
dictionary.erc20.title = ERC-20
dictionary.erc20.description = - Felület, amely alapján újak jönnek létre
dictionary.erc20.description.2 = alapján
dictionary.erc20.description.3 =. Más szavakkal, intelligens szerződés, amely végrehajtja az adott ERC-20 szabályozást.
dictionary.erc20.description.4 = Itt többet megtudhat arról, amit az ERC-20 leír.
dictionary.erc223.title = ERC-223
dictionary.erc223.description = - az ERC20 szabvány utódja. Ennek többek között olcsóbb tranzakciókat kell hoznia, és például képesnek kell lennie olyan rég elveszett tokenek kiválasztására, amelyekhez senki sem fér hozzá. Több információ
dictionary.erc721.title = ERC-721
dictionary.erc721.description = egy szabványos token az Ethereum hálózatban, amely lehetővé teszi, hogy csak NFT tokent állítson elő, és arra kényszeríti a fejlesztőket, hogy minden új token számára új intelligens szerződést hozzanak létre és telepítsenek. Összehasonlításképpen: az ERC-1155 token szabvány lehetővé teszi mind az NFT tokenek, mind a helyettesíthető tokenek létrehozását. Nem szükséges minden tokenhez új intelligens szerződést létrehozni és telepíteni. Csak egy elég.
dictionary.erc1155.title = ERC-1155
dictionary.erc1155.description = Az ERC-1155 egy token szabvány, amely lehetővé teszi az úgynevezett nem-cserélhető tokenek (NFT), valamint a helyettesíthető tokenek létrehozását az Ethereum hálózaton. Az ERC-1155 token szabványt automata funkcióként hozták létre, ahol a fejlesztők egyetlen intelligens szerződést telepíthetnek, amellyel korlátlanul cserélhető (azonos) tokenek, valamint (egyedi) NFT tokenek hozhatók létre. Összehasonlításképpen: az ERC-721 token szabvány csak NFT tokent állít elő, és arra kényszeríti a fejlesztőket, hogy telepítsenek és hozzanak létre új intelligens szerződést minden új token számára.
dictionary.ep5.title = EP-5
dictionary.ep5.description = - Hasonló az ERC20-hoz vagy az ERC223-hoz, ez is egy szabványos token, de
dictionary.exchange.title = Csere
dictionary.exchange.description = - digitális cserével rendelkező webhely, ahol vásárolnak és eladnak
dictionary.fomo.title = FOMO (A hiányzástól való félelem)
dictionary.fomo.description = - az elmulasztott lehetőségtől való félelem érzete. Gyakran ez okozza a legmagasabb devizavásárlást vagy veszteséges eladást.
dictionary.fork.title = FORK
dictionary.fork.description = - szoftverfrissítés, amely olyan változást eredményez, amely kompatibilis vagy inkompatibilis lehet a jelenlegi szoftververzióval. Lásd kemény villa, puha villa.
dictionary.fud.title = FUD (félelem, bizonytalanság és kétség)
dictionary.fud.description = - olyan érzelmek keveréke, mint a félelem, a bizonytalanság és a kétség, amelyet a kriptovaluták világából származó negatív hírek okoznak. Egy ilyen pánik következtében az ár gyakran eshet.
dictionary.fudster.title = FUDster
dictionary.fudster.description = - valaki terjeszti a FUD adathordozókat.
dictionary.fiat.title = FIAT
dictionary.fiat.description = - a kormányok által kibocsátott hivatalos pénznemek (EUR, USD stb.)
dictionary.fundament.title = Alapvető elemzés
dictionary.fundament.description = - elemzés nyilvánosan elérhető információk alapján a jövőbeli ár meghatározásához
dictionary.fundament.description.2 = / akciók ...
dictionary.genesis.title = Genezis blokk
dictionary.genesis.description = - A legelső blokk a
dictionary.genesis.description.2 = blockchainban
dictionary.halving.title = A felezés
dictionary.halving.description = - olyan esemény, amelyben a megszállottak jutalmának felosztása történik
dictionary.halving.description.2 = pontosan fél blokk. Ez az esemény a felére csökkenti az inflációs rátát és azt is, hogy milyen sebességgel kerülnek új Bitcoinok forgalomba. Ez 210 000 kivont blokk után történik meg egyszer.
dictionary.hardfork.title = Kemény villa
dictionary.hardfork.description = - szoftverfrissítés, amely az aktuális (régebbi) verzióval kompatibilis változáshoz vezet, ami azt jelenti, hogy egy ilyen elavult csomópont nem képes teljes mértékben működni frissített csomópontokkal (lehet, hogy nem képes legyen ellenőrizni a tranzakciókat, fogadni vagy küldeni a tranzakciókat stb.). A kemény erőd után mindig van hely egy új valutának. Ez akkor fordul elő, amikor a hálózat egy része elutasítja a frissítést, és a régi verzión marad. Ettől a verziótól kezdve mindkét hálózat a saját életét éli. Ha a hálózat inkompatibilis frissítést kap, akkor merevlemezről beszélünk, új kriptovaluta nélkül.
dictionary.hardwallet.title = Hardver pénztárca
dictionary.hardwallet.description = - kriptográfiailag biztonságos hardver, amelyet a pénztárcádban lévő információk biztonságára terveztek. Ilyen például a pénztárca
dictionary.hashrate.title = Hasír
dictionary.hashrate.description = - Olyan szám, amely jelzi a húzás sebességét, pontosabban azoknak a kivonatoknak a számát, amelyeket a gép másodpercenként képes megoldani.
dictionary.hodl.title = HODL
dictionary.hodl.description = - az eredeti HOLD-ból eredő kifejezés érmék tartását és nem eladását jelenti.
dictionary.hotwallet.title = Forró pénztárca
dictionary.hotwallet.description = - pénztárca csatlakozik az internethez, napi tranzakciókhoz. De az internet miatt kevésbé biztonságos.
dictionary.hype.title = Hype
dictionary.hype.description = - tömeges lelkesedés nemcsak egy kriptovaluta körül annak érdekében, hogy láthatóvá váljon a piacon. A kifejezés általában nem kapcsolódik kriptográfiához.
dictionary.ico.title = ICO (Kezdő érmeajánlat)
dictionary.ico.description = - a digitális pénznem első nyilvános felajánlása a tőzsdei bevezetés előtt. Hasonló a tömeges finanszírozáshoz a digitális világban.
dictionary.kaico.title = KAICO
dictionary.kaico.description = - A CryptoKami saját ötlettel állt elő az ICO elvégzésére. Ez egyfajta versenytársa a DAICO-nak. Noha hasonlóak, különböző tulajdonságokat is kínálnak.
dictionary.kaico.description.2 = Itt többet olvashat róla.
dictionary.cap.title = Nagybetű
dictionary.cap.description = - egy adott kriptovaluta forgalomban lévő összes érméje szorozva az érme aktuális értékével.
dictionary.cap.description.2 = Itt többet olvashat róla.
dictionary.confirmation.title = Megerősítés
dictionary.confirmation.description = - A tranzakció akkor kerül megerősítésre, ha azt a hálózat bizonyos számú csomópontja (bányász) megerősítette. Ez egy sikeres jelszó lenyelése és hozzáadása a blokklánchoz.
dictionary.correction.title = Javítás
dictionary.correction.description = - az ellentétes mozgás, általában negatív, általában a részvények vagy az értékpapírok 10 százalékos esése ... ahol az ár túlértékelését kompenzálják. A korrekciók ideiglenesek és megszakítják az általában emelkedő trendet.
dictionary.consensus.title = Konszenzus
dictionary.consensus.description = - akkor érhető el, amikor az összes résztvevő csomópont beleegyezik abba, hogy a tranzakciót belefoglalja a blokkláncba.
dictionary.kyc.title = KYC (Ismerje meg ügyfelét)
dictionary.kyc.description = - ismerje meg ügyfelét. Az a folyamat, amikor az ügyfél (vevő) személyi adatok kitöltésével és gyakran azonosító kártyák szerverre történő feltöltésével igazolja személyazonosságát.
dictionary.marketcap.title = Piaci korlát
dictionary.marketcap.description = - az adott kriptovaluta forgalomban lévő összes érméjének összértéke.
dictionary.mooning.title = Mooning
dictionary.mooning.description = - adja meg, mikor emelkedik az ár. Ez nem feltétlenül extrém növekedés.
dictionary.multisignature.title = Több aláírás
dictionary.multisignature.description = - (multisig) A több aláírható cím lehetővé teszi, hogy több fél több kulcsot is kérjen tranzakció engedélyezéséhez. A cím létrehozásakor megegyeznek a szükséges számú aláírásról. A több aláírással ellátott címek sokkal ellenállóbbak a lopásokkal szemben.
dictionary.nativetoken.title = Natív token
dictionary.nativetoken.description = - A Cardano lehetővé teszi a saját létrehozását
dictionary.nativetoken.description.2 = a Cardano hálózatban, amelyet natívnak nevez. Natív, mert nem különböznek semmilyen különleges módon az eredeti ADA tokentől. Az ETH esetében a különbségek az ERC-20 és
dictionary.nativetoken.description.3 = ERC-721 tokenek
dictionary.nativetoken.description.4 = egy ETH.
dictionary.nft.title = NFT (Nem helyettesíthető tokenek)
dictionary.nft.description = ezek a tokenek nem cserélhetők fel. Összetéveszthetetlenek, mert különböznek egymástól. Különböznek a token meta tulajdonságaiban. Például az Ethereum hálózaton található ERC-20 tokenek azonos meta tulajdonságokkal rendelkező tokenek, ezért 1 ETH felcserélhető egy másik 1 ETH-val. Az NFT tokenekkel nem lehet 1 tokent cserélni egy másikra, mert nem azonosak, ezért nincs azonos ár / érték. Az NFT-k fizikai és virtuális eszközök (fegyverek, ruházat és egyéb játékok, zene stb.) Képviseletére vannak létrehozva.
dictionary.node.title = Csomópont
dictionary.node.description = - A hálózati résztvevő által működtetett főkönyv (tranzakciós blokklánc) másolata.
dictionary.margin.title = Margókereskedelem
dictionary.margin.description = - Olyan pénz kereskedése, amelyet maga a tőzsde adott kölcsön. A kölcsön megszerzéséhez a tőkét betétként kell befizetni.
dictionary.p2p.title = P2P (Peer to Peer)
dictionary.p2p.description = - Olyan hálózat, ahol minden csomópont elláthatja a szerver és az ügyfél szerepét is. Nincs központi pont egy vagy több kiszolgáló formájában, ahogyan ez a kliens-szerver architektúránál történik.
dictionary.paperwallet.title = Papír pénztárca
dictionary.paperwallet.description = - Nyomtatott papír pénztárca adataival. Ez az információ gyakran privát cím és cím
dictionary.parachain.title = Ejtőernyő
dictionary.parachain.description = egy alkalmazás-specifikus adatstruktúra, amely globálisan koherens és érvényesíthető a validátorok által
dictionary.parachain.description.2 = Ez általában blokklánc formáját ölti, de nem kell, hogy valódi blokklánc legyen. Az ejtőernyők lehetővé teszik a kapcsolódást
dictionary.parachain.description.3 = az ökoszisztémában már létező cryptomen blokkláncok. Ezek párhuzamosan működhetnek (ellenőrzés ...) a Relay lánccal, ami lehetővé teszi ennek az ökoszisztémának a kiváló skálázását.
dictionary.wallet.title = Pénztárca
dictionary.wallet.description = - digitális pénztárca 1 vagy több digitális névhez. Ez egy olyan hely, ahol magukat az érméket nem tárolják, hanem az érmék küldéséhez és fogadásához szükséges magán- és nyilvános kulcsokat.
dictionary.pow.title = Munka igazolása (PoW)
dictionary.pow.description = - Az a rendszer, amelyen alapul a blokklánc. A tranzakció ellenőrzése és hozzáadása a blokklánchoz úgynevezett kivonással történik, amely jelentős számítási teljesítményt igényel (ebből
dictionary.pos.title = A tét igazolása (PoS)
dictionary.pos.description = - Az a rendszer, amelyen alapszik a blokklánc kezelése. Tranzakciókat fogadnak az egyes csomópontok tranzakcióinak ellenőrzésére, aszerint, hogy a kriptovaluta mekkora részét birtokolja. Minél többet birtokol, annál inkább a csomópont (pénztárca) képes ellenőrizni a tranzakciókat az idő múlásával, és így több jutalmat szerezhet kriptovaluták vagy más, ehhez tervezett kriptovaluták formájában.
dictionary.publickey.title = Nyilvános kulcs
dictionary.publickey.description = - A nyilvános és a magánkulcs párját széles körben használják a rejtjelezésben két érdekelt közötti titkosított kommunikáció elérésére. A feladónak ismernie kell az üzenet címzettjének nyilvános kulcsát. Vegye figyelembe, hogy a nyilvános kulcs általában nem egyezik meg a titkosítás címével
dictionary.publickey.description.2 =, de gyakran abból számítják ki.
dictionary.privatekey.title = Privát kulcs
dictionary.privatekey.description = - a nyilvános és a magánkulcs párját széles körben használják a rejtjelezésben két érdekelt közötti titkosított kommunikáció elérése érdekében. A feladó egyedi magánkulcsával írja alá az üzeneteket. A kriptóban a privát cím az az adat, amely lehetővé teszi a pénztárca újrateremtését, ezzel tranzakciókat ír alá. Ne tévedj a vetőmaggal.
dictionary.pumpdump.title = Pump & Dump
dictionary.pumpdump.description = - szervezett ármanipuláció, amelynek során viszonylag rövid idő alatt tömeges vásárlásokkal növelik a kriptovaluta értékét. A maximális ár elérése után tömeges értékesítés következik, és hirtelen csökken az ár.
dictionary.relaychain.title = Relé lánc
dictionary.relaychain.description = az ökoszisztéma központi láncolata
dictionary.relaychain.description.2 = Minden érvényesítő
dictionary.relaychain.description.3 = kapcsolódnak egy közvetítő lánchoz, és érvényesítik azt egy relé láncra.
dictionary.resistance.title = Ellenállás
dictionary.resistance.description = - Az ellenállás szintje meghaladja az eszköz aktuális árát, és az emelkedő árak felső határaként működik. A támogatási szintekkel ellentétes logika - az ellenállási szintek azt jelentik, hogy az ár valószínűleg inkább visszapattan erről a szintről, mintsem megtörné.
dictionary.support.title = Támogatás
dictionary.support.description = - A támogatási szint az aktuális eszközár alatt van, és meghatározza azokat a területeket, ahol a csökkenő árak ismétlődő támogatást fognak találni a további csökkenés előtt. Ez azt jelenti, hogy az ár valószínűleg "visszapattan" erről a szintről, nem pedig megtörni.
dictionary.ta.title = TA (technikai / trendelemzés)
dictionary.ta.description = - az ár alakulásának gazdasági adatok szerinti vizsgálatának folyamata annak jövőbeni fejlődésének meghatározása érdekében.
dictionary.token.title = Token
dictionary.token.description = - a kriptovaluta egysége / érme. A tokent általában érmének hívják, amelyet egy meglévő platformon hoztak létre (általában azonos nevű szolgáltatásra szánják). Például
dictionary.tx.title = Tranzakciós díj
dictionary.tx.description = - Minden kriptovaluta tranzakció kis tranzakciós díjat von maga után. Ezeket a tranzakciós díjakat növeli a blokkjutalom, amelyet a bányász kap, amikor sikeresen feldolgozza a blokkot.
dictionary.mining.title = Bányászat
dictionary.mining.description = - Ez egy blokklánc-validálási aktustranzakciók. A bányászok számítási erővel járulnak hozzá a blokklánc-hálózathoz, hogy elősegítsék a következő blokk azonosítását. A bányászokat általában érmék formájában jutalmazzák. Más szavakkal, a hálózatnak ellenőriznie kell a hálózatban zajló tranzakciókat, és annak ellenőrzéséhez, hogy a bányász számítási teljesítménye, valamint a számítógépek és az áram megvásárlásához szükséges pénz ösztönzésként kapja-e az egység értékét. A valuta.
dictionary.satoshi.title = Satoshi
dictionary.satoshi.description = - A Bitcoin legkisebb egysége. Megállapítja, hogy 1 BTC = 1 00 000 000 Satoshi.
dictionary.nakamoto.title = Satoshi Nakamoto
dictionary.nakamoto.description = Ismeretlen Bitcoin készítő. Ez lehet egy személy vagy egy csoport. Még mindig nem ismert nyilvánosan, ki jelenik meg ezen az álnéven.
dictionary.softfork.title = Puha villa
dictionary.softfork.description = - szoftverfrissítés, amely a jelenlegi (régebbi) szoftververzióval kompatibilis változáshoz vezet, ami azt jelenti, hogy még egy elavult csomópont is képes teljes mértékben működni frissített csomópontokkal.
dictionary.smartcontract.title = Intelligens szerződés
dictionary.smartcontract.description = - a programozási nyelven írt üzleti szabályok, amelyek megtalálhatók itt:
dictionary.smartcontract.description.2 = a hálózati résztvevők által meghívott szoftverként. A feladó és a címzett között nincs szükség harmadik félre.
dictionary.staking.title = Tét
dictionary.staking.description = - A Proof of Stake rendszerben ez általában azt jelenti, hogy az érméket a pénztárcában hagyja, hogy a közeljövőben jutalmat kapjon értük, akár ugyanabban a pénznemben, akár más kijelölt pénznemben. A jutalmak idővel módosulnak. Egyesek számára a pénztárcának online állapotban kell lennie, mások számára nem.
dictionary.stop.title = Stop Loss
dictionary.stop.description = - olyan funkció a tőzsdéken, amely lehetővé teszi annak az értéknek a beállítását, amelyen a kriptovalutát el kell adni.
dictionary.seed.title = Mag
dictionary.seed.description = - válogatott szavak csoportja, ahol azok sorrendje függ, és újra létrehozhatom a pénztárcát /
dictionary.seed.description.2 =, mivel a pénztárca létrehozásának folyamata determinisztikus. Más szavak száma van: 12, 13, 15 ...
dictionary.volatile.title = Volatilitás
dictionary.volatile.description = - Olyan kifejezés, amely kifejezi, hogy a digitális valuta ára milyen gyakran változik. Ennek a koncepciónak az ellentéte a stabilitás fogalma.
dictionary.vel.title = Bálna
dictionary.vel.description = - megnevezés egy adott kriptovaluta nagy mennyiségű összes érméjének tulajdonosának, aki manipulátorává válhat az árával.
dictionary.supercycle.title=Szuperkerékpár
dictionary.supercycle.description=A rendellenesen erőteljes keresletnövekedés, amelynek a gyártók küzdenek, hogy megfeleljenek az árak növekedésének, ami évekig, vagy egyes esetekben akár egy évtizedig is tarthat.
