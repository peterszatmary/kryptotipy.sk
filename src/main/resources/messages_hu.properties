dictionary.coldwallet.title = Hideg pénztárca
dictionary.coldwallet.description = - Az interneten kívül tárolt digitális pénznemek. Ilyenek például a papír pénztárca, a hardver pénztárca. Az ilyen típusú pénztárcák létezésének oka a nagyobb biztonság. Ennek ellentéte az úgynevezett forró pénztárca.
dictionary.coin.title = Érme
dictionary.coin.description = - a digitális kriptovaluta egy egysége. Gyakran használják szinonimaként és rövidebb kifejezésként egy kriptovalutát.
dictionary.crypto.title = Kriptovaluta (kriptovaluta)
dictionary.crypto.description = - kriptográfia alapján digitális pénznem.
dictionary.dyor.title = DYOR (Saját kutatás)
dictionary.dyor.description = - azt jelenti, hogy saját kutatást vagy áttekintést végezhet egy adott témáról vagy névről.
dictionary.dao.title = DAO - (Decentralizált Autonóm Szervezetek)
dictionary.dao.description = fordításban decentralizált autonóm szervezeteket jelent - el lehet képzelni őket olyan vállalatokként, amelyek minden emberi beavatkozás (autonómia) nélkül működhetnek, és az ellenőrzés minden formáját megsemmisíthetetlen üzleti szabályokba ültették át.
dictionary.daico.title = DAICO - Decentralizált ICO
dictionary.daico.description = - Az ICO működését csak egy intelligens szerződés biztosítja, amely az adott
