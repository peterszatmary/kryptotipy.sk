page.not.found = 404 Az oldal nem található
page.index.description=Az egész világ új kriptovaluta cikkeinek összesítője.
page.index.description.long=Egy aggregátor a legújabb cikkeket a világ minden tájáról mintegy cryptocurrencies egy helyen. Több mint 150 000 titkosítási tipp, nem csak a Bitcoinról, az Ethereo -ról, a Cardane -ról vagy a Polkadot -ról cikkek és egyéb kripto -üzenetek formájában, amelyek a legújabb kriptohíreket tartalmazzák, megfelelően kripto kategóriákba osztva. Már 150 titkosító magazint csatlakoztatunk.
external.description = Világszerte megjelennek olyan szolgáltatások, amelyek a kriptovalutát eljuttatják a felhasználóhoz és a kriptovilághoz, és egyre több van belőlük. A kryptotipy.sk weboldalon összefoglalót talál a legérdekesebbekről.
cooperation.descr = Együttműködés a kryptotipy.sk portállal. Visszahivatkozások cseréje (Backlink-építés), linkek megjelenítése a kryptotipy.sk cikkekre, a kryptotipy.sk-ről szóló cikkek vagy más típusú együttműködés.
crypto.learning.descr = A Kryptotipy.sk nemcsak a világ minden tájáról származó érdekes kriptotartalmat összesíti, hanem saját tartalmat is létrehoz. Olvassa el a kriptográfiai cikkeket a toll kriptotipy.sk-ről
did.you.know.descr = Kripto rész, amely érdekes tényeket közöl a kripto-ról, különböző időszakok különböző kriptovalutáiról, nemcsak híreket.
default.descr = a világ minden tájáról egy helyen. Mindig a legfrissebb kriptográfiai hírek.

