external.services.h1 = Externe Kryptodienste
external.services.h1.description = Auswahl interessanter Websites, Portale, Börsen, Anwendungen, Kryptowährungsdienste.
external.services.service.1.title = Blockchair
external.services.service.1.description = Dienst, der Transaktionen und andere Daten in 17 verschiedenen Blockchains wie BTC, Monero, ETH, LTC ... durchsuchen kann.
external.services.service.2.title = Trezor One (Schwarz)
external.services.service.2.description = Cold Wallet mit maximaler Sicherheit für Ihre Kryptowährungen. Unterstützt eine Reihe von Kryptowährungen.
external.services.service.3.title = Coinbase
external.services.service.3.description = Service zum Kauf und Verkauf ausgewählter Kryptowährungen, die auf GDAx basieren. Sein Vorteil ist die Einfachheit.
external.services.service.4.title = Exodus
external.services.service.4.description = Die Brieftasche, die eine Reihe von Kryptowährungen unterstützt, enthält ein integriertes Austauschbüro, das von einem anderen Shapeshift-Dienst betrieben wird.
external.services.service.5.title = Coinbase.Pro
external.services.service.5.description = Coinbase-Kryptowährungsaustausch. Mit dem ursprünglichen Namen GDAX jetzt bekannt als Coinbase.Pro.
external.services.service.6.title = Poloniex
external.services.service.6.description = Amerikanischer Krypto-Austausch, der 2014 in Amerika gegründet wurde. Es ist auch eine interessante Möglichkeit, mit dem Handel mit Kryptomen zu beginnen.
external.services.service.7.title = Jaxx
external.services.service.7.description = Brieftasche, die eine Reihe von Münzen unterstützt. Es ist leicht und heiß. Es muss nicht die gesamte Blockchain heruntergeladen werden, was Platz auf Festplatten spart.
external.services.service.8.title = Trezor T
external.services.service.8.description = Cold Wallet mit erhöhter Sicherheit für Ihre Kryptowährungen. Es unterstützt noch mehr Kryptowährungen als das One-Modell.
external.services.service.9.title = Kucoin
external.services.service.9.description = Cryptocurrency Exchange. Es fügt schnell und zuverlässig neue Kryptocene mit Potenzial hinzu. Hier finden Sie Kryptowährungen, die Sie an anderen Börsen nicht sehen werden.
external.services.service.10.title = KeepKey
external.services.service.10.description = Wallet-Hardware, die eine Reihe von Kryptowährungen aus der Shapeshift-Gruppe unterstützt. Geeignet als billigere Alternative zu sicheren Produkten.
external.services.service.11.title = Kraken
external.services.service.11.description = Amerikanischer Kryptowährungsaustausch mit einer reichen Geschichte. Es wurde 2011 gegründet. Ein weiterer Weg, um mit dem Handel mit Kryptowährungen zu beginnen.
external.services.service.12.title = Neo to Gas
external.services.service.12.description = Berechnet neu, wie viel GAS-Token Sie als passives Einkommen erhalten, wenn Sie NEO-Token in einer speziellen NEON-Brieftasche aufbewahren.
external.services.service.13.title = ATHA
external.services.service.13.description = Last All Time High (ATH) Kryptowährungen mit Zeitstempel. ATH ist der Maximalwert, den die Kryptowährung jemals erreicht hat.
external.services.service.14.title = Ledger Nano X
external.services.service.14.description = Cold Wallet mit Sicherheitsschwerpunkt unterstützt eine Reihe von Kryptowährungen. Unterstützt die Bluetooth-Verbindung
external.services.service.15.title = ShapeShift
external.services.service.15.description = Es handelt sich um ein Krypto-Austauschbüro. Der Hauptvorteil ist, dass keine Registrierung erforderlich ist. Es wird verwendet, um Kryptowährungen in Kryptomens zu ändern.
external.services.service.16.title = Ethplorer
external.services.service.16.description = Nach Eingabe der Adresse kann nicht nur der ETH-Kontostand in Ihrer Brieftasche angezeigt werden, sondern auch der Kontostand aller ETH-Token an dieser Adresse.
external.services.service.17.title = Binance
external.services.service.17.description = Cryptocurrency Exchange. Es wurde 2017 in China gegründet. Im selben Jahr war es mehr als erfolgreich. Heute ist es einer der größten Krypto-Börsen der Welt.
external.services.service.18.title = Bitfinex
external.services.service.18.description = Cryptocurrency Exchange. Schöpfer von USDT. Es wurde 2012 gegründet. Es gehört und wird von iFinex Inc. betrieben.
external.services.service.19.title = Bittrex
external.services.service.19.description = Cryptocurrency Exchange. Es wurde 2013 in Amerika gegründet. AKo war das erste Unternehmen, das einen Ersatz für das sogenannte USDT anbot TUSD (True USD).
external.services.service.20.title = Bitscreener
external.services.service.20.description = Sortieren nach Währungspreis, Marktkapitalisierung, 24-Stunden-Volumen und Typ. Chartview bietet eine prozentuale Zusammenfassung der Änderung.
external.services.service.21.title = Coinmarketcap
external.services.service.21.description = Seite zur Überwachung der Kryptowährung, die gehandelt wird. Es bietet eine Reihe verwendbarer Rankings, Grafiken und Kryptoinformationen.
external.services.service.22.title = Cryptocompare
external.services.service.22.description = Überwachung der Kryptowährung, verschiedene Taschenrechner für Miner, Cryptocurr-Wallets, REST-API für Entwickler und mehr.
external.services.service.23.title = Coindar
external.services.service.23.description = Dies ist eine Art Kryptokalender. Dank dieses Dienstes werden Sie über bevorstehende Kryptoereignisse informiert und Sie werden nichts verpassen.
external.services.service.24.title = Crypto Fear & Greed Index
external.services.service.24.description = Crypto Fear & Greed Index misst die aktuelle Stimmung in Cryptomen-Märkten. Es kontrolliert zwei Grundstimmungen, Angst und Gier.
external.services.service.25.title = Coin ATM radar
external.services.service.25.description = Ein Webdienst, mit dem Sie verschiedene Kryptowährungen finden können, um verschiedene Kryptowährungen in Ihrer unmittelbaren Umgebung zu kaufen und zu verkaufen.
external.services.service.26.title = Airdrops.io
external.services.service.26.description = Ein Dienst, der sogenannte Token-Lufttropfen überwacht, bei denen es sich um kostenlose Token handelt, um die häufigsten Aufgaben in sozialen Netzwerken und dergleichen auszuführen.
external.services.service.27.title = Staking Rewards
external.services.service.27.description = Mit diesem Service können Sie bequem berechnen, wie hoch Ihr passives Einkommen ist, wenn Sie einen der Proof-of-Stake-Token besitzen.
external.services.service.28.title = Kryptotank
external.services.service.28.description = Dies ist eine Tankstelle in der Tschechischen Republik, an der mit dem beliebten Bitcoin Kraftstoff bezahlt werden kann.
external.services.service.29.title = Whitepapers.io
external.services.service.29.description = Whitepaper ist die technische Spezifikation des Kryptozäns. Dieser Service bietet sie alle an einem Ort.
external.services.service.30.title = Nachrufe auf Bitcoin
external.services.service.30.description = Bitcoin hat den Tod insgesamt 395 Mal vorhergesagt. Es war 3 Mal in diesem Jahr. Wie viele solcher Vorhersagen wird Bitcoin noch überleben?
external.services.service.31.title = Axie Infinity
external.services.service.31.description=Ein beliebtes dezentrales Spiel auf der Ethereum-Blockchain. Sammle, pass auf und kämpfe mit fantastischen Kreaturen namens Axie.
external.services.service.32.title = Crypto Punks
external.services.service.32.description=Basierend auf ERC-721. Sammle und tausche 10.000 einzigartige Charaktere wie NFT.
external.services.service.33.title = Opensea
external.services.service.33.description=Peer-to-Peer-Handelsmarkt für Krypto-Sammlerstücke und seltene digitale Gegenstände.
external.services.service.34.title = Rarible
external.services.service.34.description=Der erste NFT-Community-Markt.
external.services.service.35.title = Sushiswap
external.services.service.35.description=Die von der Community betriebene automatisierte dezentrale Wechselstube, die sich derzeit auf Blockchain Ethereum befindet.
external.services.service.36.title = Uniswap
external.services.service.36.description=Dezentraler Token-Austausch im Ethereum-Netzwerk.
did.you.know=Wusstest du das
did.you.know.title = Krypto-Kuriositäten
did.you.know.description = aus einer Welt von Kryptowährungen, die Sie möglicherweise nicht kennen.
did.you.know.bitcoin.1 = Bitcoin wurde 2010 für 0,0008 USD verkauft. Am 17. Dezember 2017 erreichte es seinen Maximalwert von USD 20.089.
did.you.know.bitcoin.2 = Wenn das letzte Bitcoin extrahiert wird, werden Bergleute weiterhin motiviert sein, Transaktionen mit Gebühren für abgeschlossene Transaktionen weiter zu validieren. Heute werden sie außerdem nach jedem extrahierten Block mit einer bestimmten Anzahl von Bitcoins belohnt.
did.you.know.bitcoin.3 = Bitcoin-Halbierung ist ein Ereignis, bei dem die Belohnungen für einen extrahierten Block in zwei Hälften geteilt werden. Dieses Ereignis wird auch die Inflationsrate und die Geschwindigkeit erhöhen, mit der neue Bitcoins in Umlauf gebracht werden. Dies geschieht alle 210.000 extrahierten Blöcke.
did.you.know.bitcoin.4 = Es wird geschätzt, dass der letzte abgebaute Bitcoin-Block 2140 das Licht der Cyberwelt erblicken wird.
did.you.know.bitcoin.5 = Die Belohnungen für den extrahierten Bitcoin-Block beliefen sich 2009 auf 50 BTC, nach der ersten Halbierung waren es nur 25 BTC und nach dem 11.5.2020 (dritte Halbierung) sind es derzeit 6,25 BTC.
did.you.know.bitcoin.6 = Bitcoin hat eine maximale Anzahl von Münzen von 21 Millionen. Es wird nicht mehr geben.
did.you.know.bitcoin.7.3 = Es war 3 Mal in diesem Jahr. Wie viele solcher Vorhersagen wird Bitcoin noch überleben?
did.you.know.bitcoin.7.1 = Bitcoin hatte bereits den Tod vorhergesagt
did.you.know.bitcoin.7.2 = insgesamt 395 mal
did.you.know.bitcoin.8 = Es sind weniger Bitcoin-Münzen im Umlauf als Litecoin-Münzen. Zum Vergleich: Die Anzahl der Bitcoin-Münzen beträgt 18,5 Millionen gegenüber 18,5 Millionen. Anzahl der Litecoin-Münzen 66,2 Millionen. (2021)
did.you.know.bitcoin.9.1 = Der größte Miner im Bitcoin-Netzwerk ist ein Pool namens F2Pool, der mehr als 17% der gesamten Netzwerk-Hashrate bereitstellt.
did.you.know.bitcoin.9.2 = Die zweiten sind BinancePool mit 11,9% und die ersten drei werden vom Poolin-Pool mit 11,7% der Netzwerk-Hashrate geschlossen.
did.you.know.bitcoin.10 = 8.1.2021 Zum ersten Mal in der Geschichte übertraf Bitcoin den Wert von 1 Million slowakischen Kronen. Dies geschah am 6.2.2021 zum zweiten Mal. Bis zum dritten vom 8.2.2021 bleibt es bis heute über diesem Niveau.
did.you.know.bitcoin.11=Steve Wozniak, Mitbegründer des weltweit größten börsennotierten Unternehmens Apple, ist ein Fan von Bitcoin. Im Jahr 2021 sagte er, dass Bitcoin eine wundersame Technologie mit einer einzigartigen mathematischen Formel ist.
did.you.know.bitcoin.12=Im Jahr 2010 wurden 184 Milliarden Bitcoins abgebaut, nachdem ein Angreifer einen Codefehler ausgenutzt hatte. Es war ein Block mit der Nummer 74638. Satoshi Nakamoto hat den Fehler 5 Stunden nach seiner Entdeckung behoben.
did.you.know.bitcoin.13=Millennials, Menschen, die zwischen 1980 und 1995 geboren wurden, lieben BTC und investieren gerne in sie.
did.you.know.bitcoin.14=Bitcoin verbraucht weit weniger Energie als Goldminen oder traditionelles Bankwesen. (2021, Galaxy-Digital)
did.you.know.bitcoin.15=AXA, die zweitgrößte Versicherungsgesellschaft in Europa, wird Bitcoin akzeptieren. (2021)
did.you.know.bitcoin.16=Der teuerste NFT wurde für 69 Millionen US-Dollar verkauft. (2021)
did.you.know.bitcoin.17=Es wird geschätzt, dass bis zu 20% aller Bitcoins unwiederbringlich verloren gehen. Dies sind ungefähr 3-4 Millionen BTC. (2021)
did.you.know.bitcoin.18=90% aller Bitcoins wurden bereits abgebaut. (2021)
did.you.know.bitcoin.19=In New York kann man auch Immobilien für Kryptowährungen kaufen. Speziell für Bitcoin, Ethereum, DogeCoin. Algocap Real Estate hat beschlossen, Zahlungen in Kryptowährungen zu akzeptieren.
did.you.know.bitcoin.20=Ray Dalio, der Gründer des weltgrößten Hedgefonds, besitzt auch Bitcoin. (2021)
did.you.know.bitcoin.21.1=Daymak Avvenire Elektroauto namens
did.you.know.bitcoin.21.2=kann während des Ladevorgangs die Kryptowährungen Bitcoin und Dogecoin abbauen.
did.you.know.monero.1 = Die maximale Anzahl von Monera-Münzen ist nicht begrenzt. Ihre Ausgabe ist jedoch geregelt. Die Münzprämie wird bis Ende Mai 2022 reduziert, wenn 18.132.000 im Umlauf sind. Danach endet die Belohnung bei 0,6 XMR.

did.you.know.neo.1 = Wenn Sie NEO-Token in Ihre NEON-Brieftasche einfügen, können Sie automatisch eine andere Kryptowährung verdienen, und das ist GAS. Mit anderen Worten, Sie erhalten passives Einkommen.
did.you.know.neo.2 = Neo ist ein Beweis für die Einsatzplattform, die oft als chinesisches Ehereum wahrgenommen wird. Wie Ethereum bietet NEO die Möglichkeit, sogenannte Smart-Verträge zu erstellen.

did.you.know.ethereum.1 = Ethereum 2.0 wurde am 1.12.2020 gestartet. Zu den wichtigsten Änderungen gehört der Nachweis des Einsatzes anstelle des vorherigen Arbeitsnachweises. Innerhalb von 2 Jahren steigt die Anzahl der Transaktionen von 15 auf 100.000 pro Sekunde.
did.you.know.ethereum.2=Nach dem Londoner Hard Fort werden jede Minute ETH im Wert von 10.000 US-Dollar verbrannt. (2021)
did.you.know.iota.1 = ist die einzige Kryptowährung, deren Transaktionsgebühren gleich 0 sind. Mit anderen Worten, sie sind kostenlos.
did.you.know.iota.2 = Wie der Name schon sagt, ist IOTA bereit für das sogenannte IOT-Internet der Dinge, bei dem alles über das Internet verbunden und zugänglich ist. Zum Beispiel kann Ihr Kühlschrank ohne Ihr Wissen und mehr bezahlen und einkaufen. IOTA ist die einzige, die Mikrotransaktionen ermöglicht, die in Zukunft alltäglich werden. Wer zuerst Mikrotransaktionen durchführt und wie es nicht wichtig ist. Wir haben jedoch bereits heute eine Plattform, die die Idee der Mikrotransaktion dank Null Gebühren zum Leben erwecken kann. Um die Transaktion auszuführen, ist es ausreichend, wenn sie von zwei anderen Netzwerkknoten überprüft wird.
did.you.know.iota.3 = IOTA präsentiert auf seiner Plattform intelligente Verträge, die bis Ende 2021 Realität werden könnten.

did.you.know.litecoin.1 = Litecoin stammt aus dem Bitcoin-Quellcode von 2011.
did.you.know.litecoin.2 = Litecoin hat eine maximale Anzahl von Münzen von 84 Millionen. Es wird nicht mehr geben.
did.you.know.litecoin.3 = Es sind weniger Bitcoin-Münzen im Umlauf als Litecoin-Münzen. Zum Vergleich: Die Anzahl der Bitcoin-Münzen beträgt 18,5 Millionen gegenüber 18,5 Millionen. Anzahl der Litecoin-Münzen 66,2 Millionen. (2021)

did.you.know.tether.1 = Tether ist eine stabile Münze, die in Zusammenarbeit mit Tether Limited und der Börse erstellt wurde
did.you.know.tether.2 = 1 Tether deckt genau $ 1 ab.
did.you.know.tether.3 = Tether wurde erstellt, damit Händler ihre Kryptowährungen während ihres Handels nicht unnötig für FIAT ändern müssen.

did.you.know.btccash.1 = Bitcoin Cash wurde als harte Gabel von Bitcoin erstellt.

did.you.know.btccash.2 = Der Hauptgrund für Bitcoin Cash war die Erhöhung des Transaktionsblocks von 1 MB auf 8 MB. Infolgedessen kann Bitcoin Cash mehr Transaktionen pro Sekunde verarbeiten als Bitcoin.

did.you.know.btcsv.1 = SV steht für Satoshi Vision, was sich in Satoshis Vision übersetzt.
did.you.know.btcsv.2 = Bitcoin SV entstand als harte Gabel der Kryptowährung Bitcoin Cash.
did.you.know.btcsv.3 = Hinter dem Aufkommen der Kryptowährung Bitcoin SV steht erneut eine Erhöhung des Transaktionsblocks von 8 MB auf 128 MB, was eine noch höhere Anzahl validierter Transaktionen pro Sekunde bedeutet.

