dictionary.genesis.description = - Der allererste Block in
dictionary.genesis.description.2 = Blockchaine
dictionary.halving.title = Halbieren
dictionary.halving.description = - ist ein Ereignis, bei dem die Aufteilung der Belohnungen für die Besetzten erfolgt
dictionary.halving.description.2 = genau halber Block. Dieses Ereignis wird auch die Inflationsrate und die Geschwindigkeit, mit der neue Bitcoins in Umlauf gebracht werden, halbieren. Dies geschieht einmal alle 210.000 extrahierten Blöcke.
dictionary.hardfork.title = Hard Fork
dictionary.hardfork.description = - Software-Update, das zu einer Änderung führt, die nicht mit der aktuellen Softwareversion (älter) kompatibel ist. Dies bedeutet, dass ein solcher veralteter Knoten mit aktualisierten Knoten nicht vollständig funktionieren kann (möglicherweise nicht) in der Lage sein, Transaktionen zu überprüfen, Transaktionen zu empfangen oder zu senden usw.). Nach dem harten Fort ist immer Platz für eine neue Währung. Dies tritt auf, wenn ein Teil des Netzwerks das Update ablehnt und auf der alten Version verbleibt. Ab dieser Version leben beide Netzwerke ihr eigenes Leben. Wenn das Netzwerk ein inkompatibles Update erhält, spricht man von einer Festplatte ohne neue Kryptowährung.
dictionary.hardwallet.title = Hardware Wallet
dictionary.hardwallet.description = - kryptografisch sichere Hardware zum Sichern der Informationen in Ihrer Brieftasche. Beispiele sind eine Brieftasche
dictionary.hashrate.title = Hashrate
dictionary.hashrate.description = - Eine Zahl, die die Geschwindigkeit des Ziehens angibt, insbesondere die Anzahl der Hashes, die der Computer pro Sekunde auflösen kann.
dictionary.hodl.title = HODL
dictionary.hodl.description = - Ein vom ursprünglichen HOLD abgeleiteter Begriff bedeutet, Münzen zu halten und nicht zu verkaufen.
dictionary.hotwallet.title = Hot Wallet
dictionary.hotwallet.description = - Brieftasche, die mit dem Internet verbunden ist, für tägliche Transaktionen. Aufgrund des Internets ist es jedoch weniger sicher.
dictionary.hype.title = Hype
dictionary.hype.description = - Massenbegeisterung nicht nur um eine Kryptowährung, um sie auf dem Markt sichtbar zu machen. Der Begriff ist im Allgemeinen nicht an eine Krypto gebunden.
dictionary.ico.title = ICO (Initial Coin Offering)
dictionary.ico.description = - Börsengang der digitalen Währung vor der Notierung. Es ähnelt dem Crowdfunding in der digitalen Welt.
dictionary.kaico.title = KAICO
dictionary.kaico.description = - CryptoKami hatte eine eigene Idee, wie man ICO macht. Es ist eine Art Konkurrent für DAICO. Obwohl sie ähnlich sind, bieten sie auch unterschiedliche Eigenschaften.
dictionary.kaico.description.2 = Hier können Sie mehr darüber lesen.
dictionary.cap.title = Großschreibung
dictionary.cap.description = - Alle im Umlauf befindlichen Kryptowährungsmünzen multipliziert mit dem aktuellen Münzwert.
dictionary.cap.description.2 = Hier können Sie mehr darüber lesen.
dictionary.confirmation.title = Bestätigung
dictionary.confirmation.description = - Die Transaktion wird bestätigt, wenn sie von einer bestimmten Anzahl von Knoten (Minern) im Netzwerk bestätigt wurde. Dies ist ein erfolgreiches Passwort, das verschluckt und zur Blockchain hinzugefügt wird.
dictionary.correction.title = Korrektur
dictionary.correction.description = - ist die entgegengesetzte Bewegung, normalerweise negativ, normalerweise ein Rückgang der Aktien oder Wertpapiere um 10 Prozent ... wobei die Überbewertung des Preises rückwärts kompensiert wird. Korrekturen sind vorübergehend und unterbrechen den normalerweise Aufwärtstrend.
dictionary.consensus.title = Konsens
dictionary.consensus.description = - wird erreicht, wenn alle teilnehmenden Knoten zustimmen, die Transaktion in die Blockchain aufzunehmen.
dictionary.kyc.title = KYC (Kennen Sie Ihren Kunden)
dictionary.kyc.description = - kennen Sie Ihren Kunden. Der Prozess, bei dem der Kunde (Käufer) seine Identität überprüft, indem er personenbezogene Daten eingibt und häufig auch Ausweise auf den Server hochlädt.
dictionary.marketcap.title = Marktkapitalisierung
dictionary.marketcap.description = - Gesamtwert aller im Umlauf befindlichen Münzen der angegebenen Kryptowährung.
dictionary.mooning.title = Mooning
dictionary.mooning.description = - Geben Sie an, wann der Preis steigt. Dies ist nicht unbedingt ein extremer Anstieg.
dictionary.multisignature.title = Mehrfachsignatur
dictionary.multisignature.description = - (multisig) Mit mehreren signierbaren Adressen können mehrere Parteien mehr als einen Schlüssel anfordern, um eine Transaktion zu autorisieren. Die erforderliche Anzahl von Signaturen wird bei der Erstellung der Adresse vereinbart. Adressen mit mehreren Signaturen sind wesentlich widerstandsfähiger gegen Diebstahl.
dictionary.nativetoken.title = Native Token
dictionary.nativetoken.description = - Mit Cardano können Sie Ihre eigenen erstellen
dictionary.nativetoken.description.2 = im Cardano-Netzwerk, das als native bezeichnet wird. Native, da sie sich in keiner besonderen Weise vom ursprünglichen ADA-Token unterscheiden. Bei der ETH liegen die Unterschiede zwischen ERC-20 und
dictionary.nativetoken.description.3 = ERC-721-Token
dictionary.nativetoken.description.4 = eine ETH.
dictionary.nft.title = NFT (Nicht fungible Token)
dictionary.nft.description = Dies sind Token, die nicht austauschbar sind. Sie sind unverkennbar, weil sie unterschiedlich sind. Sie unterscheiden sich in den Meta-Eigenschaften des Tokens. Beispielsweise sind ERC-20-Token im Ethereum-Netzwerk Token mit denselben Meta-Eigenschaften, und daher ist 1 ETH mit einer anderen 1 ETH austauschbar. Mit NFT-Token können Sie nicht 1 Token gegen ein anderes austauschen, da diese nicht identisch sind und daher nicht den gleichen Preis / Wert haben. NFTs werden erstellt, um sowohl physische als auch virtuelle Vermögenswerte (Waffen, Kleidung) darzustellen und andere Themen in Spielen, Musik, ...).
dictionary.node.title = Node
dictionary.node.description = - Eine Kopie des vom Netzwerkteilnehmer betriebenen Ledgers (Transaktionsblockchain).
dictionary.margin.title = Margin Trading
dictionary.margin.description = - Handelsgeld, das Ihnen von der Börse selbst verliehen wurde. Um das Darlehen zu erhalten, muss das Kapital als Kaution hinterlegt werden.
dictionary.p2p.title = P2P (Peer-to-Peer)
dictionary.p2p.description = - Ein Netzwerk, in dem jeder Knoten sowohl die Rolle des Servers als auch des Clients übernehmen kann. Es gibt keinen zentralen Punkt in Form eines oder mehrerer Server, wie dies bei der Client-Server-Architektur der Fall ist.
dictionary.paperwallet.title = Papiergeldbörse
dictionary.paperwallet.description = - Gedrucktes Papier mit Brieftascheninformationen. Oft sind diese Informationen eine private Adresse und eine Adresse
dictionary.parachain.title = Parachain
dictionary.parachain.description = ist eine anwendungsspezifische Datenstruktur, die global kohärent und von Validatoren validierbar ist
dictionary.parachain.description.2 = Es hat normalerweise die Form einer Blockchain, muss aber keine echten Blockchains sein. Mit Fallschirmen können Sie eine Verbindung herstellen
dictionary.parachain.description.3 = bereits vorhandene Kryptomen-Blockchains des Ökosystems. Diese können parallel zur Relay-Kette arbeiten (Verifikation ...), was eine hervorragende Skalierung dieses Ökosystems ermöglicht.
dictionary.wallet.title = Brieftasche
dictionary.wallet.description = - digitale Brieftasche für einen oder mehrere digitale Namen. Es ist ein Ort, an dem die Münzen selbst nicht aufbewahrt werden, sondern die privaten und öffentlichen Schlüssel, die zum Senden und Empfangen von Münzen benötigt werden.
dictionary.pow.title = Arbeitsnachweis (PoW)
dictionary.pow.description = - Ist das System, auf dem die Blockchain verwaltet wird. Die Überprüfung und Hinzufügung der Transaktion zur Blockchain erfolgt durch sogenannte Extraktion, die eine beträchtliche Rechenleistung erfordert (von der (von denen)
dictionary.pos.title = Einsatznachweis (PoS)
dictionary.pos.description = - Ist das System, auf dem die Blockchain verwaltet wird. Transaktionen werden empfangen, um Transaktionen von jedem Knoten zu überprüfen, je nachdem, wie viel Kryptozän er besitzt. Je mehr es besitzt, desto mehr kann der Knoten (Wallet) Transaktionen im Laufe der Zeit überprüfen und erhält somit mehr Belohnungen in Form von Kryptowährungen oder anderen dafür entwickelten Kryptowährungen.
dictionary.publickey.title = Öffentlicher Schlüssel
dictionary.publickey.description = - Das öffentlich-private Schlüsselpaar wird in der Kryptografie häufig verwendet, um eine verschlüsselte Kommunikation zwischen zwei Stakeholdern zu erreichen. Der Absender muss den öffentlichen Schlüssel des Empfängers der Nachricht kennen. Beachten Sie, dass der öffentliche Schlüssel normalerweise nicht der Adresse Ihrer Krypto entspricht
dictionary.publickey.description.2 =, wird aber oft daraus berechnet.
dictionary.privatekey.title = Privater Schlüssel
dictionary.privatekey.description = - Das öffentliche und private Schlüsselpaar wird in der Kryptografie häufig verwendet, um eine verschlüsselte Kommunikation zwischen zwei Interessengruppen zu erreichen. Der Absender signiert die Nachrichten mit seinem eindeutigen privaten Schlüssel. In der Krypto sind die privaten Adressen die Daten, mit denen Sie die Brieftasche neu erstellen und Transaktionen damit signieren können. Sei nicht falsch mit Samen.
dictionary.pumpdump.title = Pump & Dump
dictionary.pumpdump.description = - organisierte Preismanipulation, bei der der Wert der Kryptowährung durch Massenkäufe in relativ kurzer Zeit erhöht wird. Nach Erreichen des Höchstpreises kommt es zu einem Massenverkauf und einem plötzlichen Preisverfall.
dictionary.relaychain.title = Relaiskette
dictionary.relaychain.description = ist die zentrale Kette des Ökosystems
dictionary.relaychain.description.2 = Alle Validatoren
dictionary.relaychain.description.3 = sind mit einer Relaiskette verknüpft und werden für eine Relaiskette validiert.
dictionary.resistance.title = Widerstand
dictionary.resistance.description = - Das Widerstandsniveau liegt über dem aktuellen Preis des Vermögenswerts und dient als Obergrenze für steigende Preise. Die entgegengesetzte Logik zu den Unterstützungsniveaus - die Widerstandsniveaus bedeuten, dass der Preis wahrscheinlich eher von diesem Niveau abprallt als es zu brechen.
dictionary.support.title = Unterstützung
dictionary.support.description = - Das Unterstützungsniveau liegt unter dem aktuellen Vermögenspreis und definiert Bereiche, in denen fallende Preise wiederholt unterstützt werden, bevor sie weiter sinken. Dies bedeutet, dass der Preis wahrscheinlich eher von diesem Niveau "abprallt" als es zu brechen.
dictionary.ta.title = TA (technische / Trendanalyse)
dictionary.ta.description = - der Prozess der Untersuchung der Entwicklung eines Preises anhand von Wirtschaftsdaten, um seine zukünftige Entwicklung zu bestimmen.
dictionary.token.title = Token
dictionary.token.description = - Einheit / Münze der Kryptowährung. Ein Token wird normalerweise als Münze bezeichnet, die auf einer vorhandenen Plattform erstellt wurde (normalerweise für einen gleichnamigen Dienst). Zum Beispiel
dictionary.tx.title = Transaktionsgebühr
dictionary.tx.description = - Für alle Kryptowährungstransaktionen wird eine geringe Transaktionsgebühr erhoben. Diese Transaktionsgebühren werden um die Blockbelohnung erhöht, die der Miner erhält, wenn er den Block erfolgreich verarbeitet.
dictionary.mining.title = Mining
dictionary.mining.description = - Dies ist ein Vorgang zum Validieren von Blockchain-Transaktionen. Bergleute tragen Rechenleistung zum Blockchain-Netzwerk bei, um den nächsten Block zu identifizieren. Bergleute werden normalerweise in Form von Münzen belohnt. Mit anderen Worten, das Netzwerk muss die im Netzwerk stattfindenden Transaktionen überprüfen, und für die Überprüfung, die die Rechenleistung des Bergmanns und das für den Kauf von Computern und Strom erforderliche Geld kostet, wird ein Anreiz gegen den Wert der Einheit von erhalten Die Währung.
dictionary.satoshi.title = Satoshi
dictionary.satoshi.description = - Die kleinste Einheit von Bitcoin. Es gilt, dass 1 BTC = 1 00 000 000 Satoshi.
dictionary.nakamoto.title = Satoshi Nakamoto
dictionary.nakamoto.description = Unbekannter Bitcoin-Ersteller. Es kann eine Person oder eine Gruppe sein. Es ist noch nicht öffentlich bekannt, wer unter diesem Pseudonym erscheint.
dictionary.softfork.title = Weiche Gabel
dictionary.softfork.description = - Software-Update, das zu einer Änderung führt, die mit der aktuellen Softwareversion (älter) kompatibel ist. Dies bedeutet, dass selbst ein veralteter Knoten mit aktualisierten Knoten vollständig funktionieren kann.
dictionary.smartcontract.title = Smart Contract
dictionary.smartcontract.description = - Geschäftsregeln, die in der Programmiersprache geschrieben sind und in zu finden sind
dictionary.smartcontract.description.2 = als von Netzwerkteilnehmern aufgerufene Software. Es ist nicht erforderlich, dass zwischen dem Absender und dem Empfänger ein Dritter erforderlich ist.
dictionary.staking.title = Abstecken
dictionary.staking.description = - Im Proof of Stake-System bedeutet dies normalerweise, dass Sie Ihre Münzen in Ihrer Brieftasche lassen, damit Sie in naher Zukunft dafür belohnt werden, entweder in derselben Währung oder in einer anderen bestimmten Währung. Die Belohnungen passen sich im Laufe der Zeit an. Für einige muss die Brieftasche online sein, für andere möglicherweise nicht.
dictionary.stop.title = Stop Loss
dictionary.stop.description = - eine Funktion an Börsen, mit der Sie den Wert festlegen können, zu dem die Kryptowährung verkauft werden soll.
dictionary.seed.title = Seed
dictionary.seed.description = - eine Gruppe sortierter Wörter, deren Reihenfolge abhängt und ich die Brieftasche neu erstellen kann /
dictionary.seed.description.2 =, da der Brieftaschenerstellungsprozess deterministisch ist. Es hat eine andere Anzahl von Wörtern 12, 13, 15 ...
dictionary.volatile.title = Volatility
dictionary.volatile.description = - Ein Begriff, der angibt, wie oft sich der Preis einer digitalen Währung ändert. Das Gegenteil dieses Konzepts ist das Konzept der Stabilität.
dictionary.vel.title = Wal
dictionary.vel.description = - Bezeichnung für den Besitzer einer großen Menge aller Münzen einer bestimmten Kryptowährung, der möglicherweise zu einem Manipulator ihres Preises wird.
dictionary.supercycle.title=Supercycle
