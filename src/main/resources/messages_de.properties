dictionary.erc223.title = ERC-223
dictionary.erc223.description = - Nachfolger des ERC20-Standards. Es sollte unter anderem billigere Transaktionen und zum Beispiel die Möglichkeit bringen, lange verlorene Token auszuwählen, auf die niemand Zugriff hat. Mehr Info
dictionary.erc721.title = ERC-721
dictionary.erc721.description = ist ein Standard-Token im Ethereum-Netzwerk, mit dem Sie nur NFT-Token erstellen können und Entwickler gezwungen sind, für jedes neue Token einen neuen Smart-Vertrag zu erstellen und bereitzustellen. Im Vergleich dazu ermöglicht der ERC-1155-Token-Standard die Erstellung von NFT-Token und fungiblen Token. Es ist nicht erforderlich, für jedes Token einen neuen Smart-Vertrag zu erstellen und bereitzustellen. Nur einer ist genug.
dictionary.erc1155.title = ERC-1155
dictionary.erc1155.description = ERC-1155 ist ein Token-Standard, mit dem Sie sowohl nicht fungible Token (NFT) als auch fungible Token im Ethereum-Netzwerk erstellen können. Der ERC-1155-Token-Standard wurde als Automat entwickelt, mit dem Entwickler einen einzelnen Smart-Vertrag bereitstellen können, mit dem unbegrenzt austauschbare (identische) Token sowie (eindeutige) NFT-Token erstellt werden können. Im Vergleich dazu erzeugt der ERC-721-Token-Standard nur NFT-Token und zwingt Entwickler, für jedes neue Token einen neuen Smart-Vertrag bereitzustellen und zu erstellen.
dictionary.ep5.title = EP-5
dictionary.ep5.description = - Ähnlich wie bei ERC20 oder ERC223 ist dies ein Standard-Token, jedoch für
dictionary.exchange.title = Exchange
dictionary.exchange.description = - eine Website mit einer digitalen Börse, auf der sie kaufen und verkaufen
dictionary.fomo.title = FOMO (Die Angst, etwas zu verpassen)
dictionary.fomo.description = - Gefühl der Angst vor verpassten Gelegenheiten. Es ist oft die Ursache für den Kauf von Währungen auf ihrem Höhepunkt oder den Verkauf mit Verlust.
dictionary.fork.title = FORK
dictionary.fork.description = - Ein Software-Update, das zu einer Änderung führt, die möglicherweise mit der aktuellen Softwareversion kompatibel oder nicht kompatibel ist. Siehe harte Gabel, weiche Gabel.
dictionary.fud.title = FUD (Angst, Unsicherheit und Zweifel)
dictionary.fud.description = - eine Mischung aus Emotionen wie Angst, Unsicherheit und Zweifel, verursacht durch negative Nachrichten aus der Welt der Kryptowährungen. Infolge dieser Panik kann der Preis oft fallen.
dictionary.fudster.title = FUDster
dictionary.fudster.description = - ist jemand, der FUD-Medien verbreitet.
dictionary.fiat.title = FIAT
dictionary.fiat.description = - von Regierungen ausgegebene offizielle Währungen (EUR, USD usw.)
dictionary.fundament.title = Fundamentalanalyse
dictionary.fundament.description = - Analyse basierend auf öffentlich verfügbaren Informationen zur Bestimmung des zukünftigen Preises
dictionary.fundament.description.2 = / akcie ...
