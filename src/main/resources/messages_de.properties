dictionary.coldwallet.title = Kalte Brieftasche
dictionary.coldwallet.description = - Digitale Währungen, die außerhalb des Internets gespeichert sind. Beispiele sind eine Papiergeldbörse, eine Hardware-Geldbörse. Der Grund für die Existenz solcher Brieftaschentypen ist eine größere Sicherheit. Das Gegenteil ist die sogenannte Hot Wallet.
dictionary.coin.title = Münze
dictionary.coin.description = - eine Einheit digitaler Kryptowährung. Es wird oft als Synonym und kürzerer Begriff für eine Kryptowährung verwendet.
