dictionary.btc.description = - die erste digitale Währung, die 2009 von einer Person oder Gruppe unter dem Pseudonym Satoshi Nakamoto eingeführt wurde.
dictionary.blockchain.title = Blockchain
dictionary.blockchain.description = - Eine verteilte (dezentrale) Datenbank oder ein Netzwerk, in dem alle öffentlichen Kryptowährungsbücher gespeichert sind.
