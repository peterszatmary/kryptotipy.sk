dictionary.dao.title = DAO - (Dezentrale autonome Organisationen)
dictionary.dao.description = in Übersetzung bedeutet dezentrale autonome Organisationen - Sie können sich diese als Unternehmen vorstellen, die ohne menschliches Eingreifen (Autonomie) funktionieren können und alle Formen der Kontrolle in unbestechliche Geschäftsregeln verlagert haben.
