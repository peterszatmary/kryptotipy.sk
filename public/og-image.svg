<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#fafafa"/>
  
  <!-- Subtle Gradients -->
  <circle cx="200" cy="150" r="300" fill="#10b981" fill-opacity="0.06"/>
  <circle cx="1000" cy="450" r="350" fill="#f59e0b" fill-opacity="0.06"/>
  
  <!-- Card Outline -->
  <rect x="60" y="60" width="1080" height="510" rx="32" stroke="#e4e4e7" stroke-width="2" fill="#ffffff" fill-opacity="0.8"/>
  
  <!-- Badge -->
  <rect x="120" y="120" width="180" height="40" rx="12" fill="#f4f4f5" stroke="#e4e4e7"/>
  <text x="210" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#52525b" text-anchor="middle" letter-spacing="1">INTERAKTÍVNA HRA</text>
  
  <!-- Main Title -->
  <text x="120" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="58" font-weight="900" fill="#18181b">Krypto Vyššia / Nižšia</text>
  
  <!-- Slogan & Subtitle -->
  <text x="120" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="700" fill="#2a6a51">Máš krypto v malíčku, alebo len na peňaženke?</text>
  <text x="120" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#71717a">Otestuj svoju trhovú intuíciu na TOP 100 kryptomenách v 6 hrách.</text>
  
  <!-- Visual 3D Discs preview -->
  <!-- Left Disc (Bitcoin) -->
  <circle cx="850" cy="270" r="100" fill="#ffffff" stroke="#e4e4e7" stroke-width="4"/>
  <circle cx="850" cy="235" r="40" fill="#f59e0b" fill-opacity="0.15"/>
  <text x="850" y="248" font-family="system-ui, sans-serif" font-size="36" font-weight="900" fill="#d97706" text-anchor="middle">₿</text>
  <text x="850" y="315" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#18181b" text-anchor="middle">Bitcoin</text>
  <text x="850" y="340" font-family="monospace" font-size="16" font-weight="700" fill="#10b981" text-anchor="middle">$1.62T</text>
  
  <!-- VS Orb -->
  <circle cx="970" cy="270" r="28" fill="#18181b"/>
  <text x="970" y="277" font-family="monospace" font-size="16" font-weight="900" fill="#f59e0b" text-anchor="middle">VS</text>
  
  <!-- Right Disc (Ethereum) -->
  <circle cx="1090" cy="270" r="100" fill="#ffffff" stroke="#e4e4e7" stroke-width="4"/>
  <circle cx="1090" cy="235" r="40" fill="#0284c7" fill-opacity="0.15"/>
  <text x="1090" y="248" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#0284c7" text-anchor="middle">Ξ</text>
  <text x="1090" y="315" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#18181b" text-anchor="middle">Ethereum</text>
  <text x="1090" y="340" font-family="monospace" font-size="16" font-weight="700" fill="#71717a" text-anchor="middle">???</text>
  
  <!-- Footer Brand -->
  <text x="120" y="500" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#18181b">kryptotipy<tspan fill="#f59e0b">.sk</tspan></text>
  <text x="260" y="500" font-family="system-ui, sans-serif" font-size="16" font-weight="500" fill="#a1a1aa">• Jamstack Astro SSG</text>
</svg>
